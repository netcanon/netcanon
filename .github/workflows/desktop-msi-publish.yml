name: Desktop — build MSI + attach to Release

# Builds the Windows desktop MSI installer for every released RC and
# final tag, attaches it to the GitHub Release for that tag (creating
# the release if necessary).  Operators can download the MSI from the
# Release page rather than building from source.
#
# Trigger surfaces:
#   * Tag push matching `v*.*.*` or `v*.*.*-*` (covers final + pre-release
#     tags, same pattern as pypi-publish.yml / docker-publish.yml).
#   * Manual `workflow_dispatch` — lets the maintainer backfill a missed
#     tag (e.g. retroactively build the MSI for a tag pushed before this
#     workflow existed) or rebuild a corrupted artefact.
#
# Output:
#   * `Netcanon-<version>-win64.msi` attached to the GitHub Release for
#     the triggering tag.  Also kept for 30 days as a workflow artefact
#     for diagnostic purposes.
#
# What it does NOT do (yet):
#   * No code signing.  The MSI is unsigned; Windows SmartScreen will
#     show a warning on first install.  Future work: integrate SignPath
#     (free for OSS projects) or a purchased EV cert.
#   * No Mac / Linux desktop installers — only Windows.  cx_Freeze
#     supports them but they're not currently wired.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build MSI for (e.g. v0.1.0-rc7)"
        required: true
        type: string

# Least-privilege default: at the workflow level only the pytest `test`
# gate's checkout runs, and it needs no more than read.  The elevated
# scopes the MSI build needs (Releases-API write + CI-run read) are
# declared on the `build-msi` job itself so the test gate can't reach
# them (PKG-4).
permissions:
  contents: read

# Prevent two simultaneous MSI builds for the same ref from racing
# the release-upload step.  Within a single ref, we let the second
# wait (rather than cancel) so a maintainer who re-triggers a build
# doesn't lose the queued one.
concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt-in to Node.js 24 for JavaScript actions ahead of the June 2026
  # forced cutover.  Same pragma as the other workflows.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Publish-time test gate (blind-audit 3ec11f3 T0-4) ──
  # See pypi-publish.yml for the full rationale.  The MSI just packages
  # already-tested Python code, but the same off-tree/admin-bypass and
  # workflow_dispatch holes apply, so we re-run the unit + integration suite
  # inside the publish run before building.  It checks out the SAME ref the
  # build does (`inputs.tag || github.ref`) so a workflow_dispatch backfill
  # tests exactly what it ships.  Runs on ubuntu (the suite is OS-agnostic
  # and green on Linux in CI) — faster + cheaper than a Windows runner; only
  # the MSI build itself needs windows-latest.  NOTE: backfilling a *very
  # old* tag re-runs today's suite against that tag's code, which can fail on
  # environment drift — expected, the gate is doing its job.  Fast subset (no
  # e2e/desktop matrix); no pip cache (single-shot).
  test:
    name: Test gate (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -q --no-header
      - name: Run integration tests
        run: pytest tests/integration -q --no-header

  build-msi:
    name: Build Windows MSI
    needs: [test]
    runs-on: windows-latest
    # Write access to the Releases API (create the release page + upload
    # the MSI asset) plus read of the CI run conclusion for the gate
    # below.  Scoped here so the pytest `test` gate never gets it (PKG-4).
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout (full history for setuptools_scm)
        uses: actions/checkout@v7.0.1
        with:
          # When triggered by workflow_dispatch the user supplies a tag
          # name as `inputs.tag`; checkout's `ref` accepts either a tag
          # name (`v0.1.0-rc7`) or a full ref (`refs/tags/...`).  On
          # tag-push triggers, github.ref already has the full ref form.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          # softprops/action-gh-release uses its own GITHUB_TOKEN env
          # (not git config); no git push from this job either.
          persist-credentials: false

      # PKG-5 (review #55): a workflow_dispatch can pass any `inputs.tag` —
      # including a branch name.  checkout would then build from a mutable
      # branch tip while softprops/action-gh-release later creates the tag at
      # default-branch HEAD, so the MSI and the tag would point at different
      # commits.  Refuse anything that isn't an existing tag (the pypi/docker
      # jobs gained this guard in #288).  fetch-depth:0 above fetched tags.
      - name: Refuse a non-tag ref
        shell: bash
        env:
          TAG_RAW: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${TAG_RAW#refs/tags/}"   # tolerate a full-ref input form
          if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "::error::Ref '${TAG_RAW}' is not a tag — refusing to build/publish an MSI from a non-tag ref."
            exit 1
          fi
          # Guard against `actions/checkout` resolving an ambiguous short ref
          # as a BRANCH tip that merely shares a name with the tag (P4b):
          # require the checked-out HEAD to BE the tag's own commit, else the
          # MSI and the tag point at different commits (the residual crack in
          # the exact hole #55 closed).
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [ "${head_sha}" != "${tag_sha}" ]; then
            echo "::error::Checked-out HEAD ${head_sha} is not tag '${tag}' commit ${tag_sha} — refusing (an ambiguous ref resolved to a branch tip)."
            exit 1
          fi
          # Normalize the tag ONCE so the release-attach step's tag_name can't
          # be a full ref (P4a): a raw `refs/tags/vX.Y.Z` dispatch input made
          # softprops create a junk `refs/tags/refs/tags/vX.Y.Z` tag at HEAD.
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "OK: '${tag}' is a tag at the checked-out commit ${head_sha}."

      # Refuse to build/attach an MSI for a tag that isn't on main (see
      # pypi-publish.yml for rationale).  Covers both tag-push and the
      # workflow_dispatch backfill path — `git rev-parse HEAD` is the
      # checked-out tag's commit either way.
      - name: Verify the build commit is on main
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$head_sha" FETCH_HEAD; then
            echo "::error::Build commit $head_sha is not an ancestor of origin/main — refusing to publish."
            exit 1
          fi
          echo "OK: build commit $head_sha is on origin/main."

      # Prove the full CI matrix concluded 'success' for this commit, not just
      # that it is on main (audit T0-4: ancestry != CI success). See
      # pypi-publish.yml for the full rationale. For a workflow_dispatch backfill
      # the checked-out ref is inputs.tag, so this gates the backfilled commit
      # too. Needs `actions: read`.
      - name: Require CI success for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 30); do
            out="$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head_sha&event=push&per_page=1" \
              --jq '(.workflow_runs[0].status // "none") + " " + (.workflow_runs[0].conclusion // "none")' \
              2>/dev/null || true)"
            status="${out%% *}"; conclusion="${out##* }"
            if [ "$conclusion" = "success" ]; then
              echo "CI concluded success for $head_sha."; exit 0
            fi
            if [ "$status" = "completed" ]; then
              echo "::error::CI for $head_sha concluded '$conclusion' (not success) — refusing to publish."
              exit 1
            fi
            echo "CI for $head_sha is '${status:-unknown}' (attempt $attempt/30); waiting 20s..."
            sleep 20
          done
          echo "::error::Timed out waiting for CI to complete for $head_sha — refusing to publish."
          exit 1

      # Belt-and-suspenders for the one check whose failure already cost a
      # history rewrite: the gate above covers ci.yml, but pii-guard is a
      # SEPARATE workflow with no publish-time backstop (review #54). Poll its
      # run for this commit the same fail-closed way. Needs actions:read.
      - name: Require PII-guard success for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 30); do
            out="$(gh api \
              "repos/$REPO/actions/workflows/pii-guard.yml/runs?head_sha=$head_sha&event=push&per_page=1" \
              --jq '(.workflow_runs[0].status // "none") + " " + (.workflow_runs[0].conclusion // "none")' \
              2>/dev/null || true)"
            status="${out%% *}"; conclusion="${out##* }"
            if [ "$conclusion" = "success" ]; then
              echo "PII-guard concluded success for $head_sha."; exit 0
            fi
            if [ "$status" = "completed" ]; then
              echo "::error::PII-guard for $head_sha concluded '$conclusion' (not success) — refusing to publish."
              exit 1
            fi
            echo "PII-guard for $head_sha is '${status:-unknown}' (attempt $attempt/30); waiting 20s..."
            sleep 20
          done
          echo "::error::Timed out waiting for PII-guard to complete for $head_sha — refusing to publish."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          # No `cache: "pip"` -- this is a single-shot publish job
          # (runs once per release tag with a cold dep tree); the
          # cache buys nothing and would otherwise expand the
          # cache-poisoning attack surface flagged by zizmor #58.

      - name: Compute MSI version from tag
        shell: bash
        env:
          # Pass the resolved tag in via env-var rather than `${{ }}`
          # template expansion inside the run: block.  GHA expands
          # `${{ }}` BEFORE the shell parses the line, so a tag containing
          # shell metacharacters (`;`, backticks, `$(...)`) would execute
          # arbitrary code with access to DOCKERHUB_TOKEN / GITHUB_TOKEN /
          # signing keys.  Via env-var, the value enters shell context
          # as a literal -- injection is impossible.  See
          # docs/security-triage/2026-05-21/99-synthesis.md Group V
          # (closes zizmor/template-injection alerts #52, #53).
          TAG_RAW: ${{ inputs.tag || github.ref_name }}
        run: |
          # On workflow_dispatch the tag is inputs.tag.  On tag-push it's
          # github.ref_name (the tag name without the refs/tags/ prefix).
          # Strip leading 'v' if present.
          tag="${TAG_RAW#v}"        # e.g. 0.1.0-rc7
          # Drop the rc/alpha/beta suffix (everything after the first '-')
          # because Windows MSI ProductVersion format is M.m.b[.r] only.
          msi_version="${tag%%-*}"  # e.g. 0.1.0
          echo "NETCANON_MSI_VERSION=$msi_version" >> "$GITHUB_ENV"
          echo "Building MSI with ProductVersion: $msi_version (source tag: $tag)"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # The [desktop-build] extra pulls in PySide6 + pystray +
          # Pillow + cx_Freeze.  Editable install so setup_desktop.py
          # can find the source tree.
          pip install -e ".[desktop-build]"

      - name: Build MSI via cx_Freeze
        # cx_Freeze's bdist_msi writes the MSI database directly — there is no
        # WiX download or toolchain step (the old note here was wrong; review
        # #56).  Dependency-closure pinning for the [desktop-build] extra is a
        # separate follow-up (it needs a Windows/CPython-3.13 pip resolution).
        run: python setup_desktop.py bdist_msi

      - name: Sanity-check MSI exists + reasonable size
        shell: bash
        run: |
          set -euo pipefail
          # EXACTLY one MSI, not "at least one": the attach step below globs
          # `dist/*.msi`, so a second MSI would be uploaded too and then frozen
          # by publication.  The old `ls | head -1` inspected one file while a
          # different set shipped.
          shopt -s nullglob
          msis=(dist/*.msi)
          if [ "${#msis[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 MSI under dist/, found ${#msis[@]} — refusing to build a release from an ambiguous artefact set."
            ls -la dist/ || true
            exit 1
          fi
          msi="${msis[0]}"
          # PySide6 + Chromium WebEngine + Python interpreter should
          # produce ~200-300 MB.  Anything under 50 MB suggests
          # cx_Freeze silently dropped a major package.
          size=$(stat -c%s "$msi" 2>/dev/null || wc -c <"$msi")
          sha=$(sha256sum "$msi" | cut -d' ' -f1)
          printf "MSI: %s\nSize: %s bytes\nSHA256: %s\n" "$msi" "$size" "$sha"
          if [ "$size" -lt 52428800 ]; then
            echo "FAIL: MSI suspiciously small ($size < 50MB).  cx_Freeze probably skipped a critical package."
            exit 1
          fi
          # Carried to the pre-publish gate so it compares GitHub's stored copy
          # against what this job actually built, not against a re-read of disk.
          {
            echo "MSI_NAME=$(basename "$msi")"
            echo "MSI_SIZE=$size"
            echo "MSI_SHA256=$sha"
          } >> "$GITHUB_ENV"

      - name: Upload MSI as workflow artefact
        # Diagnostic copy — survives 30 days regardless of whether the
        # release-asset upload below succeeds.
        uses: actions/upload-artifact@v7.0.1
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Attach MSI to a DRAFT GitHub Release
        # softprops/action-gh-release creates the release page if it
        # doesn't yet exist (handy for tags pushed before this workflow
        # existed) and otherwise appends the MSI to the existing one.
        #
        # `draft: true` + a separate publish step below is GitHub's documented
        # immutable-releases shape: assets must all be attached BEFORE the
        # release is published, because publishing under immutability freezes
        # them. Creating it published and then uploading races that rule.
        # Harmless while immutability is off; required once it is on.
        #
        # ⚠️ The workflow_dispatch backfill path can still only *create* a
        # release. Once immutability is enabled, appending an MSI to an
        # already-published release is impossible by design — if an MSI is
        # missed on a published tag, cut a new patch tag rather than trying to
        # mutate the published one.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          # Normalized tag (never a full ref) from the "Refuse a non-tag ref"
          # step so softprops can't mint a junk `refs/tags/refs/tags/…` tag (P4a).
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: dist/*.msi
          fail_on_unmatched_files: true
          # When the release page is auto-created here (e.g. backfill
          # via workflow_dispatch on a tag with no release page yet),
          # populate it with the auto-generated PR / commit changelog.
          generate_release_notes: true
          # Mark ANY pre-release tag (a `-` suffix — rc / alpha / beta / pre /
          # dev) as "Pre-release" so the "Latest release" badge + /releases/
          # latest skip over it.  Unified with the Docker `:latest` predicate
          # (any `-`); the old `-rc|-alpha|-beta`-only form let a `v0.6.0-pre1`
          # / `-dev1` tag take the "Latest release" slot (P3).
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

      # The draft is the LAST moment these assets can be changed.  Everything
      # checked so far was checked against the local `dist/` copy — not against
      # what GitHub actually stored.  Download the release's own copy back and
      # compare it byte-for-byte with what this job built, so a truncated or
      # mangled upload is caught while it is still fixable.
      #
      # This is the MSI analogue of demo-publish.yml's "re-verify the assets
      # GitHub stored" gate.  There is no signed SHA256SUMS manifest here, so
      # the comparison is against MSI_SHA256 recorded at build time instead.
      - name: Gate — re-verify the asset GitHub stored, before freezing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          # One MSI and nothing else.  A backfill re-run against a tag whose
          # draft already carries a stale MSI would otherwise publish both, and
          # under immutable releases that pairing is permanent.
          EXPECTED_ASSETS: "1"
        shell: bash
        run: |
          set -euo pipefail
          # `gh --jq` uses gh's own embedded jq, so this needs no jq on PATH
          # (the Windows runner's toolchain is not guaranteed to carry one).
          summary="$(gh release view "$TAG" --json isDraft,assets \
            --jq '"isDraft=\(.isDraft) assets=\(.assets|length)"')"
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          found="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          printf 'release %s %s\n%s\n' "$TAG" "$summary" "$(printf '%s\n' "$names" | sed 's/^/  /')"
          if [ "$found" -ne "$EXPECTED_ASSETS" ]; then
            echo "::error::release has $found assets, expected $EXPECTED_ASSETS — refusing to publish an incomplete or polluted release."
            exit 1
          fi
          if [ "$names" != "$MSI_NAME" ]; then
            echo "::error::attached asset is '$names', expected '$MSI_NAME'."
            exit 1
          fi
          rm -rf roundtrip && mkdir roundtrip
          gh release download "$TAG" --dir roundtrip --clobber
          got="roundtrip/$MSI_NAME"
          got_size=$(stat -c%s "$got" 2>/dev/null || wc -c <"$got")
          got_sha=$(sha256sum "$got" | cut -d' ' -f1)
          if [ "$got_size" != "$MSI_SIZE" ] || [ "$got_sha" != "$MSI_SHA256" ]; then
            echo "::error::stored asset does not match what was built."
            echo "  built:  $MSI_SIZE bytes  $MSI_SHA256"
            echo "  stored: $got_size bytes  $got_sha"
            exit 1
          fi
          echo "OK: what GitHub stored is byte-identical to the MSI this job built ($got_sha)."

      # Publish only after the MSI is attached AND verified in place.  Under
      # immutable releases this transition is what freezes the asset, and it is
      # the last thing the workflow does, so a failure anywhere above leaves an
      # unpublished draft rather than a permanently wrong public release.
      # `--draft=false` does not touch the prerelease flag or the generated
      # notes set above.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        # v0.6.2 postmortem: the bare `gh release edit` failed once with
        # "release not found" ONE SECOND after the gate successfully downloaded
        # this very draft's asset — gh's by-tag lookup is unreliable for drafts
        # (the tags API only returns published releases; the fallback scan can
        # race). So: try by tag, fall back to the draft's immutable numeric ID,
        # retry with a pause. Nothing above is invalidated by waiting, and an
        # unpublished draft is recoverable while a missed publish is a red
        # release needing a human.
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release edit "$TAG" --draft=false 2>/dev/null; then
              echo "published $TAG by tag (attempt $attempt)"; exit 0
            fi
            rid=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                    --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -1)
            if [ -n "$rid" ] && gh api -X PATCH \
                 "repos/${GITHUB_REPOSITORY}/releases/$rid" -F draft=false >/dev/null; then
              echo "published $TAG by release id $rid (attempt $attempt)"; exit 0
            fi
            echo "attempt $attempt: draft for $TAG not publishable yet; retrying in 10s"
            sleep 10
          done
          echo "::error::could not publish the draft release for $TAG after 5 attempts"
          exit 1
