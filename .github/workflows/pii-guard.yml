name: PII guard

# Recurrence guard for the 2026-06 PII remediation: fail the build if any
# tracked file leaks the maintainer's personal email or an operator-machine
# Windows user-profile path.  Runs on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main, master]

# Read-only: this job only inspects the checked-out tree.
permissions:
  contents: read

jobs:
  scan-tracked-files:
    name: No leaked personal identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: git grep tracked files for leaked identifiers
        run: |
          # Scope: tracked files only.  The review dossier under
          # docs/codebase-review/ intentionally quotes these values; it is
          # gitignored (see .gitignore) so git grep never sees it, and the
          # tracked-path assertion below fails closed if it is ever force-
          # added anyway.  Commit-message / Co-authored-by trailer hygiene is
          # enforced locally by scripts/git-hooks/pre-push (see its header for
          # how to enable it).
          #
          # The patterns use regex character classes (`[i]` = a literal
          # `i`, `[\]` = a literal backslash) for two reasons:
          #   1. The forbidden literals (the personal email and the
          #      Windows user-profile path prefix) then never appear
          #      verbatim ANYWHERE in this committed file — not even in
          #      these comments — so the guard does not itself reintroduce
          #      the very strings the remediation scrubs, and it does not
          #      match its own text (no self-exclude needed).
          #   2. `git grep -E` does NOT treat a bare `\\` as a reliable
          #      literal backslash (it silently fails to match → the
          #      guard would pass VACUOUSLY); a `[\]` class DOES match.
          #      Both forms are verified against real operator-path
          #      content.
          #
          # The grep is case-insensitive (`-i`) and covers every spelling of
          # the user-profile path (#34): the drive-letter branch collapses the
          # single-backslash, doubled-backslash (`+`), and forward-slash forms
          # (a `[\/]` class matches either separator — the doubled-backslash
          # form is exactly how job-record / traceback JSONs serialise Windows
          # paths), and a separate branch covers the Git-Bash MSYS `/c/…` form.
          # Every branch keeps a char class breaking the contiguous literal, so
          # the widened pattern still never matches its own text.
          #
          # `git grep` exits 0 on match, 1 on no-match, 2 on error; we
          # treat the error case as a FAILURE (fail closed), not "clean".
          set +e
          git grep -inI -E 'samuelr[i]pp09|c:[\/]+users|/c/[u]sers' -- .
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "::error::A tracked file leaks a personal identifier or an operator-machine path (matches above). Redact it. (The review dossier that legitimately quotes these values is gitignored and is not scanned.)"
            exit 1
          elif [ "${rc}" -ne 1 ]; then
            echo "::error::PII guard could not run (git grep exit ${rc}) — failing closed."
            exit 1
          fi
          echo "PII guard: clean — no leaked identifiers in tracked files."

      - name: No PII / unlicensed review directory is tracked
        run: |
          # Path-based companion to the content grep above.  Two directories
          # must NEVER be committed:
          #   * docs/codebase-review/ — quotes the scrubbed PII verbatim.
          #   * docs/reviews/2026-06-19-run3-verification/ — third-party
          #     device configs with no redistributable licence; these match
          #     NEITHER pattern in the content grep, so only a path check can
          #     catch them.
          # .gitignore keeps them out on a normal `git add`; this asserts the
          # guarantee actually held (a `git add -f`, a stale pre-.gitignore
          # commit, or a bad merge would slip past the ignore rule).  Fails
          # closed on any tracked path under either directory.
          tracked=$(git ls-files -- docs/codebase-review 'docs/reviews/2026-06-19-run3-verification')
          if [ -n "${tracked}" ]; then
            echo "::error::A PII / unlicensed review directory is tracked in git (must be gitignored, never committed):"
            echo "${tracked}"
            exit 1
          fi
          echo "PII-dir guard: clean — no forbidden review directory is tracked."
