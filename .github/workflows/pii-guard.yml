name: PII guard

# Recurrence guard for the 2026-06 PII remediation: fail the build if a
# tracked file, or a commit being merged, leaks a maintainer identifier.
# Runs on every PR and push to main.  docker-publish.yml,
# desktop-msi-publish.yml and demo-publish.yml refuse to publish a commit
# this workflow has not passed, so its file name and job name are load-bearing.
#
# The scanner (.github/scripts/pii_guard.py) never holds or prints the
# identifiers it hunts.  The previous guard spelled the personal email's local
# part as a character-class regex (so it would not match its own text), which
# published it to anyone who read this file.  Now:
#   1. user-profile paths are matched by SHAPE (any user, any spelling);
#   2. personal identifiers are matched by sha256 DIGEST, listed in
#      .github/pii-guard.hashes (a digest confirms a guess, never reveals a
#      value); the scan also squashes `[`, `]` and `\` so a char-class
#      spelling like the old one is caught too;
#   3. deployment names come from the optional PII_GUARD_TOKENS repository
#      secret (absent on fork and Dependabot PRs; layers 1-2 still enforce).
# A finding prints the file, line and rule, never the matched text.

on:
  pull_request:
  push:
    branches: [main, master]

# Read-only: this job only inspects the checked-out tree and its history.
permissions:
  contents: read

jobs:
  scan-tracked-files:
    name: No leaked personal identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The commit-metadata scan walks the commits being merged.
          fetch-depth: 0

      - name: Self-test (every layer fires on a synthetic canary)
        # A scan that finds nothing must never be a scan that checked nothing.
        run: python3 -I .github/scripts/pii_guard.py --self-test

      - name: Scan tracked files
        # Scope: tracked files only.  The review dossier under
        # docs/codebase-review/ intentionally quotes the scrubbed values; it is
        # gitignored, so git ls-files never lists it, and the next step fails
        # closed if it is ever force-added anyway.
        env:
          PII_GUARD_TOKENS: ${{ secrets.PII_GUARD_TOKENS }}
        run: python3 -I .github/scripts/pii_guard.py --tree

      - name: Scan the identity and message of every commit being merged
        # The 2026-06 leak was 17 `Co-authored-by:` gmail trailers in commit
        # bodies: file content is not the only vector.  scripts/git-hooks/pre-push
        # runs the same scan locally, before a push; this is the server-side
        # backstop for a clone without the hook.
        env:
          PII_GUARD_TOKENS: ${{ secrets.PII_GUARD_TOKENS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I .github/scripts/pii_guard.py --range "$BASE" "$HEAD"

      - name: No PII / unlicensed review directory is tracked
        run: |
          # Path-based companion to the content scan above.  Two directories
          # must NEVER be committed:
          #   * docs/codebase-review/ — quotes the scrubbed PII verbatim.
          #   * docs/reviews/2026-06-19-run3-verification/ — third-party
          #     device configs with no redistributable licence; these match
          #     no identifier the content scan knows, so only a path check can
          #     catch them.
          # .gitignore keeps them out on a normal `git add`; this asserts the
          # guarantee actually held (a `git add -f`, a stale pre-.gitignore
          # commit, or a bad merge would slip past the ignore rule).  Fails
          # closed on any tracked path under either directory.
          tracked=$(git ls-files -- docs/codebase-review 'docs/reviews/2026-06-19-run3-verification')
          if [ -n "${tracked}" ]; then
            echo "::error::A PII / unlicensed review directory is tracked in git (must be gitignored, never committed):"
            echo "${tracked}"
            exit 1
          fi
          echo "PII-dir guard: clean — no forbidden review directory is tracked."
