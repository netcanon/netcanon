name: zizmor — GHA workflow security scan

# zizmor audits .github/workflows/*.yml for GitHub-Actions-specific
# supply-chain anti-patterns that CodeQL doesn't model (template
# injection via `${{ github.event.* }}` in `run:` blocks, excessive
# `permissions:` grants, untrusted-checkout patterns, secrets leaking
# to forks via `pull_request_target`, etc.).
#
# Findings land in Security → Code scanning alongside CodeQL alerts.
# A red CI run here is informational, not blocking — review the
# Security tab.  Loosen `min-severity` (e.g. to `low`) to surface the
# long-tail style findings once the current wave is triaged.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      # Also re-scan when the Dependabot config or the zizmor site
      # config itself changes — zizmor's `dependabot-cooldown` rule
      # reads dependabot.yml, and the `.github/zizmor.yml` config
      # changes the rule policies.  Without these, edits to either
      # only re-trigger on the weekly cron (or via PR).  Discovered
      # 2026-05-21 when a cooldown-only commit didn't re-scan and
      # alert #81 stayed visibly-open for hours.
      - '.github/dependabot.yml'
      - '.github/zizmor.yml'
  schedule:
    # Weekly run catches drift from new rule releases — zizmor adds
    # new checks frequently and a workflow clean last month may have
    # a new finding today.  Monday early-UTC to land before the
    # weekly Dependabot Monday cadence.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF upload to Code Scanning
  actions: read            # zizmor reads workflow files via the API

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  zizmor:
    name: zizmor scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        # zizmor-action does not publish a `v0` major-version alias —
        # only specific `v0.x.y` tags.  Pin to a concrete tag; bump
        # manually (Dependabot can manage this on the github-actions
        # ecosystem).
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa  # v0.5.7
        with:
          # `medium` is the conservative starting baseline.  Loosen to
          # `low` once the initial finding wave is triaged to surface
          # the long-tail style issues.
          #
          # NOTE: the input is `min-severity`, NOT `advisory-level`.  The
          # action defines no `advisory-level` input (verified against
          # v0.5.7's action.yml), so the old key was silently ignored —
          # meaning zizmor ran with its default (no severity floor,
          # reporting everything) rather than the intended medium baseline.
          # This makes the config actually take effect.
          min-severity: medium
