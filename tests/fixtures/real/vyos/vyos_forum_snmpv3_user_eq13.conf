// Snapshot: hand-transcribed config.boot wrapping the thread's SNMPv3 USM grammar; OS VyOS 1.3 (snmp@2). Sanitized: demo encrypted-password blob -> synthetic same-length 40-hex placeholder (identical on auth + privacy), engineid -> clean lab value, synthetic contact added (forum paste lacked one).
interfaces {
    ethernet eth0 {
        address 192.0.2.1/24
        description "LAN"
        hw-id 00:0c:29:ab:ce:16
    }
    loopback lo {
    }
}
service {
    snmp {
        contact "netadmin@example.test"
        location "HOME"
        v3 {
            engineid 800000c503000c29abce16
            user vyos {
                group default
                auth {
                    encrypted-password 0123456789abcdef0123456789abcdef01234567
                    type sha
                }
                privacy {
                    encrypted-password 0123456789abcdef0123456789abcdef01234567
                    type aes
                }
            }
        }
    }
}
system {
    config-management {
        commit-revisions 100
    }
    console {
        device ttyS0 {
            speed 115200
        }
    }
    host-name vyos
    login {
        user vyos {
            authentication {
                encrypted-password $6$fakeSaltVyos$fakeHashExampleValueNotARealCredential0000000000000000000000000000000000000000000000
            }
        }
    }
}
