! Snapshot: 5406Rzl2 (J9850A) modular-chassis Configuration Editor export on KB.15.15.0008 -- `module A/B type` line-cards, letter-slot-port ranges, oobm, ip helper-address, inter-VLAN ip routing. RFC1918; illustrative hostname.
; J9850A Configuration Editor; Created on release #KB.15.15.0008
; Ver #05:18.7f.ff.3f.ef:4d
hostname "HP-5406Rzl2"
module A type j9534a
module B type j9537a
ip routing
snmp-server community "public" unrestricted
oobm
no ip address
exit
vlan 1
name "VLAN1"
no untagged A1
tagged A2-A24,B1-B24
no ip address
ip helper-address 10.30.60.3
exit
vlan 2
name "VLAN2"
untagged A1
tagged A2-A6,A8-A10,A12-A24,B1-B24
ip address 10.30.60.1 255.255.255.0
exit
vlan 3
name "VLAN3"
tagged A2-A9,A11-A12,A14-A24,B1-B24
ip address 10.30.70.1 255.255.255.0
ip helper-address 10.30.60.3
exit
no autorun
no dhcp config-file-update
no dhcp image-file-update
