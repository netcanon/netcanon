interfaces {
    ethernet eth0 {
        address "198.51.100.1/31"
        description "uplink to core"
        mtu 1500
        vrf "BLUE"
    }
    ethernet eth1 {
        address "10.10.10.1/24"
        vif 100 {
            address "10.0.100.1/24"
            description "tenant vlan 100"
        }
        vif 200 {
            address "10.0.200.1/24"
            disable
        }
    }
    ethernet eth2 {
        address dhcp
        description "wan"
    }
    ethernet eth3 {
        disable
    }
    loopback lo {
        address "10.255.0.1/32"
        address "2001:db8::1/128"
    }
    dummy dum0 {
        address "10.255.1.1/32"
    }
    bonding bond0 {
        address "10.50.0.1/24"
        description "server lag"
        mode 802.3ad
        member {
            interface eth4 {
            }
            interface eth5 {
            }
        }
    }
    vxlan vxlan0 {
        vni 10100
        source-address 10.255.0.1
        remote 198.51.100.9
        port 4789
    }
}
protocols {
    static {
        route 0.0.0.0/0 {
            next-hop 198.51.100.0 {
            }
        }
        route 10.99.0.0/16 {
            next-hop 10.10.10.254 {
                distance 20
            }
        }
        route6 2001:db8:ffff::/48 {
            next-hop 2001:db8::2 {
            }
        }
    }
}
service {
    snmp {
        community FAKEPUBLIC {
            authorization ro
        }
        contact "netops@example.com"
        location "rack 4 / row B"
        v3 {
            engineid 0xFEEDFACE00
            user snmpv3admin {
                group operators
                auth {
                    encrypted-password $6$FAKEsnmpAUTHsha
                    type sha
                }
                privacy {
                    encrypted-password $6$FAKEsnmpPRIVaes
                    type aes
                }
            }
        }
    }
}
system {
    host-name vyos-kitchen-sink
    login {
        user vyos {
            authentication {
                encrypted-password $6$FAKEKITCHENSINKHASHvyos
            }
        }
        user netops {
            authentication {
                encrypted-password $6$FAKEKITCHENSINKHASHnetops
            }
        }
    }
    ntp {
        server 0.pool.ntp.org
        server 1.pool.ntp.org
    }
}
vrf {
    name BLUE {
        table 100
    }
}
// Warning: Do not remove the following line.
// vyos-config-version: "system@27:interfaces@29:nat@8:firewall@14"
