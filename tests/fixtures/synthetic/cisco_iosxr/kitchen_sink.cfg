!! IOS XR Configuration 6.6.2
!
hostname xr-kitchensink
domain name lab.example.net
!
username netops
 group root-lr
 secret 10 $6$abcdefghij$0PqRsTuVwXyZ0123456789aBcDeFgHiJkLmNoPqRsTuVwX
!
username readonly
 group operator
 secret 10 $6$klmnopqrst$9ZyXwVuTsRqP9876543210zYxWvUtSrQpOnMlKjIhGfEdCb
!
vrf CUSTOMER-A
 description customer a l3vpn
 address-family ipv4 unicast
  import route-target
   65001:100
  !
  export route-target
   65001:100
  !
 !
!
vrf MGMT
 description out-of-band management
 address-family ipv4 unicast
  import route-target
   65001:999
  !
  export route-target
   65001:999
  !
 !
!
interface Loopback0
 description router-id loopback
 ipv4 address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description core uplink to P1
 ipv4 address 198.51.100.1 255.255.255.252
 ipv6 address 2001:db8:ff::1/64
 mtu 9192
!
interface GigabitEthernet0/0/0/1
 description customer handoff
 vrf CUSTOMER-A
 ipv4 address 203.0.113.1 255.255.255.0
!
interface GigabitEthernet0/0/0/1.100
 description customer vlan 100 subif
 vrf CUSTOMER-A
 encapsulation dot1q 100
 ipv4 address 203.0.113.129 255.255.255.128
!
interface GigabitEthernet0/0/0/3
 description bundle member one
 bundle id 1 mode active
!
interface GigabitEthernet0/0/0/4
 description bundle member two
 bundle id 1 mode active
!
interface TenGigE0/0/0/2
 shutdown
!
interface Bundle-Ether1
 description backbone bundle
 ipv4 address 10.0.0.1 255.255.255.254
!
interface MgmtEth0/RP0/CPU0/0
 vrf MGMT
 ipv4 address 192.168.0.1 255.255.255.0
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 198.51.100.2
  10.50.0.0/16 GigabitEthernet0/0/0/1 203.0.113.2
  192.0.2.0/24 Null0
 !
 vrf CUSTOMER-A
  address-family ipv4 unicast
   10.99.0.0/16 203.0.113.2
  !
 !
!
router bgp 65001
 bgp router-id 10.255.0.1
 address-family vpnv4 unicast
 !
 vrf CUSTOMER-A
  rd 65001:100
  address-family ipv4 unicast
  !
 !
 vrf MGMT
  rd 65001:999
  address-family ipv4 unicast
  !
 !
!
end
