!
!Version ArubaOS-CX FL.10.13.1000
!export-password: default
hostname aoscx-kitchen-sink
user admin group administrators password ciphertext FAKECIPHERTEXTBLOBADMIN
user netops group operators password ciphertext FAKECIPHERTEXTBLOBNETOPS
snmp-server community FAKECOMMUNITY
snmp-server system-location Data Center 1
snmp-server system-contact noc@example.net
snmpv3 user monitor auth sha auth-pass ciphertext FAKEAUTHBLOB priv aes priv-pass ciphertext FAKEPRIVBLOB
!
vrf RED
vrf BLUE
vlan 1
vlan 10
    name USERS
    description User access VLAN
vlan 20
    name VOICE
vlan 30
    name MGMT-NET
    description Out-of-band management
interface 1/1/1
    no shutdown
    description Uplink to spine
    mtu 9198
    ip address 198.51.100.1/31
interface 1/1/2
    no shutdown
    no routing
    vlan access 10
interface 1/1/3
    shutdown
    description Reserved port
interface 1/1/4
    no shutdown
    no routing
    vlan trunk native 1
    vlan trunk allowed 10,20-30
interface 1/1/5
    no shutdown
    mtu 9198
    lag 1
interface 1/1/6
    no shutdown
    lag 1
interface lag 1 multi-chassis
    no shutdown
    description Server-LAG
    no routing
    vlan trunk native 1
    vlan trunk allowed all
    lacp mode active
interface lag 2
    no shutdown
    no routing
    vlan access 20
interface vlan 10
    no shutdown
    vrf attach RED
    ip address 10.10.10.1/24
interface vlan 20
    no shutdown
    ip address 10.20.20.1/24
    active-gateway ip mac 02:00:0a:14:14:01
    active-gateway ip 10.20.20.254
    ipv6 address 2001:db8:20::1/64
interface loopback 0
    ip address 10.255.0.1/32
interface loopback 1
    description Router-ID
    ip address 10.255.0.255/32
interface mgmt
    no shutdown
interface vxlan 1
    source ip 10.255.0.1
    no shutdown
    vni 10010
        vlan 10
    vni 10020
        vlan 20
ip route 0.0.0.0/0 198.51.100.2
ip route 10.99.0.0/16 203.0.113.254 200
