!Command: show running-config
!Running configuration last done at: Thu Jun 12 00:00:00 2026
!Time: Thu Jun 12 00:00:00 2026

version 9.3(11) Bios:version
hostname nxos-kitchensink
vdc nxos-kitchensink id 1
  limit-resource vlan minimum 16 maximum 4094

feature interface-vlan
feature lacp

username admin password 5 $5$KitchenSink$adminhashvalue01 role network-admin
username netops password 5 $5$KitchenSink$opshashvalue002 role network-operator

snmp-server community public-ro
snmp-server location DataCenter-1-RackB
snmp-server contact netops@example.net
snmp-server host 192.0.2.50
snmp-server user admin network-admin auth sha 0xaabbccddeeff00112233 priv aes-128 0x99887766554433221100 localizedkey

vlan 1,10,20,30
vlan 10
  name PROD
vlan 20
  name VOICE
vlan 30
  name MGMT-VLAN

vrf context management
  description out-of-band management
vrf context TENANT-A
  description tenant a routing instance

ip route 0.0.0.0/0 192.0.2.254
ip route 10.100.0.0/16 192.0.2.253 200

interface Vlan10
  description PROD gateway SVI
  no shutdown
  ip address 10.10.10.1/24

interface Vlan20
  no shutdown
  ip address 10.20.20.1/24

interface port-channel1
  description uplink bundle
  switchport mode trunk
  switchport trunk allowed vlan 10,20

interface Ethernet1/1
  description routed uplink to spine
  no switchport
  no shutdown
  mtu 9216
  ip address 192.0.2.1/31

interface Ethernet1/2
  description tenant-a routed port
  no switchport
  no shutdown
  vrf member TENANT-A
  ip address 172.16.0.1/30
  ipv6 address 2001:db8:a::1/64

interface Ethernet1/3
  description access port
  switchport access vlan 10

interface Ethernet1/4
  description trunk port
  switchport mode trunk
  switchport trunk native vlan 1
  switchport trunk allowed vlan 10,20,30

interface Ethernet1/5
  description bundle member
  channel-group 1 mode active

interface Ethernet1/6
  description bundle member
  channel-group 1 mode active

interface Ethernet1/7
  shutdown

interface loopback0
  description router-id loopback
  ip address 10.255.0.1/32

interface mgmt0
  vrf member management
  ip address 192.0.2.10/24

line console
line vty
boot nxos bootflash:/nxos.9.3.11.bin
