# Cross-vendor fidelity expectations: aruba_aoscx -> aruba_aoss
#
# Source: aruba_aoscx codec — ArubaOS-CX `show running-config` text.
# Target: aruba_aoss codec — ArubaOS-Switch (ProVision lineage) CLI render.
#
# The one SAME-VENDOR, CROSS-GENERATION pair in the aruba_aoscx mesh, and it
# runs in the harder direction.  AOS-CX is the modern campus/DC switch (`1/1/x`
# ports, `lag N` bundles, VSX active-gateway, VRFs, VXLAN); AOS-S is the legacy
# campus L2/L3 switch (`trkN` trunks, a two-level manager/operator privilege
# model, no VRF, no VXLAN).  The realistic migration is a DOWNGRADE — an AOS-CX
# config re-homed onto surviving AOS-S hardware during a staged refresh — so the
# campus L2 edge survives almost completely while everything AOS-CX gained over
# AOS-S is dropped whole.
#
# The dominant structural effect: the interface record list shrinks on 5 of
# the 7 cells.  On those the reconciler gives the record-count drift to the
# first `interfaces[].*` key (`name`) and folds every other sub-field into
# STRUCTURAL_ONLY; the other 2 cells compare record by record.  No physical
# port, LAG, loopback or SVI is ever dropped: the only records lost are 5
# `mgmt`, and 10 loopbacks (`loopback 0` -> `loopback0`) and 18 SVIs
# (`vlan 101` -> `Vlan101`) come back renamed.  So the reasons below say per
# key what fails on the 152 of 157 records that come back, instead of citing
# the sibling keys as if they corroborated each other.
#
# Dispositions are grounded in the codecs' `CapabilityMatrix` declarations and a
# full `run_full_mesh.py` pass over the committed corpus (7 fixture cells, 0
# render errors, 0 re-parse errors), resolved through the audit's own
# `actual_disposition()` so this file and the ratchet cannot disagree.  Claims
# that go beyond the mesh counters were re-measured by running
# `aruba_aoss.parse(aruba_aoss.render(aruba_aoscx.parse(raw)))` over all seven
# cells and diffing record by record.
#
# Schema spec: tests/fixtures/cross_vendor_expectations/README.md
# Vendor reference cache: docs/vendor-references/aruba_aoscx_to_aruba_aoss/
#
# Authored 2026-08-25 as part of the aruba_aoscx expectation mesh (A6 wave 2).

meta:
  source_vendor: aruba_aoscx
  target_vendor: aruba_aoss
  primary_use_case: >
    Staged-refresh downgrade: an ArubaOS-CX campus switch re-homed onto
    ArubaOS-Switch hardware carrying the same VLANs, VLAN port membership, SVI
    addressing and uplink bundles.  The campus L2 edge is the strong surface —
    hostname, VLAN IDs, VLAN names, tagged and untagged port membership, static
    routes and SNMP scalars all survive.  What does not is
    everything AOS-CX models and AOS-S does not: VRFs, VXLAN and the anycast
    gateway are dropped whole; an SVI or a loopback that is shut is not
    written, and the job says so; jumbo MTU and a LAG's description are lost
    on records that otherwise survive; and every local account is refused,
    whose password AOS-CX holds as ciphertext under its own key.
  certainty: medium
  references:
    - id: aoscx-aoss-surface
      path: docs/vendor-references/aruba_aoscx_to_aruba_aoss/canonical_surface.md
      title: "AOS-CX -> AOS-S: measured canonical surface (7 fixture cells)"
      source_url: "https://github.com/netcanon/netcanon"
      retrieved: "2026-08-25"

# ---------------------------------------------------------------------------

per_field_expectation:

  # -- Tier 1 -- system scalars ---------------------------------------------
  #
  # Three different things produce an empty scalar here and the operator action
  # differs for each, so they are recorded differently.  A SOURCE-side gap
  # (aruba_aoscx declares the path unsupported, target supports it) is
  # `not_applicable` and re-authoring on the target will stick.  A SYMMETRIC gap
  # (both matrices declare it unsupported) is `unsupported` — nothing in the
  # migration will ever carry it.

  hostname:
    disposition: good
    note: >
      `hostname <name>` on both platforms; preserved on 7 of 7 cells, including
      the mixed-case and hyphenated forms in the committed corpus.
    references: [aoscx-aoss-surface]

  domain:
    disposition: unsupported
    reason: >
      The aruba_aoscx matrix declares `/system/domain` unsupported: its
      parser reads no domain, so nothing reaches the aruba_aoss
      renderer, which writes `ip dns domain-name <name>` (since
      2026-11-13), and no committed input of the pair states a domain.
      Measured over 7 cells: drifted on 0, preserved on 0, both sides
      empty on 7.
    references: [aoscx-aoss-surface]

  dns_servers:
    disposition: not_applicable
    note: >
      The aruba_aoscx matrix declares `/system/dns-server` unsupported:
      its parser reads no resolver, so nothing reaches the aruba_aoss
      renderer, which writes `ip dns server-address priority <1-3> <ip>`
      (since 2026-11-13).  Measured over 7 cells: drifted on 0,
      preserved on 0, both sides empty on 7.
    references: [aoscx-aoss-surface]

  ntp_servers:
    disposition: not_applicable
    note: >
      The aruba_aoscx matrix declares `/system/ntp-server` unsupported:
      its parser reads no time server, so nothing reaches the aruba_aoss
      renderer, which writes `sntp server priority <1-3> <ip>` with
      `timesync sntp` and `sntp unicast` (since 2026-11-13).  Measured
      over 7 cells: drifted on 0, preserved on 0, both sides empty on 7.
    references: [aoscx-aoss-surface]

  timezone:
    disposition: unsupported
    reason: >
      Symmetric gap: both matrices declare `/system/timezone` unsupported
      (aruba_aoss: "Render emits no clock/timezone stanza; intent.timezone is
      dropped on migration").  Neither codec parses nor renders a clock stanza,
      so this is a pair-wide blind spot rather than an AOS-S limitation.  Set the
      timezone on the target by hand.
    references: [aoscx-aoss-surface]

  syslog_servers:
    disposition: unsupported
    reason: >
      The aruba_aoscx matrix declares `/system/syslog-server`
      unsupported: its parser reads no syslog server, so nothing reaches
      the aruba_aoss renderer, which writes `logging <ip>` (since
      2026-11-13), and no committed input of the pair states a syslog
      server.  Measured over 7 cells: drifted on 0, preserved on 0, both
      sides empty on 7.
    references: [aoscx-aoss-surface]

  # -- Interfaces -- the structural loss on this pair ------------------------

  "interfaces[].name":
    disposition: lossy
    reason: >
      The interface record list shrinks on 5 of the 7 cells (9->8, 9->8,
      18->17, 42->41, 13->12), each by its `mgmt` port; on the other 2 (22->22,
      44->44) `mgmt` comes back too.  Measured by re-running the round trip and
      comparing record by record, those 5 are the only records lost: NO
      physical port, LAG, loopback or SVI is among them.  28 come back under
      another name, which the comparator pairs by the addresses they hold: 10
      loopbacks (`loopback 0` -> `loopback0`, the record AOS-S reads
      `interface loopback 0` as) and 18 SVIs (`vlan 101` -> `Vlan101`,
      re-mounted from the VLAN record).  An SVI or a loopback that is shut on
      AOS-CX is not written: an AOS-S VLAN cannot be disabled, and no AOS-S
      form is known for a loopback that is down, so each is left out under a
      `; review:` line and a warning in the job (measured on a config made
      for it; no committed capture has one).  Re-author `mgmt` on the target.
    references: [aoscx-aoss-surface]

  "interfaces[].description":
    disposition: lossy
    reason: >
      Both matrices declare `/interfaces/interface/config/description` supported
      and 123 of the 152 records that come back agree.  The 29 that do not are
      of two kinds.  12 are SVI records: AOS-S re-mounts the SVI from the VLAN
      record, so the SVI's own description is replaced by the VLAN name
      (measured: `PROD-WEB-SVI` -> `PROD-WEB`).  17 are LAGs whose description
      does not come back.  Physical-port and loopback descriptions survive
      intact.  Capture SVI and LAG descriptions before migrating; port
      descriptions need no action.
    references: [aoscx-aoss-surface]

  "interfaces[].enabled":
    disposition: good
    note: >
      On every record that comes back the admin state is the source's: none
      of the 152 differs.  Every interface of the committed captures is up; a
      port that is shut is written `disable` and read back down (measured on
      a config made for it).  An SVI or a loopback that is shut is not
      written at all -- an AOS-S VLAN cannot be disabled, and no AOS-S form is
      known for a loopback that is down -- and is left out under a `; review:`
      line and a warning in the job: the record is lost, which
      `interfaces[].name` counts, rather than arriving up.  (This key once
      said a shut SVI arrived up, which it did until the AOS-S renderer
      refused it; and before that it counted 16 SVIs that moved `False` ->
      `True`, because the AOS-CX parser read every VLAN interface as shut.)
    references: [aoscx-aoss-surface]

  "interfaces[].mtu":
    disposition: lossy
    reason: >
      An independent loss, not the record-count effect: 50 of the 152 records
      that come back disagree, and all 50 are the same transition on a
      physical port —
      MTU `9198` arrives unset.  Every jumbo-framed uplink in the corpus silently
      reverts to the target default.  Note the aruba_aoss matrix declares NOTHING
      for `/interfaces/interface/config/mtu` — not supported, not lossy, not
      unsupported — while dropping it on every record; that is a matrix
      under-declaration recorded here and left for a codec change.  Re-apply
      jumbo MTU on every uplink after cutover.
    references: [aoscx-aoss-surface]

  "interfaces[].ipv4_addresses":
    disposition: lossy
    reason: >
      Declared supported on both sides at `/interfaces/interface/ipv4/address/ip`
      + `prefix-length`, and every address on a record that comes back keeps
      its address and prefix.  What is lost is the anycast companion:
      aruba_aoss declares
      `/interfaces/interface/ipv4/address/virtual-gateway-address`
      unsupported, and the AOS-CX `active-gateway ip` that 15 of the 18 SVIs
      carry on their address does not come back -- the same 15 that
      `vlans[].ipv4_addresses` measures on the VLAN mount.  On the 2 cells that
      compare record by record that is the drift this key records.
    references: [aoscx-aoss-surface]

  "interfaces[].ipv6_addresses":
    disposition: good
    note: >
      The corpus carries 2 interface IPv6 addresses, each on an SVI, and both
      come back: the AOS-S VLAN render writes `ipv6 address` beside `ip
      address`.  A loopback's IPv6 address is written too.  One case changes
      the value, and says so: an AOS-S loopback takes a host address only, so
      a loopback address with a shorter prefix is written as the /128 the
      switch makes of it, under a `; review:` line and a warning in the job.
      No committed capture has one.  (This key once said both addresses were
      lost, which they were until the AOS-S VLAN render wrote them.)
    references: [aoscx-aoss-surface]

  "interfaces[].interface_type":
    disposition: lossy
    reason: >
      aruba_aoss declares `/interfaces/interface/config/type` lossy and infers
      the type from the name shape (bare number -> ethernet, `Trk` ->
      port-channel, `Vlan` -> l3ipvlan, `loopback<N>` -> softwareLoopback).
      That reproduces the AOS-CX value on the ports, SVIs and loopbacks, and
      not on the 34 LAGs: a `lag N` record comes back under its own name,
      which is none of those shapes, and is read as an Ethernet port.  Do not
      read the rest as a guarantee for names outside those shapes.
    references: [aoscx-aoss-surface]

  "interfaces[].lag_member_of":
    disposition: lossy
    reason: >
      44 of the 152 records that come back disagree, all of them ports, and
      every difference is the same
      rename: `lag 1` -> `trk1`.  The membership itself is intact — no port loses
      its bundle.  `tools/run_phase4_reconciliation.py::_canonical_lag_name`
      exists to forgive exactly this class of rename on this key, but its regex
      accepts `trk<N>` and not AOS-CX's native `lag <N>` spelling with the space,
      so the pair falls through to raw equality; and in any case the parent
      record list drifts on 5 of the 7 cells, which forces every sub-field
      drifted there regardless of the equivalence.  Treat this as a
      naming-shape finding, not
      lost membership.
    references: [aoscx-aoss-surface]

  "interfaces[].vrrp_groups":
    disposition: unsupported
    reason: >
      A source-side block, and total: aruba_aoscx declares the whole
      `/interfaces/interface/vrrp-groups/group/*` subtree unsupported — mode,
      priority, preempt, advertisement-interval, authentication, description and
      virtual-ipv6s — because AOS-CX expresses first-hop redundancy as VSX
      active-gateway rather than VRRP.  Measured: no committed AOS-CX cell yields
      a single VRRP group, so nothing reaches the target to degrade.  Recorded
      `unsupported` rather than `lossy` because a vanished record is not lossy
      (#436).  The good news is that the block is on the SOURCE side —
      aruba_aoss declares `/interfaces/interface/vrrp-groups/group` SUPPORTED, so
      re-authoring VRRP on the target will stick, and it is the natural
      replacement for the anycast gateway this pair also loses.
    references: [aoscx-aoss-surface]

  # -- VLANs -- the campus surface that mostly survives ----------------------

  "vlans[].id":
    disposition: good
    note: "VLAN IDs preserved on 7 of 7 cells."
    references: [aoscx-aoss-surface]

  "vlans[].name":
    disposition: good
    note: >
      Preserved on 7 of 7 cells — a genuine same-vendor advantage.  The VLAN
      name survives against `arista_eos` on only 5 of 7 because that render
      normalises it; the AOS-S `vlan <id> / name "<name>"` form takes it
      verbatim.
    references: [aoscx-aoss-surface]

  "vlans[].ipv4_addresses":
    disposition: lossy
    reason: >
      Drifts on all 5 cells that populate it, and the measured difference is the
      same every time across 15 address records: the SVI's own address and
      prefix survive intact, and the `virtual_gateway_address` companion is
      emptied (e.g. `10.12.101.2/24` keeps its address and loses gateway
      `10.12.101.1`).  aruba_aoss declares both
      `/vlans/vlan/ipv4/address/virtual-gateway-address` and `.../virtual-
      gateway-mac` unsupported — "AOS-S is a campus L2/L3 codec with no
      anycast-gateway / VARP grammar" — which matches the measurement exactly.
      The SVI arrives with its own address but no shared first-hop gateway, so
      this is the field most likely to break first-hop reachability at cutover:
      rebuild FHRP on the target (VRRP is declared supported there).
      aruba_aoss additionally declares `/vlans/vlan/ipv4/address/secondary-ip`
      lossy — the address value survives but the is_secondary flag drops.  No
      committed cell carries a secondary, so that half is a declaration, not an
      observation.
    references: [aoscx-aoss-surface]

  "vlans[].untagged_ports":
    disposition: good
    note: >
      Preserved on 7 of 7 cells — untagged membership survives against AOS-S
      where it fails against every non-Aruba target, because AOS-S carries port
      membership on the VLAN record (`vlan <id> / untagged <ports>`) exactly as
      AOS-CX's canonical form does.  Read the `good` narrowly, though: the token
      LISTS are preserved verbatim, including AOS-CX-style `lag N` members, while
      the same render names those bundles `trkN` on its `trunk` lines.  Measured:
      63 member tokens across the 7 cells name a bundle that does not exist in
      the target's own LAG list.  Port-to-VLAN membership on physical ports is
      safe; LAG-attached membership needs re-authoring despite this disposition.
    references: [aoscx-aoss-surface]

  "vlans[].tagged_ports":
    disposition: good
    note: >
      Preserved on all 7 cells.  Same mechanism and the same `lag N` / `trkN`
      caveat as `vlans[].untagged_ports`.
    references: [aoscx-aoss-surface]

  "vlans[].description":
    disposition: lossy
    reason: >
      Drifts on the 4 cells that populate it — 6 records, every one going to
      empty (measured: `Server VLAN` -> ``, `User access VLAN` -> ``,
      `Out-of-band management` -> ``).  aruba_aoss declares
      `/vlans/vlan/description` LOSSY rather than unsupported and the reason
      names the mechanism: "Render emits the VLAN name but not a separate
      description line".  Recorded lossy to match — the VLAN record and its name
      survive, only the separate description field empties, so this is a
      degradation inside a surviving record and not a vanished record (#436).
      Nothing forwards differently, but on a campus switch the description is
      routinely how a VLAN is tied to a department or a site, so capture it
      before migrating.
    references: [aoscx-aoss-surface]

  # -- Routing --------------------------------------------------------------

  static_routes:
    disposition: good
    note: >
      Preserved on both cells that populate it (3 routes total).  Destination,
      gateway and administrative distance all survive — including the one route
      carrying a non-default metric of 200, written `distance 200` and read
      back.  (Up to 0.7.7 aruba_aoss declared `/routing/static-route/metric`
      lossy, though its render writes the distance.)  Two
      caveats that rest on declarations rather than observations, because no
      committed route exercises them: `/routing/static-route/description` is
      declared lossy on BOTH sides, and aruba_aoss declares
      `/routing/static-route/vrf` unsupported (AOS-S has no VRF) — a route
      aruba_aoscx reads in a VRF (`ip route ... vrf <name>`) is left out under
      a `; review:` line, beside the whole-VRF drop recorded under
      `routing_instances[].name`.
    references: [aoscx-aoss-surface]

  "routing_instances[].name":
    disposition: unsupported
    reason: >
      A total drop, verified against the round trip rather than inferred from the
      drift shape: on all 3 cells that carry VRFs, both instances are gone from
      the re-parsed target (measured "all 2 routing_instances dropped" on each,
      e.g. `CSM` and `keepalive` -> nothing).  aruba_aoss declares
      `/routing-instances/instance` unsupported — "Render emits no
      VRF/routing-instance construct; intent.routing_instances are dropped on
      migration".  Recorded `unsupported` not `lossy` because a vanished record is
      not lossy (#436): `lossy` warns and stays compatible, which would badly
      understate a config losing its entire VRF separation.  Anything relying on
      VRF isolation must be redesigned before this migration, not fixed after it.
    references: [aoscx-aoss-surface]

  "routing_instances[].description":
    disposition: unsupported
    reason: >
      Blocked on both sides independently.  aruba_aoscx declares
      `/routing-instances/instance/description` unsupported, so the source never
      emits one; and aruba_aoss drops the entire enclosing instance anyway (see
      `routing_instances[].name`).  The key measures as drifted only because the
      parent record list vanishes on those 3 cells — that is correlated with the
      instance drop, not independent evidence of a description-specific loss.
      Two causes, one disposition, and neither is fixable inside the migration.
    references: [aoscx-aoss-surface]

  # -- Services -------------------------------------------------------------

  dhcp_servers:
    disposition: not_applicable
    note: >
      Source-side gap: aruba_aoscx declares `/dhcp-servers/pool` unsupported,
      so the canonical pool is never populated from this source and no
      committed cell holds one.  aruba_aoss declares it SUPPORTED (it writes a
      `dhcp-server pool` and reads one back), so a pool re-authored on the
      AOS-S side will stick; a campus AOS-CX switch normally relays DHCP
      rather than serving it.
    references: [aoscx-aoss-surface]

  "snmp.community":
    disposition: good
    note: >
      No drift on any of the 4 cells that populate an SNMP block.  Be precise
      about what that means: only 1 of those 4 cells actually carries a community
      string, and it round-trips; on the other 3 both sides agree the field is
      empty.  Both matrices declare `/snmp/community` supported.
    references: [aoscx-aoss-surface]

  "snmp.location":
    disposition: good
    note: >
      Preserved on all 4 cells that populate an SNMP block; 3 of them carry an
      actual location string and it round-trips through
      `snmp-server location "<value>"` intact.
    references: [aoscx-aoss-surface]

  "snmp.contact":
    disposition: good
    note: >
      Preserved on all 4 cells that populate an SNMP block; 3 carry an actual
      contact string and it round-trips through `snmp-server contact "<value>"`
      intact.
    references: [aoscx-aoss-surface]

  "snmp.trap_hosts":
    disposition: good
    note: >
      No drift on any of the 4 cells that populate an SNMP block — but this
      `good` records agreement, not migration.  aruba_aoscx declares
      `/snmp/trap-host` UNSUPPORTED as a source path, so the canonical trap-host
      list is empty on every committed cell and both sides trivially agree.
      aruba_aoss declares `/snmp/trap-host` supported, so trap destinations
      re-authored on the target will stick; they will simply never arrive from an
      AOS-CX source.
    references: [aoscx-aoss-surface]

  "snmp.v3_users":
    disposition: lossy
    reason: >
      Drifts on 1 of the 4 cells that populate SNMP, and the measured difference
      is narrow: the privacy-protocol designation changes from a bare `aes` to
      `aes128` on re-parse.  Everything else about the USM user survives — the
      username, the auth protocol, the presence of both passphrases, the
      engine-id state and the group.  aruba_aoss declares
      `/snmp/v3-user/priv-protocol` lossy for exactly this ("emits aes128 as bare
      `aes`, losing the key-length designation, and has no representation for
      aes192 / aes256") plus `/snmp/v3-user/engine-id` and `.../auth-protocol`.
      aruba_aoscx additionally declares 6 `/snmp/v3-user/*` child paths lossy on
      the source side, so a v3 user with sha224/384/512 auth or aes192/256
      privacy — none in this corpus — would degrade further.  The passphrases
      themselves are blanked by the audit as cosmetic before comparison and are
      not evidence either way; re-create SNMPv3 users on the target rather than
      trusting the migration with credential material.
    references: [aoscx-aoss-surface]

  radius_servers:
    disposition: not_applicable
    note: >
      Source-side gap: aruba_aoscx declares both `/radius-servers/server/host`
      and `/radius-servers/server/key` unsupported and no committed cell
      populates the field, so nothing reaches the target.  aruba_aoss declares
      nothing for the path either way, so there is no target-side statement to
      lean on — re-author RADIUS on the AOS-S side and verify it by hand.
    references: [aoscx-aoss-surface]

  # -- LAGs -----------------------------------------------------------------

  lags:
    disposition: lossy
    reason: >
      Drifts on all 7 cells, but the round trip shows two very different causes
      and only one is a real loss.  On 6 of 7 cells the ONLY difference is the
      name — `lag 1` -> `trk1` — with members and LACP mode identical; the
      reconciler's `_canonical_lag_name` is built to forgive that class of rename
      but its regex accepts `trk<N>` and not AOS-CX's native `lag <N>` spelling
      with the space, so it falls through to raw equality.  The 7th cell
      (`kitchen_sink.cfg`) is genuine: a memberless `lag 2` with `mode static`
      disappears and the count drops 2 -> 1, because the AOS-S render keys off
      `CanonicalInterface.lag_member_of` and a bundle with no member port has
      nothing to render from.  Recorded `lossy` and not `unsupported` because
      bundles that carry members do survive, with members and mode intact — this
      warns without blocking, correctly.  Two things to do at cutover anyway:
      re-create any bundle that is currently memberless, and re-point VLAN
      membership, which the same render still writes as `lag N` (see
      `vlans[].untagged_ports`).
    references: [aoscx-aoss-surface]

  # -- Identity -------------------------------------------------------------

  "local_users[].name":
    disposition: lossy
    reason: >
      0 of 7 accounts arrive across the 6 cells that populate local
      users; the list is emptied on each.  Each of the 7 holds an AOS-CX
      ciphertext (`password ciphertext`), encrypted under the key of the
      switch that made it: 6 `AQB` blobs, and the GL CX 10.09 capture's
      `admin`, whose publisher put a placeholder word where its
      ciphertext was.  Up to 0.7.7 the AOS-CX parser read that word by
      its shape, as a password as typed, and it was written onto this
      target as one; the parser now reads a value by its keyword, so it
      is refused like the rest
      (`tests/unit/migration/test_a_typed_password_is_not_a_hash.py`).
      AOS-S can consume a SHA-1 or SHA-256 hash, or a password as typed;
      anything else is refused on purpose (#461) with a review comment
      naming the account and no user entry.  Recorded `lossy` rather
      than `unsupported`: an AOS-CX account configured `password
      plaintext` is read as typed and arrives, as `password manager
      user-name "<name>" plaintext "<password>"`, read back tagged
      `plaintext:` -- the same password under another canonical string;
      no committed capture has one.  At most one account of each role
      arrives: AOS-S holds one manager and one operator account, and an
      operator is written only beside a manager
      (`docs/vendors/aruba_aoss.md`).  Before cutover, list the source
      accounts, search the render for `review:` comments, and re-create
      each refused account on the target with a fresh password.
    references: [aoscx-aoss-surface]

  "local_users[].role":
    disposition: lossy
    reason: >
      A local user's role is a name of the platform that defines it, and
      AOS-CX and AOS-S are different platforms, so the group an AOS-CX `user`
      line names is not carried.  AOS-S writes its `manager` account at
      privilege 15 and its `operator` account below it.
    references: [aoscx-aoss-surface]

  "local_users[].hashed_password":
    disposition: lossy
    reason: >
      On the corpus no account arrives (see `local_users[].name`): the
      only drift on this key is the parent record-count collapse, which
      the audit attributes to `local_users[].name` and reclassifies
      STRUCTURAL_ONLY here.  Recorded `lossy` for an account that
      arrives: an AOS-CX account configured `password plaintext` is
      written as `password manager user-name "<name>" plaintext
      "<password>"`, read back tagged `plaintext:` -- the same password
      under another canonical string.  Before #461 every AOS-CX
      ciphertext was written behind that `plaintext` marker, so the
      account held the ciphertext as its literal password.  No secret
      value is quoted here or in the reference doc; only shapes and
      counts.
    references: [aoscx-aoss-surface]

  # -- Fabric -- everything AOS-CX has and AOS-S does not --------------------

  "vxlan_vnis[].vni":
    disposition: unsupported
    reason: >
      A total drop, verified on the round trip: on all 3 cells that carry VXLAN
      the entire VNI list is gone from the re-parsed target (measured "all 1
      vxlan_vnis dropped" and "all 2 vxlan_vnis dropped").  aruba_aoss declares
      `/vxlan-vnis/vni` unsupported with the plainest reason in either matrix —
      "VXLAN not modelled — AOS-S is a campus L2/L3 codec".  Recorded
      `unsupported` rather than `lossy` because a vanished record is not lossy
      (#436).  There is no AOS-S-side re-authoring that recovers this; an
      overlay-carrying AOS-CX switch cannot be re-homed onto AOS-S without a
      design change.
    references: [aoscx-aoss-surface]

  "vxlan_vnis[].vlan_id":
    disposition: unsupported
    reason: >
      Vanishes with its parent record on the same 3 cells — the VNI-to-VLAN
      binding cannot survive when the VNI record does not.  Same declaration and
      the same total-drop measurement as `vxlan_vnis[].vni`; this is correlated
      with that drop rather than independent evidence of a binding-specific loss.
      The VLAN itself survives (see `vlans[].id`); only its overlay association
      is gone.
    references: [aoscx-aoss-surface]

  "vxlan_vnis[].mcast_group":
    disposition: unsupported
    reason: >
      Also vanishes with the parent record.  Stated precisely because it is easy
      to over-read: the one committed VNI that reaches this pair carries an EMPTY
      multicast replication group, so no group value has ever been observed to
      drop — the key measures as drifted purely because the enclosing record is
      dropped whole.  aruba_aoscx declares `/vxlan-vnis/mcast-group` lossy on the
      source side; that declaration is untested on this corpus.
    references: [aoscx-aoss-surface]

  evpn_type5_routes:
    disposition: not_applicable
    note: >
      Not populated on any cell of this pair, and neither codec declares any path
      under it.  A campus AOS-CX switch is not an EVPN border-leaf and AOS-S has
      no overlay surface at all, so the canonical field stays empty on both
      sides.
    references: [aoscx-aoss-surface]

  anycast_gateway_mac:
    disposition: unsupported
    reason: >
      A total drop on all 5 cells that set it — the fabric-wide MAC goes to empty
      (measured, e.g. an `02:00:0a:...`-shaped value -> ``).  aruba_aoss declares
      `/anycast-gateway-mac` unsupported: "System-wide anycast-gateway MAC
      parses-and-ignores in v1.  Schema exists on CanonicalIntent; wire-up
      scheduled for v0.2.0 Wave C."  Recorded `unsupported` because the value
      vanishes rather than degrades (#436).  Worth contrasting with the
      `arista_eos` pair, where this MAC survives while the per-SVI gateway
      address does not: against AOS-S BOTH halves of the anycast gateway are
      lost, this key and the `virtual_gateway_address` under
      `vlans[].ipv4_addresses`.  Plan a VRRP replacement — aruba_aoss declares
      `/interfaces/interface/vrrp-groups/group` supported — rather than expecting
      any part of the active-gateway design to carry over.
    references: [aoscx-aoss-surface]

  # -- Passthrough / vendor-specific ----------------------------------------

  raw_sections:
    disposition: not_applicable
    note: >
      Not populated on any cell of this pair.  aruba_aoscx declares
      `/system/raw-sections/version-banner` lossy, but no committed AOS-CX
      fixture carries an unparsed block that survives to render, and aruba_aoss
      declares nothing under the path.
    references: [aoscx-aoss-surface]

  apply_groups:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair populates it."
    references: [aoscx-aoss-surface]

  group_content:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair populates it."
    references: [aoscx-aoss-surface]
