  anycast_gateway_mac:
    disposition: unsupported
    reason: >
      Symmetric gap: both matrices declare `/anycast-gateway-mac`
      unsupported.  IOS-XR has no VARP / distributed-anycast-gateway grammar
      at all — its reason also covers the per-address
      `/interfaces/interface/ipv4|ipv6/address/virtual-gateway-address`
      drops — and opnsense expresses shared-gateway addressing as CARP
      rather than an anycast MAC.  Not populated on any cell, so this rests
      on the two declarations rather than on an observed round-trip.  The
      related CARP loss that IS observed is recorded on
      `interfaces[].vrrp_groups`.
