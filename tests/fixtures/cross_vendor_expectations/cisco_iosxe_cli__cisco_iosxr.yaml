    note: >
      Preserved on the 1 cell that populates it (`kitchen_sink.txt`, two VRFs
      with descriptions).  Thin coverage, stated as such.  Separately, the EVPN
      leaf fixture loses its VRF `l3_vni` binding (100200 -> null), consistent
      with VXLAN being dropped wholesale — also not an audited key, and it does
      not touch this one.
    references: [iosxecli-iosxr-surface]

