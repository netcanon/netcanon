  anycast_gateway_mac:
    disposition: unsupported
    reason: >
      Not populated on any of the 15 cells, so this rests on the matrices
      rather than an observed round-trip — stated rather than implied.  The
      source declares `/anycast-gateway-mac` supported; the target declares it
      unsupported, reason "IOS-XR has no VARP / distributed-anycast-gateway
      grammar, so the chassis-wide anycast-gateway MAC is dropped on render."
      A target-side block, not a source-side gap, which is why it is
      `unsupported` and not `not_applicable`.  It sits alongside the XR
      matrix's unsupported declarations for the per-interface IPv4 and IPv6
      `virtual-gateway-address` companions: an IOS-XE box doing distributed
      anycast gateway loses that whole model on migration, and the loss would
