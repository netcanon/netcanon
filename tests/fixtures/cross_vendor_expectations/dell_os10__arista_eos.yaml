  interfaces[].description:
    disposition: lossy
    reason: >
      Count drift 26 -> 27 on `canu_sw-leaf-bmc-001`: the target GAINS a
      `port-channel150` interface stanza.  OS10 declares the LAG only as
      `interface port-channel 150` with `channel-group` members; EOS
      materialises the bundle as an interface record of its own, which has
      no description, so the subfield registers as drifted.
      NOTE this is a GAIN, not a loss -- nothing the operator wrote is
      missing.  The variance taxonomy has no class for `the target
      materialised a record the source implied`, so `lossy` is the closest
      available disposition rather than an exact one.
    references: [os10-eos-surface]

  interfaces[].enabled:
    disposition: good
    note: >
      Preserved on 1 of 1 cells; no cell drifts. Both codecs model
      this surface.
    references: [os10-eos-surface]

  interfaces[].interface_type:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round
      trip. EOS interface names don't encode speed; the parser
      defaults to 'gig' speed-hint for all Ethernet<N> ports. Target
      codecs that care about speed (Cisco's GigabitEthernet /
      TenGigabitEthernet distinction) may emit less-specific prefixes.
      Measured over 1 cell: drifted on 1, preserved on 0, both sides
      empty on 0.
    references: [os10-eos-surface]

