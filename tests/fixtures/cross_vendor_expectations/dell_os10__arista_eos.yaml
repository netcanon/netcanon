  vlans[].name:
    disposition: lossy
    reason: >
      A VLAN name containing whitespace is rewritten with underscores:
      `oob-mgmt 10.0.0.0/24` -> `oob-mgmt_10.0.0.0/24` on 3 of 8 VLANs in
      `azlocal_tor1`/`tor2`.  This is the documented naming-value
      sanitisation policy (`netcanon/migration/_naming.py`): EOS's parser
      rejects whitespace in these tokens, so the wire form must be
      sanitised to round-trip through the target's own parser.  The VLAN
      and its id survive intact; only the label is altered.  Scored `good`
      until the real OS10 corpus landed because the synthetic kitchen-sink
      has no whitespace in any VLAN name.
    references: [os10-eos-surface]

