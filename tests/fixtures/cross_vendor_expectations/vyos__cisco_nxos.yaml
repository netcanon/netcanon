# Cross-vendor fidelity expectations: vyos -> cisco_nxos
#
# Source: vyos codec — a curly-brace `config.boot`.  Set-form input is
# converted by `_setform_to_brace` before the brace-stack parser runs.
# Target: cisco_nxos codec — NX-OS CLI render.
#
# Asymmetric by device class.  vyos in the committed corpus is a Linux-based
# software router — lab or virtual edge.  Its interface vocabulary is the
# kernel's (`eth0`..`eth7`, `lo`, `dum0`, `bond0`, `eth1.100`), its user
# passwords are bare `$6$` SHA-512 crypt strings, and it has no VLAN database
# at all — 802.1Q lives on `vif <vid>` sub-interfaces.  cisco_nxos is a DC
# leaf/spine: `Ethernet1/1` / `loopback0` / `Vlan10` / `port-channel1` /
# `nve1`, a real VLAN database, and VXLAN/EVPN.  The realistic migration is a
# VyOS edge or lab router re-homed onto a Nexus, so the shared surface is the
# routed edge plus the overlay — addressing, admin state, MTU, static routes,
# SNMP, VRF identity, the VXLAN VNI-to-VLAN binding and user identity.
#
# READ THIS BEFORE COMPARING WITH `vyos__arista_eos.yaml`: there the interface
# inventory SHRINKS (55 records in, 46 out, on 6 of 13 cells) because the EOS
# render elides content-free VyOS stubs, so `interfaces[].name` carries a
# structural loss and the sub-fields inherit that one signal.  Here NOTHING is
# elided: 55 interface records in, 55 out, identical name sets on all 13
# cells.  Every interface loss below is therefore a genuine per-attribute loss
# that stands on its own measurement, and the sub-fields that survive are
# declared `good` rather than dragged down by a vanishing parent.
#
# The one structural movement on this pair goes the OTHER way — on 3 cells the
# target GAINS a VLAN record the source never had, synthesised from the VXLAN
# VNI's L2 binding.  `vlans[].id` carries that signal for the whole list.
#
# The real losses on this pair are: a uniform interface type-hint fabrication
# (large but harmless), the LAG identity rename that strands the bundle's
# addressing, one passwordless local account that disappears at re-parse, the
# SNMPv3 privacy-cipher token, and a one-cell NTP parser artefact.
#
# Dispositions are grounded in the codecs' `CapabilityMatrix` declarations and
# a 13-cell round-trip over the committed corpus (0 render errors, 0 re-parse
# errors), resolved through the audit's own `actual_disposition()` so this
# file and the ratchet cannot disagree.  Every loss recorded below was
# additionally re-derived by hand, by parsing the fixture with vyos, rendering
# with cisco_nxos and re-parsing the render — not inferred from the drift
# shape.
#
# Schema spec: tests/fixtures/cross_vendor_expectations/README.md
# Vendor reference cache: docs/vendor-references/vyos_to_cisco_nxos/
#
# Authored 2026-08-25, closing the cross-vendor expectation mesh.

meta:
  source_vendor: vyos
  target_vendor: cisco_nxos
  primary_use_case: >
    VyOS edge/lab router re-home: a Linux-based software router replaced by a
    Cisco Nexus carrying the same routed interfaces, static routes, SNMP, VRF
    identity and VXLAN overlay.  Hostname, domain, DNS, the FULL interface
    inventory with its addressing, MTU, description and admin state, static
    routes, SNMP v1/v2c, the VNI-to-VLAN binding, VRF names and 16 of 17
    local-user records all survive.  What does not: the interface type hint
    (fabricated on the target for all 55 records), the LAG identity — renamed
    `bond0` -> `port-channel0` while the bundle's L3 stays behind on a stanza
    called `bond0` that the render never turns into a port-channel — a single
    passwordless account that the NX-OS parser cannot read back, the SNMPv3
    privacy-cipher token, and a stray brace pair the VyOS parser attached to
    one cell's NTP servers.  Timezone, DHCP pools and RADIUS die in transit:
    both codecs declare them unsupported.
  certainty: medium
  references:
    - id: vyos-nxos-surface
      path: docs/vendor-references/vyos_to_cisco_nxos/canonical_surface.md
      title: "VyOS -> Cisco NX-OS: measured canonical surface (13 fixture cells)"
      source_url: "https://github.com/netcanon/netcanon"
      retrieved: "2026-08-25"

# ---------------------------------------------------------------------------

per_field_expectation:

  # -- Tier 1 -- management-plane scalars ------------------------------------

  hostname:
    disposition: good
    note: >
      `set system host-name <name>` -> `hostname <name>`; preserved on 13 of
      13 cells, every one of them.  Both matrices declare `/system/hostname`
      supported.
    references: [vyos-nxos-surface]

  domain:
    disposition: good
    note: >
      Preserved on the single cell that populates it
      (`scottlaird-vyos-parser.conf`); the other 12 carry no domain.  Both
      matrices declare `/system/domain` supported, so the declaration carries
      most of the weight and one clean cell confirms it.
    references: [vyos-nxos-surface]

  dns_servers:
    disposition: good
    note: >
      Preserved on the single cell that populates it — three name-servers in,
      the same three out, in order.  Both matrices declare
      `/system/dns-server` supported.  Thin coverage, clean measurement.
    references: [vyos-nxos-surface]

  ntp_servers:
    disposition: lossy
    reason: >
      Drifts on exactly 1 of 13 cells, and the drift is punctuation the SOURCE
      parser attached — not a server that went missing.
      `houdev_vyos_dhcpv6_pd_client.conf` writes its servers as one-line
      empty-body blocks (`server         time1.vyos.net { }`).  The VyOS
      brace parser captures the whole token run, so the canonical value is
      `time1.vyos.net { }`.  The NX-OS render emits that verbatim as
      `ntp server time1.vyos.net { }`, and the NX-OS parser reads only the
      first token after `ntp server`, so the round trip returns the clean
      `time1.vyos.net`.
      All three hostnames are present on both sides, in order — the text
      survives, the stray brace pair does not.  Recorded as a loss because the
      audit compares canonical strings and this one is not preserved, but an
      operator reading a migration report should know the target value is the
      more correct of the two.  On the other 11 populated cells the lists
      round-trip identically.  Both matrices declare `/system/ntp-server`
      supported; neither codec is at fault for the shape of the loss.
    references: [vyos-nxos-surface]

  timezone:
    disposition: unsupported
    reason: >
      BOTH matrices declare `/system/timezone` unsupported, so this is a
      symmetric gap in the pair rather than an NX-OS limitation — neither
      codec parses nor renders a clock/timezone stanza, and cisco_nxos states
      it outright ("render emits no clock/timezone stanza; intent.timezone is
      dropped on migration").
      The canonical field is empty on both sides of all 13 cells — but that is
      not because the corpus has nothing to lose: 3 of the 13 raw VyOS configs
      DO set `system time-zone`, and vyos drops it at parse before NX-OS is
      ever involved.  This is a real thing an operator loses, not an untested
      empty field.  Set the timezone on the Nexus by hand; nothing in the
      migration will carry it.
    references: [vyos-nxos-surface]

  syslog_servers:
    disposition: not_applicable
    note: >
      Source-side gap.  vyos declares `/system/syslog-server` unsupported
      ("render emits no syslog config"), so logging hosts never enter the
      canonical tree from this source.  Measured empty on both sides of all 13
      cells — but, as with `timezone`, that is not an untested field:
      `scottlaird-vyos-parser.conf` carries a real remote syslog host under
      `system syslog host <ip>`, and vyos drops it at parse before NX-OS is
      involved.  Re-author it rather than assume there was nothing there.
      cisco_nxos declares `/system/syslog-server` SUPPORTED, so
      `logging server` re-authored on the Nexus will stick.
    references: [vyos-nxos-surface]

  # -- Interfaces -- inventory fully intact, two attributes drift ------------
  #
  # The measured record count is the headline: 55 interface records across the
  # 13 cells, 55 after the round-trip, with identical name sets on EVERY cell.
  # The NX-OS render emits `interface eth0`, `interface lo`, `interface dum0`,
  # `interface bond0` and `interface eth1.100` under their VyOS names verbatim
  # and the NX-OS parser reads every one back — bare content-free stubs
  # included.  Nothing below is a knock-on effect of a vanishing parent
  # record; each loss was measured on its own.

  "interfaces[].name":
    disposition: good
    note: >
      Preserved on 13 of 13 cells: 55 source interface records, 55 after
      parse -> render -> re-parse, same names on every cell.  The NX-OS render
      does not rewrite kernel-style names into `Ethernet<N>`, does not collapse
      `eth1.100` / `eth1.200` dot1q sub-interfaces (they render with
      `encapsulation dot1q <vid>` and come back intact), and does not elide
      content-free stubs the way the EOS render does on `vyos__arista_eos`.
      Worth stating because it is the reason every interface sub-field below
      can be judged on its own merits.
    references: [vyos-nxos-surface]

  "interfaces[].description":
    disposition: good
    note: >
      Zero drift: 15 populated descriptions across 7 cells, all preserved
      exactly.  Both matrices declare
      `/interfaces/interface/config/description` supported.
      Named explicitly to head off the wrong diagnosis: the VyOS render's
      free-text rewrite — embedded double quotes replaced with apostrophes,
      because VyOS rejects embedded quotes in value strings (vyos.dev/T1246) —
      is a TARGET-side behaviour and cannot apply here, where VyOS is the
      source.  Checked anyway: none of the 15 strings contains a quote or an
      apostrophe to begin with.
    references: [vyos-nxos-surface]

  "interfaces[].enabled":
    disposition: good
    note: >
      Admin state preserved on 55 of 55 records — zero differing.  The two
      records that are admin-down on the VyOS side render as `shutdown` and
      arrive shut; every other record renders `no shutdown`.  Both matrices
      declare `/interfaces/interface/config/enabled` supported.
    references: [vyos-nxos-surface]

  "interfaces[].mtu":
    disposition: good
    note: >
      Preserved on 55 of 55 records.  MTU is actually populated on exactly 1
      of them (`kitchen_sink.conf`, an `mtu 1500` that round-trips unchanged),
      so the coverage is thin — but both matrices declare
      `/interfaces/interface/config/mtu` supported and the one measurement is
      clean.  Stated with its thinness rather than implied.
    references: [vyos-nxos-surface]

  "interfaces[].ipv6_addresses":
    disposition: good
    note: >
      Preserved on 55 of 55 records; IPv6 is populated on 20 records across 5
      cells and every address + prefix-length survives.  Both matrices declare
      `/interfaces/interface/ipv6/address/ip` and `.../prefix-length`
      supported.
    references: [vyos-nxos-surface]

  "interfaces[].ipv4_addresses":
    disposition: good
    note: >
      Preserved on 55 of 55 records; IPv4 is populated on 21 records across 9
      cells — the widest-populated interface attribute on the pair — and every
      address + prefix-length survives.  Both matrices declare
      `/interfaces/interface/ipv4/address/ip` and `.../prefix-length`
      supported.  This is the field the migration most depends on and it is
      clean.
    references: [vyos-nxos-surface]

  "interfaces[].interface_type":
    disposition: lossy
    reason: >
      The single largest drift signal on the pair: all 55 records on all 13
      cells.  The direction is the surprise, and it changes how this should be
      read — the source value is the EMPTY STRING on every record measured,
      and the target comes back `ianaift:other`.  Nothing is lost; a hint the
      source never asserted is invented on the far side.
      Mechanism, from both declarations plus the measurement.  vyos declares
      `/interfaces/interface/config/type` lossy and describes a name-shape
      inference (`ethN` -> ethernetCsmacd, `lo`/`dumN` -> softwareLoopback,
      `bondN` -> ieee8023adLag); on this corpus that inference does not
      populate the parsed value, so nothing enters the render.  cisco_nxos
      declares the same path lossy and re-derives the hint from the rendered
      name prefix — Ethernet, loopback, Vlan, port-channel, nve, mgmt.  No
      VyOS name matches any of those prefixes, `lo` included (NX-OS wants
      `loopback`), so every record falls through to the catch-all.
      Recorded `lossy` because the canonical value is not preserved and the
      audit measures exactly that — but it is `lossy` and not `unsupported`
      because the interface record, its addressing and its admin state are
      untouched.  Practically: noise in a diff, not a migration risk.  Do not
      let its size crowd out the LAG and local-user findings below.
    references: [vyos-nxos-surface]

  "interfaces[].lag_member_of":
    disposition: lossy
    reason: >
      Drifts on 1 cell (`kitchen_sink.conf`), on both records that carry a
      value: `bond0` -> `port-channel0`.  The membership pointer is NOT lost —
      `eth4` and `eth5` still point at a bundle after the round-trip — so this
      is `lossy` and not `unsupported`; #436 reserves `unsupported` for the
      value that vanishes, and cisco_nxos declares
      `/interfaces/interface/lag-member-of` supported.
      The rename is correct on its face — `port-channel<N>` is NX-OS's native
      vocabulary — but it has a consequence the pointer hides, and the
      consequence is recorded under `lags` where it is measured: the render
      emits `channel-group 0 mode active` under each member and NO
      `interface port-channel0` stanza anywhere, so the members join a bundle
      that is never configured.
      This and `lags` are ONE mechanism observed at two measurement sites, not
      two independent findings.  Neither corroborates the other; this entry
      exists because the attribute is measured on the interface record.
    references: [vyos-nxos-surface]

  "interfaces[].vrrp_groups":
    disposition: not_applicable
    note: >
      Source-side gap.  vyos declares the whole
      `/interfaces/interface/vrrp-groups/group/*` subtree unsupported — the
      anchor plus mode, priority, preempt, advertisement-interval,
      authentication, virtual-IPv6 and description — with the blunt reason
      "VyOS VRRP / VRRPv3 is not modelled by the codec", so nothing reaches
      the target.  Measured: 0 differing of 55 records, because both sides are
      empty on all of them.
      cisco_nxos declares `/interfaces/interface/vrrp-groups/group` LOSSY
      rather than unsupported — it renders every canonical FHRP group as an
      NX-OS `hsrp` block — so first-hop redundancy re-authored on the Nexus
      will stick, as HSRP.  Recover it from the VyOS config by hand; the
      migration will not carry it.
    references: [vyos-nxos-surface]

  # -- VLANs -- the target SYNTHESISES a registry the source never had -------
  #
  # vyos declares `/vlans/vlan/id` unsupported outright: VyOS has no VLAN
  # database, only `vif <vid>` sub-interfaces.  The source `vlans` list is
  # therefore empty on all 13 cells.  On the 3 cells that carry a VXLAN VNI
  # the NX-OS render emits the VNI's L2 binding as `vlan <id>` +
  # `vn-segment <vni>`, and the re-parse yields exactly ONE VLAN record
  # carrying only an `id` — 10, 10 and 1912, matching each cell's
  # `vxlan_vnis[].vlan_id` one for one.  That measurement grounds every entry
  # in this block.

  "vlans[].id":
    disposition: lossy
    reason: >
      This key carries the pair's structural signal for the whole `vlans`
      list, and the signal points the opposite way from every other structural
      finding in the mesh: the record count goes UP, 0 -> 1, on 3 of 13 cells.
      Nothing vanishes.  The source has no VLAN record to lose (vyos declares
      `/vlans/vlan/id` unsupported — 802.1Q is modelled as `vif` sub-interfaces
      instead, which ARE supported and do round-trip as interfaces); the
      target gains one, synthesised from the VXLAN VNI's L2 binding, carrying
      only the id.
      Recorded `lossy` deliberately.  `unsupported` is wrong twice over: the
      #436 rule that forces it applies to a record that vanishes, and nothing
      here does; and `unsupported` blocks, which would be an absurd verdict on
      a target that added a correct VLAN.  `lossy` — warn, stay compatible —
      is the honest severity for "the canonical VLAN surface does not
      round-trip: verify the VLAN the Nexus invented is the one you want".
      cisco_nxos declares `/vlans/vlan/id` supported; the drift is not a
      target defect, it is the two vendors disagreeing about whether a VLAN is
      a first-class object.
      One thing to eyeball in the generated config: the render emits the
      `vlan <id>` line twice — once bare, once with `vn-segment` — which does
      not affect what re-parses but does not belong in a config review either.
    references: [vyos-nxos-surface]

  "vlans[].name":
    disposition: good
    note: >
      No VLAN value is lost.  The source carries no VLAN records at all, and
      the single record the target synthesises on 3 cells carries an empty
      name — so on every cell, both sides of this key are empty.
      The record-count change is real and is claimed ONCE, by `vlans[].id`.
      This key measures what happens to the VALUE, and the answer is: nothing
      happens to it.  Declaring a loss here would double-count that one
      structural signal and could never be evidenced on its own.
      Declarations, stated exactly: cisco_nxos declares `/vlans/vlan/name`
      supported; vyos declares NO path under `/vlans/vlan/` beyond the
      unsupported `id` and the unsupported L3 mount, so there is no source-side
      declaration to lean on here — only the measurement.
    references: [vyos-nxos-surface]

  "vlans[].ipv4_addresses":
    disposition: good
    note: >
      Same measurement as `vlans[].name`: empty on both sides of all 13 cells,
      because the synthesised target record carries no L3 and the source
      carries no VLAN record.  The record-count change belongs to
      `vlans[].id`.
      Worth noting the declarations do not disagree with that: vyos declares
      the VLAN-SVI L3 mount unsupported (`.../secondary-ip`,
      `.../virtual-gateway-address`, `.../virtual-gateway-mac`) and cisco_nxos
      declares `/vlans/vlan/ipv4/address/ip` lossy because it renders no SVI
      from a VLAN record.  Neither matters when no source record reaches the
      path.  The corresponding addressing lives in
      `interfaces[].ipv4_addresses`, which is `good`.
    references: [vyos-nxos-surface]

  "vlans[].untagged_ports":
    disposition: good
    note: >
      Empty on both sides of all 13 cells.  vyos declares the entire campus
      port-membership surface unsupported —
      `/interfaces/interface/switchport-mode`, `/access-vlan`,
      `/trunk-allowed-vlans`, `/trunk-native-vlan` — and VLAN membership is
      rebuilt from exactly those, so the canonical field is never populated
      from this source; the synthesised target record has no members either.
      No value is lost; the record-count change belongs to `vlans[].id`.
      cisco_nxos declares `/vlans/vlan/untagged-ports` supported, so access
      ports authored on the Nexus afterwards will hold.
    references: [vyos-nxos-surface]

  "vlans[].tagged_ports":
    disposition: good
    note: >
      Same measurement and same reasoning as `vlans[].untagged_ports`: empty
      on both sides of every cell.  VyOS expresses tagging as a `vif`
      sub-interface, which lands in `interfaces[]` (and round-trips there as
      `encapsulation dot1q <vid>`), not as trunk membership on a VLAN record.
      cisco_nxos declares `/vlans/vlan/tagged-ports` supported.
    references: [vyos-nxos-surface]

  "vlans[].description":
    disposition: good
    note: >
      Empty on both sides of every cell: vyos declares no path under
      `/vlans/vlan/` beyond the unsupported `id` and the unsupported L3 mount,
      and emits no VLAN description anywhere; the synthesised target record
      carries none either.
      Recorded separately because cisco_nxos declares `/vlans/vlan/description`
      LOSSY on its own merits — its render emits the VLAN name but no separate
      description line — which would matter for a source that actually
      produces one.  VyOS does not, so no loss is evidenced here and the
      record-count change stays with `vlans[].id`.
    references: [vyos-nxos-surface]

  # -- Routing --------------------------------------------------------------

  static_routes:
    disposition: good
    note: >
      Preserved on all 4 cells that populate it — 7 routes in, 7 out,
      destination / next-hop / metric intact, IPv4 and IPv6 alike
      (`ip route` and `ipv6 route` both render and re-parse).  Both matrices
      declare `/routing/static-route` supported.
      Two caveats that are declared rather than observed, because no committed
      cell exercises either: both codecs declare
      `/routing/static-route/description` LOSSY, and no route in the corpus
      carries one; and vyos declares `/routing/static-route/vrf` UNSUPPORTED
      (per-VRF statics are deferred past its Phase-3 VRF wire-up) while
      cisco_nxos declares it supported, so a VyOS config with routes inside a
      `vrf name <X>` block would lose their VRF binding on the SOURCE side
      before NX-OS ever saw them.  No corpus route sets a VRF, so that is a
      warning, not a measurement.
    references: [vyos-nxos-surface]

  dhcp_servers:
    disposition: unsupported
    reason: >
      A symmetric gap: BOTH matrices declare `/dhcp-servers/pool`
      unsupported, with the same reason on each side ("render emits no DHCP
      server pool; intent.dhcp_servers are dropped on migration").  The
      concept dies in transit regardless of which side you blame, which is why
      this is `unsupported` and not the `not_applicable` used for gaps the
      target could hold.  No committed cell populates it, so the gap is
      declared rather than observed.  Re-author DHCP scopes on the Nexus by
      hand if the box serves them.
    references: [vyos-nxos-surface]

  # -- SNMP -- v1/v2c clean, the v3 cipher token is not ----------------------
  #
  # 4 of 13 cells populate an SNMP block.  Community, location and contact
  # round-trip byte-for-byte on every one of them, so the three keys below are
  # `good` on measurement rather than on declaration.  Values are not quoted
  # anywhere in this file: a community string is a shared secret.

  "snmp.community":
    disposition: good
    note: >
      Preserved on all 3 cells that set a community — the string round-trips
      byte-for-byte through `snmp-server community <name>`.  Both matrices
      declare `/snmp/community` supported.  The value itself is deliberately
      not reproduced here or in the reference doc.
    references: [vyos-nxos-surface]

  "snmp.location":
    disposition: good
    note: >
      Preserved on both cells that set it, including one whose value contains
      spaces and a slash — `snmp-server location <text>` carries the whole
      line and re-parses intact.  Both matrices declare `/snmp/location`
      supported.
    references: [vyos-nxos-surface]

  "snmp.contact":
    disposition: good
    note: >
      Preserved on both cells that set it.  Both matrices declare
      `/snmp/contact` supported.
    references: [vyos-nxos-surface]

  "snmp.trap_hosts":
    disposition: good
    note: >
      Stated plainly rather than implied: there is NO populated round-trip
      behind this `good`.  vyos declares no `/snmp/trap-host` path at all and
      emits no trap destination on any of the 13 cells, so the field is empty
      on both sides everywhere it was measured.  cisco_nxos declares
      `/snmp/trap-host` SUPPORTED, so trap destinations entered on the Nexus
      will stick — they simply have to be entered, because nothing carries
      them across.
    references: [vyos-nxos-surface]

  "snmp.v3_users":
    disposition: lossy
    reason: >
      Drifts on both cells that carry a USM record, and the drift is a single
      token: the canonical privacy protocol `aes` is rendered as NX-OS's
      `priv aes-128` and re-parses as `aes128`.  Everything else about the
      user survives — name, group, auth protocol, engine ID, and both key
      blobs verbatim.
      `lossy` and not `unsupported`: the record does not vanish, its cipher
      discriminator gets MORE specific.  Both codecs declare `/snmp/v3-user`
      supported.  Read the direction carefully before acting on it — vyos
      declares `/snmp/v3-user/priv-protocol` lossy because ITS render collapses
      AES-192/256 down to bare `aes`, so on a corpus that had used a stronger
      cipher the source value would already have been degraded before NX-OS
      saw it.
      Independent of the token, re-key every SNMPv3 user on the Nexus.  Both
      matrices declare the auth and privacy passphrase paths lossy in their own
      right (VyOS stores an opaque `encrypted-password` blob; NX-OS normalises
      to the older `localizedkey` digest form), and a key localized against one
      agent's engine ID does not authenticate against another's.  No key
      material or engine ID is reproduced in this file.
    references: [vyos-nxos-surface]

  # -- LAGs -- renamed correctly, and stranded --------------------------------

  lags:
    disposition: lossy
    reason: >
      One cell carries a LAG (`kitchen_sink.conf`) and it drifts.  The record
      does NOT vanish: 1 LAG in, 1 LAG out, members `eth4` and `eth5` intact,
      mode `active` intact — which is why this is `lossy` and not
      `unsupported` (#436), and why it reads nothing like the same key on
      `cisco_iosxr__arista_eos`, where every bundle disappears outright.
      cisco_nxos declares `/lags/lag/name`, `/lags/lag/members` and
      `/lags/lag/mode` ALL supported, so the target models the concept fully.
      What drifts is the record's IDENTITY: `bond0` -> `port-channel0`, via a
      rendered `channel-group 0 mode active` under each member.  The rename is
      correct — `port-channel<N>` is NX-OS's native vocabulary — but the
      render emits NO `interface port-channel0` stanza anywhere, while the
      source `bond0` INTERFACE record (which carries the bundle's L3 and its
      description) renders as `interface bond0`, a foreign-named ordinary
      interface.  After migration the addressing sits on `bond0`, which is not
      the bundle, and the real `port-channel0` is referenced by two members and
      configured nowhere.  Re-home the bundle's L3 onto `port-channel0` by
      hand.
      This and `interfaces[].lag_member_of` are ONE mechanism, not two
      independent findings — neither corroborates the other, and this entry is
      here because the record is measured on the LAG list.
      One declared-not-observed caveat: vyos declares `/lags/lag/mode` lossy
      (non-LACP bonding modes collapse to `static`).  The corpus LAG is
      802.3ad, which maps to `active` and round-trips, so that particular
      sub-loss is untested here.
    references: [vyos-nxos-surface]

  # -- Identity -- one account does not survive the parser -------------------

  "local_users[].name":
    disposition: lossy
    reason: >
      17 local-user records across the 13 cells; 16 survive with their names
      intact and 1 disappears.  The rule is clean enough to act on: every
      account carrying a `$6$` SHA-512 crypt hash survives; the ONE account
      whose VyOS stanza sets `encrypted-password ""` is gone.  That account is
      `netadmin` on `houdev_vyos_dhcpv6_pd_client.conf`, and it is the only
      user on that cell, so the round-tripped user list is empty.
      Where it is lost matters, because "the render dropped it" would be
      wrong.  The render DOES emit the account, as `username netadmin role
      admin`.  The NX-OS username pattern requires a `password <type> <hash>`
      clause between the name and the role, so that line matches nothing on
      re-parse and the account is silently gone.
      Recorded `lossy` rather than `unsupported` deliberately: cisco_nxos
      declares `/local-users/user/name` SUPPORTED and does emit users, so this
      is a partial record loss inside a concept the target models — not the
      concept-level gap that forces `unsupported` under #436.
      Before cutover, list the source accounts and diff them against the
      render: a silently missing admin account is how a migration locks you
      out.
    references: [vyos-nxos-surface]

  "local_users[].role":
    disposition: good
    note: >
      Role is preserved on every user record that survives the round-trip —
      `admin` stays `admin`, zero role drift measured on any of the 16
      surviving records.  Both matrices declare `/local-users/user/role`
      supported.
      This key measures what happens to the VALUE when the record survives,
      and the answer is: nothing.  The one account that vanishes is accounted
      for once, under `local_users[].name`; recording the same disappearance
      again here would double-count a single loss.
      A caveat about a DIFFERENT canonical field, which this key does not
      cover and does not claim: `privilege_level` degrades 15 -> 1 on all 16
      surviving records, because cisco_nxos maps a role back to a privilege
      only for `network-admin` / `vdc-admin` and VyOS accounts carry the string
      `admin`.  Both matrices already declare
      `/local-users/user/privilege-level` lossy.  It is the reason the whole
      `local_users` field reads as drifted on 12 otherwise-clean cells.
    references: [vyos-nxos-surface]

  "local_users[].hashed_password":
    disposition: good
    note: >
      The credential SURVIVES: all 16 surviving records round-trip their
      `$6$` SHA-512 crypt hash byte-identical — zero drift on any cell.  Both
      matrices declare `/local-users/user/hashed-password` supported.  Notable
      because this key is `lossy` on most pairs in the mesh; here the NX-OS
      parser strips the type digit it added on render, so the canonical value
      comes back exactly as it left.
      The record that disappears is accounted for once, under
      `local_users[].name` — not a third time here.
      One caveat that belongs to the RENDERED TEXT rather than to the
      canonical comparison, and so changes no disposition: the hashes are
      emitted under NX-OS's type-0 (CLEARTEXT) marker, in the form
      `username <name> password 0 <crypt body> role admin`.  A Nexus reading
      that line would take the crypt string itself as the plaintext password.
      The fidelity harness scores preservation, not target-syntax validity.
      Set passwords on the target before cutover and treat no migrated account
      as having a working credential.  No hash body is reproduced in this file
      or its reference doc — only the crypt-scheme marker and the NX-OS type
      digit are described.
    references: [vyos-nxos-surface]

  radius_servers:
    disposition: unsupported
    reason: >
      A symmetric gap: BOTH matrices declare `/radius-servers/server/host` AND
      `/radius-servers/server/key` unsupported, each with the same reason
      ("render emits no RADIUS config").  No committed cell populates the
      field, so the gap is declared rather than observed.  Re-author RADIUS on
      the Nexus — and note that the shared key could not have migrated even if
      the server list had, because the key path is unsupported on both sides
      independently.
    references: [vyos-nxos-surface]

  # -- Fabric -- the overlay largely survives --------------------------------

  "vxlan_vnis[].vni":
    disposition: good
    note: >
      Preserved on all 3 cells that populate a VNI — 10, 10 and 10100 — through
      `interface nve1 / member vni <n>`.  vyos declares `/vxlan-vnis/vni`
      supported.
      Recorded `good` on measurement despite cisco_nxos declaring the same path
      LOSSY: its reason is the per-VNI sub-flags (`suppress-arp`,
      `ingress-replication protocol bgp`) not round-tripping, and no corpus
      cell sets one.  The VNI number itself is clean on every cell.
      Two ADJACENT sub-fields that are not audited keys on this pair do drift
      on 2 cells each and are worth an operator's attention:
      `source_interface` (empty -> `loopback0`, the NVE render supplying a VTEP
      source the VyOS netdev did not name) and `udp_port`
      (`8472` -> `4789`, cisco_nxos declares `/vxlan-vnis/udp-port` lossy for
      exactly this).  If the far-end VTEPs are still on the legacy Linux port
      8472, the overlay will not come up.
    references: [vyos-nxos-surface]

  "vxlan_vnis[].vlan_id":
    disposition: good
    note: >
      Preserved on all 3 cells — 10, 10 and 1912 — through the rendered
      `vlan <id> / vn-segment <vni>` pair.  Clean on measurement even though
      vyos declares `/vxlan-vnis/vlan-id` LOSSY on its own side (VyOS models
      one VNI per netdev with no VLAN on the device, so the canonical
      `vlan_id` is synthesised); the synthesised value is deterministic and
      survives the NX-OS round-trip intact.  cisco_nxos declares no path for
      it either way.
      This is the same binding that causes the target to gain a VLAN record —
      see `vlans[].id`, which is where that structural signal is claimed.
    references: [vyos-nxos-surface]

  "vxlan_vnis[].mcast_group":
    disposition: good
    note: >
      No committed cell populates a multicast group: all 3 VNI-carrying cells
      use head-end replication and carry a `flood_list` instead, which
      round-trips.  This `good` therefore rests on DECLARATIONS, not on an
      observed round-trip — both codecs declare `/vxlan-vnis/mcast-group`
      supported at the exact path.  Stated that way rather than implied.
    references: [vyos-nxos-surface]

  evpn_type5_routes:
    disposition: not_applicable
    note: >
      Source-side gap, measured rather than declared: vyos declares no path
      under `/evpn-type5-routes/` at all, and the field is empty on all 13
      cells.  The reason is structural — VyOS carries EVPN control-plane state
      under `protocols bgp ... address-family l2vpn-evpn`, which vyos declares
      Tier-3 and unsupported (`/routing-protocols/bgp`), and it declares
      `/vxlan-vnis/l2vni-route-target` unsupported for the same reason.  So no
      type-5 record can enter the canonical tree from this source.
      cisco_nxos declares `/evpn-type5-routes/route` lossy (it models type-5 as
      a VRF property via `l3_vni` rather than per-prefix records), which is
      moot when the source emits nothing.
    references: [vyos-nxos-surface]

  # -- VRFs ------------------------------------------------------------------

  "routing_instances[].name":
    disposition: good
    note: >
      Preserved on the single cell that populates a VRF (`kitchen_sink.conf`,
      instance `BLUE`): 1 instance in, 1 out, name intact, rendered as
      `vrf context BLUE` with the member interface keeping its
      `vrf member BLUE` binding.  Both matrices declare
      `/routing-instances/instance/name` supported.
      Thin coverage — one cell — and said so rather than implied.
    references: [vyos-nxos-surface]

  "routing_instances[].description":
    disposition: not_applicable
    note: >
      Source-side gap, and an asymmetric one worth flagging for the reverse
      pair.  vyos declares no path for
      `/routing-instances/instance/description` and emits none: the one VRF in
      the corpus carries an empty description on both sides.  cisco_nxos
      declares the path SUPPORTED, so a VRF description authored on the Nexus
      will hold — there is simply nothing coming across to hold.
      Distinct from `cisco_iosxr__arista_eos`, where this key is a measured
      `lossy`; here there is no source value to lose.
    references: [vyos-nxos-surface]

  # -- Passthrough / vendor-specific ----------------------------------------

  raw_sections:
    disposition: not_applicable
    note: >
      Not populated on either side of any cell.  Neither codec declares the
      field supported, and both discard their vendor-specific blocks at parse:
      vyos declares `/system/raw-sections/version-banner` lossy (the
      `// vyos-config-version` trailer plus the not-yet-modelled `service` /
      `system` management blocks are dropped on parse and a synthesised
      trailer emitted on render), and cisco_nxos declares
      `/system/raw-sections/{vdc,features}` lossy (it synthesises a default
      single-VDC wrapper and derives `feature` lines from the canonical tree
      shape).  Nothing survives into the canonical field from this source, so
      there is nothing for the target to lose.
    references: [vyos-nxos-surface]

  apply_groups:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair declares or populates it."
    references: [vyos-nxos-surface]

  group_content:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair declares or populates it."
    references: [vyos-nxos-surface]

  anycast_gateway_mac:
    disposition: not_applicable
    note: >
      Source-side gap: vyos declares `/anycast-gateway-mac` unsupported ("VyOS
      has no VARP / distributed-anycast-gateway grammar"), so the chassis-wide
      MAC never enters the canonical tree from this source; measured empty on
      all 13 cells.  cisco_nxos declares it SUPPORTED — it renders
      `fabric forwarding anycast-gateway-mac` — so a distributed anycast
      gateway is something to BUILD on the Nexus after the migration rather
      than something the migration loses.
    references: [vyos-nxos-surface]
