# Cross-vendor fidelity expectations: dell_os10 -> vyos
#
# Source: dell_os10 codec.  Target: vyos codec.
#
# Every disposition below is resolved through the audit's own
# `actual_disposition()` over a measured `tools/run_full_mesh.py`
# pass, NOT read off the two capability matrices.  That ordering
# is forced by the per-pair unevidenced ratchet
# (`test_no_new_pair_declares_a_loss_it_never_observes`), which
# allows a NEW pair exactly zero declared-but-never-observed
# losses: a field this corpus preserves on every cell MUST be
# `good`, so hedging to `lossy` when unsure fails the build just
# as surely as missing a real loss does.  The matrices supply
# only the MECHANISM prose for a loss the corpus exhibits.
#
# Measured: 1 fixture cell, 0 render errors, 0 re-parse errors.
# Dispositions: {'unsupported': 7, 'good': 18, 'not_applicable': 8, 'lossy': 13}
#
# Schema spec: tests/fixtures/cross_vendor_expectations/README.md
# Vendor reference cache: docs/vendor-references/dell_os10_to_vyos/
#
# Authored 2026-09-21 with the dell_os10 registration (Phase 4).

meta:
  source_vendor: dell_os10
  target_vendor: vyos
  primary_use_case: >
    Migrating a Dell EMC PowerSwitch running SmartFabric OS10 onto VyOS.
    OS10's supported surface is hostname, interfaces (three-segment
    `ethernet1/1/1` naming, CIDR addressing, `ip vrf forwarding`, L2
    switchport and `channel-group`), SVI-derived VLANs, `port-channel`
    LAGs, VRFs, static routes including the separate `management route`
    RIB, local users, SNMP v2c/v3 and real VRRP. This file records which
    of those survive the render into VyOS and which do not.
  certainty: medium
  references:
    - id: os10-vyos-surface
      path: docs/vendor-references/dell_os10_to_vyos/canonical_surface.md
      title: "Dell OS10 -> VyOS: measured canonical surface (1 fixture cell)"
      source_url: "https://github.com/netcanon/netcanon"
      retrieved: "2026-09-21"

# -------------------------------------------------------------------------

per_field_expectation:

  anycast_gateway_mac:
    disposition: unsupported
    reason: >
      VyOS renders no instance of this surface, so the record cannot
      exist on the target side at all. NOT EXERCISED BY THIS CORPUS —
      all 1 cells are empty on both sides, so this disposition rests
      on the target codec's own capability declaration rather than on
      an observed round-trip. Companion to the anycast virtual-gateway
      entries above: VyOS has no VARP / distributed-anycast-gateway
      grammar, so the chassis-wide anycast-gateway MAC is dropped on
      render. Previously undeclared (classify() fail-opened to
      supported) — Fable review MTX-3. Measured over 1 cell: drifted
      on 0, preserved on 0, both sides empty on 1.
    references: [os10-vyos-surface]

  apply_groups:
    disposition: good
    note: >
