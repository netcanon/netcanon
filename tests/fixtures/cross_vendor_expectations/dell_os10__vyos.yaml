  static_routes:
    disposition: good
    note: >
      Preserved on all 5 cells that populate it (4 committed inputs and the
      synthetic kitchen sink): 7 routes in, 7 out, destination, gateway,
      metric and VRF intact.  4 of the 7 are routes of a VRF, the
      `management` VRF's among them, and each comes back in its VRF: VyOS
      writes such a route under `vrf name <X> protocols static`, and
      declares a VRF that a route names and the config does not (see
      `routing_instances`).  Both matrices declare `/routing/static-route`
      and `/routing/static-route/vrf` supported.
      One caveat that is declared rather than observed: vyos declares
      `/routing/static-route/description` lossy, and no committed route
      sets a description.
    references: [os10-vyos-surface]

