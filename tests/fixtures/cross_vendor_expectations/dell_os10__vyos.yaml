  vlans[].description:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round
      trip. OS10 carries exactly one human label for a VLAN — the
      SVI's `description` — and the render spends it on
      CanonicalVlan.name. A separate canonical VLAN description has no
      second place to go and is dropped. Measured over 1 cell: drifted
      on 1, preserved on 0, both sides empty on 0.
    references: [os10-vyos-surface]

  vlans[].id:
    disposition: unsupported
    reason: >
      VyOS renders no instance of this surface, so the record cannot
      exist on the target side at all. VyOS has no top-level VLAN
      database; 802.1Q VLANs are modelled as `vif <vid>` sub-
      interfaces (rendered as `ethN.<vid>` CanonicalInterfaces), which
      ARE supported. Measured over 1 cell: drifted on 1, preserved on
      0, both sides empty on 0.
    references: [os10-vyos-surface]

