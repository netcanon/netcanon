    reason: >
      The anchor renders but the value does not survive the round
      trip. RouterOS exposes a single per-VLAN ``comment`` field,
      which the parser maps to the VLAN name; a separate description
      collides with it on render and may be conflated with the name.
      Measured over 1 cell: drifted on 1, preserved on 0, both sides
