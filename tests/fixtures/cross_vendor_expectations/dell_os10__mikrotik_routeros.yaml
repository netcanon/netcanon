  vlans[].ipv4_addresses:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round
      trip. Renders VLAN SVI / management L3 only from a sibling
      interface stanza; an L3 address carried on the VLAN record
      itself (the Junos irb / Aruba SVI-on-VLAN shape, folded onto
      CanonicalVlan.ipv4_addresses) is dropped on render because this
      codec does not synthesize an SVI from the VLAN record. Declared
      lossy so validate_against surfaces the loss instead of reporting
      severity:ok (blind-audit 3ec11f3 T0-2). Measured over 1 cell:
      drifted on 1, preserved on 0, both sides empty on 0.
    references: [os10-routeros-surface]

  vlans[].name:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round
      trip. MikroTik stores a VLAN's name as the L3 interface name
      (e.g. vlan10), NOT a separate descriptive name field. Cross-
      vendor rendering may conflate the two. Measured over 1 cell:
      drifted on 1, preserved on 0, both sides empty on 0.
    references: [os10-routeros-surface]

  vlans[].tagged_ports:
    disposition: unsupported
    reason: >
      RouterOS renders no instance of this surface, so the record
      cannot exist on the target side at all. RouterOS binds a VLAN
      interface to a single parent; multi-port tagged membership
      (switchport's VLAN-centric twin) is dropped on render. Measured
      over 1 cell: drifted on 1, preserved on 0, both sides empty on
      0.
    references: [os10-routeros-surface]

