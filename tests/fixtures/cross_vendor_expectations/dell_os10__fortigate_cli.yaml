  snmp.community:
    disposition: lossy
    reason: >
      `'' -> 'public'` on `azlocal_tor1`/`tor2`: when the source carries no
      v2c community the FortiGate renderer SYNTHESISES one
      (`fortigate_cli/render.py:832`, `tree.snmp.community or "public"`).
      That is deliberate and commented in the render path, but it invents a
      community string the operator never wrote -- and `public` is the
      default every scanner tries.
      DECLARED, NOT BLESSED: this is carried as a known product question
      (2026-09-22 review, confirmed smaller findings) and the disposition
      records what the code does today rather than endorsing it.  If the
      synthesis is removed, flip this back to `good`.
    references: [os10-fortigate-surface]

