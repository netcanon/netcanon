      codec does not synthesize an SVI from the VLAN record. Declared
      lossy so validate_against surfaces the loss instead of reporting
      severity:ok (blind-audit 3ec11f3 T0-2). Measured over 7 cells:
      drifted on 5, preserved on 0, both sides empty on 2.
