  vlans[].description:
    disposition: lossy
    reason: >
      OS10 (its one label is the name) states no VLAN description; the round
      trip gives each named VLAN one, its name, which the OPNsense render
      writes as the device's `<descr>` (see `vlans[].name`). Drifts on every
      cell, by gaining the name, never by losing a value.  This field also
      owns the change of the list's size: every VLAN is written as a `<vlan>`
      device on a LAGG or a port and read back as a routed sub-interface of
      it, with no VLAN record (see `vlans[].id`).
    references: [os10-opnsense-surface]

  vlans[].id:
    disposition: lossy
    reason: >
      Every VLAN record is dropped on all 10 cells (13, 13, 13, 13, 3, 15, 19,
      15, 19 and 4 records), and its id with it.  OPNsense has no VLAN apart
      from a VLAN device on one parent: the render writes each VLAN as a
      `<vlan>` device on a LAGG or a port that carries it, else on the first
      LAGG or port, and the OPNsense parser reads a device on a port or a LAGG
      back as a routed sub-interface of it, its tag the VLAN's id, with no
      VLAN record (opnsense declares `/vlans/vlan/id` lossy).  Up to 0.7.7
      every device was read back as a VLAN.  The change of size is attributed
      to `vlans[].description`, the first field of the list here.
    references: [os10-opnsense-surface]

  vlans[].ipv4_addresses:
    disposition: lossy
    reason: >
      The OS10 parser carries an `interface vlan<N>` address on the canonical
      VLAN record as well as on the interface. The address reaches the output:
      the render writes the VLAN interface the source states (`vlan461`) as a
      zone whose `<if>` is the VLAN's `<vlan>` device, with the address on the
      zone. Read back, the OPNsense parser puts the address on that interface
      record, not on the VLAN — an OPNsense `<vlan>` holds no address — so the
      VLAN record comes back without it. Recorded `lossy` for the record the
      address sits on, not for the output.
    references: [os10-opnsense-surface]

  vlans[].name:
    disposition: lossy
    reason: >
      The name does not come back. The OPNsense render writes each VLAN as a
      `<vlan>` device: under the name of the source's VLAN interface where
      there is one (`vlan710`), otherwise as `<parent>_vlan<id>` on a port
      that carries the VLAN or a default one (`port-channel10_vlan701`); and
      it writes the VLAN's name as the device's `<descr>` where the VLAN has
      no description. An OPNsense `<vlan>` has no name of its own: the
      OPNsense parser names a VLAN after its device (`<vlanif>`) and reads
      `<descr>` as its description. The OS10 parser names a VLAN from its
      SVI's description, the one label OS10 has for a VLAN; so `mgmt
      10.0.1.0/24` comes back as the description of a VLAN named `vlan710`,
      and a VLAN with no name comes back named after its device. Drifts on
      every cell.
    references: [os10-opnsense-surface]

  vlans[].tagged_ports:
    disposition: unsupported
    reason: >
      OPNsense renders no instance of this surface, so the record
      cannot exist on the target side at all. OPNsense binds a VLAN to
      a single parent sub-interface; multi-port tagged membership
      (switchport's VLAN-centric twin) is dropped on render. Measured
      over 1 cell: drifted on 1, preserved on 0, both sides empty on
      0.
    references: [os10-opnsense-surface]

  vlans[].untagged_ports:
    disposition: unsupported
    reason: >
