  static_routes:
    disposition: unsupported
    reason: >
      OPNsense renders no instance of this surface, so the record
      cannot exist on the target side at all. Parse harvests routes
      (the <gateways> default route + <staticroutes>/<route> entries,
      resolving named gateways to their IP; promotion #15), but the
      config.xml renderer emits no <staticroutes>/<route> block, so
      the ENTIRE route is dropped on render. Declared unsupported
      (block): the record does not survive, which is not a lossy
      round-trip (audit f92e97a T0-1; severity corrected in the scope
      re-weight wave). Measured over 1 cell: drifted on 1, preserved
