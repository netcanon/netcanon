  interfaces[].vrrp_groups:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round
      trip. OPNsense's <virtualip> hosts CARP-only HA groups in the v1
      wire-up. CanonicalVRRPGroup records with mode='vrrp' or
      mode='hsrp' are SKIPPED on render — OPNsense has no native HSRP
      wire protocol, and its pure-VRRP mode under <virtualip> is
      rarely deployed and not yet emitted by this codec. Only
      mode='carp' round-trips. Additionally, the advskew↔priority
      mapping (priority = 254 - advskew) preserves relative HA-pair
      ordering but not exact election timing — VRRP priorities are
      advisory weights, CARP advskews are advertisement-interval
      offsets, so cross-protocol migration loses the timing semantics.
      Measured over 1 cell: drifted on 1, preserved on 0, both sides
      empty on 0.
    references: [os10-opnsense-surface]

