  hostname:
    disposition: good
    note: >
      Preserved on 1 of 1 cells; no cell drifts. Both codecs model
      this surface.
    references: [os10-opnsense-surface]

  interfaces[].name:
    disposition: lossy
    reason: >
      No source record is lost — every OS10 name comes back verbatim — but the
      inventory grows on 9 of 10 cells: a VLAN that has no SVI in the source
      is written as a `<parent>_vlan<id>` `<vlan>` device
      (`port-channel10_vlan701`), which the OPNsense parser reads back as an
      interface record of its own (`ianaift:l3ipvlan`). Recorded `lossy` for
      the shape of the inventory, not its contents. This key comes first among
      the `interfaces[]` keys so that the reconciler attributes the count
      drift to it.
    references: [os10-opnsense-surface]

  interfaces[].description:
    disposition: lossy
    reason: >
      A member of a LAG is written in its lagg's ``<members>`` and in
      no zone of ``<interfaces>``: OPNsense adds only an unassigned
      interface to a LAGG ("Only unassigned interfaces can be added to
      LAGG", Other Types).  So what a member's own record holds that a
      zone would carry is not written, and a comment in the ``<lagg>``
      names the member and the elements left out, never their values.
      Measured 2026-10-20: 9 of the 175 records that carry a
      description are port-channel members and lose it.  Every other
      record keeps its text, checked by name on the cells whose
      inventory grows, where the reconciler compares the list as a
      whole and attributes the drift to `interfaces[].name`.
      No cell's comparison shows the loss: on each cell that holds
      such a member, the VLAN devices OPNsense reads back from
      ``<vlans>`` (``<parent>_vlan<tag>``) make the output's list
      longer, and the reconciler compares a list whose size changes
      as a whole and gives the drift to ``interfaces[].name``.  The
      loss is pinned by
      ``tests/unit/migration/test_a_lag_member_has_a_record.py``.
    references: [os10-opnsense-surface]

  interfaces[].enabled:
    disposition: good
    note: >
      Preserved on 1 of 1 cells; no cell drifts. Both codecs model
      this surface.
    references: [os10-opnsense-surface]

  interfaces[].interface_type:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round trip. OS10
      interface-type is inferred from the name prefix (ethernet ->
      ethernetCsmacd, vlan -> l3ipvlan, port-channel -> ieee8023adLag,
      loopback -> softwareLoopback, mgmt -> ethernetCsmacd). Inference is
      best-effort and will not recover every IANA type a cross-vendor source
      carried. Measured over 1 cell: drifted on 1, preserved on 0, both sides
      empty on 0. The OPNsense parser types a `<vlan>` device
      `ianaift:l3ipvlan`, so a VLAN interface the render writes as one comes
      back with that type; every other interface comes back untyped.
    references: [os10-opnsense-surface]

  interfaces[].ipv4_addresses:
    disposition: good
    note: >
