# Cross-vendor fidelity expectations: cisco_iosxr -> cisco_nxos
#
# Source: cisco_iosxr codec — IOS-XR `show running-config` text.
# Target: cisco_nxos codec — NX-OS CLI render.
#
# Asymmetric by device class. cisco_iosxr in the committed corpus is a
# service-provider edge/core router — PE / P / route-reflector roles,
# 4-segment interface names, `Bundle-Ether` aggregates, BVIs, and a VRF
# surface whose RD is harvested from `router bgp`. cisco_nxos is a DC
# leaf/spine. The realistic migration is a PE/P router being re-homed onto a
# Nexus, so the shared surface is the routed edge — interface addressing,
# MTU, admin state, VRF names, static routes, local user identity — and NOT
# the campus L2 surface, which IOS-XR does not model at all (it declares
# switchport-mode / access-vlan / trunk-allowed-vlans / trunk-native-vlan /
# voice-vlan all unsupported).
#
# READ THIS BEFORE COMPARING WITH `aruba_aoscx__arista_eos.yaml`: this pair is
# the INVERSE of that one. There the dominant loss was structural — the
# interface list shrank and every `interfaces[].*` sub-field went lossy with
# it. Here the interface inventory is FULLY PRESERVED: 156 interface records
# in, 156 out, identical name sets on all 12 cells. Every interface sub-field
# that survives is therefore declared `good` on its own measurement rather
# than dragged down by a vanishing parent, and the two that do not survive are
# genuine per-attribute losses.
#
# There are exactly three losses on this pair: the IANA interface-type hint
# (degraded to `ianaift:other` on 126 of 156 records), and the LAG surface —
# `interfaces[].lag_member_of` plus `lags`, which are ONE mechanism and are
# cross-referenced rather than counted twice.
#
# Dispositions are grounded in the codecs' `CapabilityMatrix` declarations and
# a full `run_full_mesh.py` pass over the committed corpus (12 fixture cells,
# 0 render errors, 0 re-parse errors), resolved through the audit's own
# `actual_disposition()` so this file and the ratchet cannot disagree. Every
# loss recorded below was additionally re-derived by hand — parse the fixture
# with cisco_iosxr, render with cisco_nxos, re-parse the render, diff the two
# canonical trees — not inferred from the drift shape.
#
# Schema spec: tests/fixtures/cross_vendor_expectations/README.md
# Vendor reference cache: docs/vendor-references/cisco_iosxr_to_cisco_nxos/
#
# Authored 2026-08-25 as part of the cisco_iosxr expectation mesh.

meta:
  source_vendor: cisco_iosxr
  target_vendor: cisco_nxos
  primary_use_case: >
    Provider-edge re-home: a Cisco IOS-XR PE/P router replaced by a Cisco
    Nexus carrying the same routed interfaces, VRFs and static routing.
    Hostname, domain, the complete interface inventory with its descriptions,
    admin state, MTU and IPv4/IPv6 addressing, the dot1q-harvested VLAN IDs,
    static routes, VRF names and descriptions, and local-user identity
    (username, role and password digest) all survive intact.  What does not is
    the IANA interface-type hint on every SP-named port, and the LAG surface:
    `Bundle-Ether<N>` is rebuilt from `channel-group <N>` as
    `port-channel<N>`, and a bundle with no members loses its LAG record
    entirely.  Two things the codecs model but this corpus never exercises are
    worth planning for anyway: the VRF route-distinguisher does not travel
    (IOS-XR derives it from the Tier-3 `router bgp` stanza), and SNMP is out
    of the IOS-XR v1 scope, so it must be re-authored on the Nexus.
  certainty: medium
  references:
    - id: iosxr-nxos-surface
      path: docs/vendor-references/cisco_iosxr_to_cisco_nxos/canonical_surface.md
      title: "IOS-XR -> NX-OS: measured canonical surface (12 fixture cells)"
      source_url: "https://github.com/netcanon/netcanon"
      retrieved: "2026-08-25"

# ---------------------------------------------------------------------------

per_field_expectation:

  # -- Tier 1 -- system scalars ---------------------------------------------

  hostname:
    disposition: good
    note: "`hostname <name>` on both platforms; preserved on 12 of 12 cells."
    references: [iosxr-nxos-surface]

  domain:
    disposition: good
    note: >
      Preserved on all 8 cells that carry a domain; the other 4 have none.
      Worth recording that this `good` rests on measurement rather than
      declaration: the cisco_iosxr matrix lists `/system/domain` NOWHERE —
      not supported, not lossy, not unsupported — while the codec plainly
      parses `domain name <x>` and the value survives the round-trip.
      cisco_nxos declares the path supported.  That missing source
      declaration is a matrix gap, not a pair-specific fact, and is left for
      a codec change rather than patched here.
    references: [iosxr-nxos-surface]

  dns_servers:
    disposition: good
    note: >
      Both matrices declare `/system/dns-server` supported.  No committed cell
      on this pair populates the field, so this disposition rests on the two
      declarations and NOT on an observed round-trip — stated plainly rather
      than implied.  Nothing was measured that could contradict it.
    references: [iosxr-nxos-surface]

  ntp_servers:
    disposition: good
    note: >
      Both matrices declare `/system/ntp-server` supported, and the one cell
      that populates it (`iosxr_design_cst_pa3_xr752.cfg`, two servers)
      round-trips with the list intact and in order.
    references: [iosxr-nxos-surface]

  timezone:
    disposition: unsupported
    reason: >
      Both matrices declare `/system/timezone` unsupported with the same
      reason — "Render emits no clock/timezone stanza; intent.timezone is
      dropped on migration" — so this is a symmetric gap in the pair rather
      than an NX-OS limitation.  Set the timezone on the target by hand;
      nothing in the migration will carry it.
    references: [iosxr-nxos-surface]

  syslog_servers:
    disposition: good
    note: >
      Both matrices declare `/system/syslog-server` supported.  As with
      `dns_servers`, no committed cell populates it, so this rests on the
      declarations rather than on a measured round-trip.
    references: [iosxr-nxos-surface]

  # -- Interfaces -- fully preserved inventory, two attribute losses ---------
  #
  # 156 interface records in, 156 out, identical name sets on all 12 cells.
  # There is no structural collapse on this pair, so each sub-field below
  # stands on its own measurement.

  "interfaces[].name":
    disposition: good
    note: >
      Preserved on 12 of 12 cells — 156 records in, 156 out, no record
      dropped and none invented.  Not a given: cisco_iosxr declares
      `/interfaces/interface/4th-port-segment` lossy because IOS-XR port
      names carry four segments (rack/slot/instance/port) while the
      cross-vendor `PortIdentity` models only three.  That path bites the
      port-RENAME helper, not the bare render — the NX-OS render emits the
      IOS-XR name verbatim, so the canonical name round-trips byte-identical
      here.  It also means the rendered config keeps IOS-XR-shaped names
      (`GigabitEthernet0/0/0/1.35`) that a Nexus will not accept as-is;
      canonical fidelity and target idiomaticity are different questions.
    references: [iosxr-nxos-surface]

  "interfaces[].description":
    disposition: good
    note: >
      Both matrices declare `/interfaces/interface/config/description`
      supported.  Preserved on every record of all 9 cells that populate it
      (39 described records); the other 3 cells carry no descriptions.
    references: [iosxr-nxos-surface]

  "interfaces[].enabled":
    disposition: good
    note: >
      Admin state is declared supported on both sides and preserved on every
      record of all 12 cells.  An IOS-XR `shutdown` arrives as an NX-OS
      `shutdown`.
    references: [iosxr-nxos-surface]

  "interfaces[].mtu":
    disposition: good
    note: >
      `/interfaces/interface/config/mtu` is supported on both sides and
      preserved on every record of the 4 cells that set an MTU (11 records);
      the other 8 cells carry no explicit MTU.
    references: [iosxr-nxos-surface]

  "interfaces[].ipv6_addresses":
    disposition: good
    note: >
      `/interfaces/interface/ipv6/address/ip` + `prefix-length` are supported
      on both sides and preserved on every record of the 3 cells that carry
      IPv6 (11 records).  Note what is NOT covered by this `good`: cisco_nxos
      declares `/interfaces/interface/ipv6/address/virtual-gateway-address`
      unsupported, and cisco_iosxr declares it unsupported too — so IPv6
      anycast-gateway addressing is a symmetric gap the source never emits
      and this corpus never exercises.
    references: [iosxr-nxos-surface]

  "interfaces[].ipv4_addresses":
    disposition: good
    note: >
      Routed-port addressing is supported on both sides and preserved on
      every record of all 12 cells (60 addressed records).  This is where the
      L3 for a dot1q sub-interface lives on this pair — an IOS-XR
      `GigabitEthernet0/0/0/1.35` carries the address that a campus source
      would have mounted on the VLAN record (see `vlans[].ipv4_addresses`).
    references: [iosxr-nxos-surface]

  "interfaces[].interface_type":
    disposition: lossy
    reason: >
      Degrades to `ianaift:other` on 126 of 156 records, on all 12 cells.
      Neither codec stores the type — both INFER it from the name prefix on
      parse, and the cisco_nxos matrix declares
      `/interfaces/interface/config/type` lossy for exactly this: "NX-OS
      interface-type is inferred from the name prefix (Ethernet ->
      ethernetCsmacd, loopback -> softwareLoopback, Vlan -> l3ipvlan,
      port-channel -> ieee8023adLag, nve -> tunnel, mgmt ...)".  cisco_iosxr
      declares the same path lossy from its own side.  The render preserves
      the IOS-XR name verbatim and IOS-XR's SP naming matches none of those
      prefixes, so the re-parse falls through to `other`:
      `GigabitEthernet...` (72 records) and `TenGigE...` (40) and
      `HundredGigE...` (4) lose `ianaift:ethernetCsmacd`, and
      `Bundle-Ether...` (10) loses `ianaift:ieee8023adLag`.  `Loopback...`
      (18) and `MgmtEth...` (10) survive because they DO land on an NX-OS
      prefix.
      Recorded `lossy` rather than `unsupported` because the record and every
      other attribute on it survive intact — only the classification hint
      degrades, and nothing forwards differently.  The practical effect is on
      reporting: a migration summary generated from the target tree will call
      every revenue port "other".
    references: [iosxr-nxos-surface]

  "interfaces[].lag_member_of":
    disposition: lossy
    reason: >
      Drifts on all 15 member records across the 4 cells that carry bundles:
      `Bundle-Ether23` -> `port-channel23`, `Bundle-Ether321` ->
      `port-channel321`, and so on.  This and `lags` are ONE mechanism, not
      two independent findings — do not read either as corroborating the
      other.  The NX-OS render emits each member's `channel-group <N> mode
      active|on`, and the re-parse rebuilds the bundle reference from that
      number as `port-channel<N>`.  So the bundle ID and the membership
      itself are correct on the target; what changes is the operator-facing
      name form.  Verified by round-trip, not inferred: on every cell the
      member->bundle mapping is identical modulo the name token.
      Recorded `lossy` — the audit canonicalises LAG names before comparing
      (`_LAG_NAME_FIELDS` / `_LAG_NAME_RE`), but its prefix set covers
      ae / Po / Port-channel / Port-Channel / trk / Trk / agg / bond, and
      neither IOS-XR's `Bundle-Ether<N>` nor the lowercase `port-channel<N>`
      that the NX-OS re-parse produces matches it, so both sides fall through
      to raw equality.  That is a fact about the shared reconciler rather
      than about this pair; widening the regex is a cross-cutting tooling
      change every pair's ratchet depends on and is deliberately not made
      here.  Re-check bundle names on the target if any tooling keys off
      them.
    references: [iosxr-nxos-surface]

  "interfaces[].vrrp_groups":
    disposition: not_applicable
    note: >
      Source-side gap.  cisco_iosxr declares the whole
      `/interfaces/interface/vrrp-groups/group/*` subtree unsupported —
      "VRRP / FHRP redundancy groups are out of the v1 IOS-XR scope" — so the
      source never emits a group and no committed cell populates one
      (verified: zero VRRP groups across all 12 cells).  cisco_nxos DOES
      model FHRP, rendering every CanonicalVRRPGroup as an `hsrp` block, so
      re-authoring first-hop redundancy on the Nexus will stick.  Recorded
      `not_applicable` rather than `unsupported` because the gap is on the
      source side; the target is not the constraint.
    references: [iosxr-nxos-surface]

  # -- VLANs -- dot1q harvest, not campus L2 --------------------------------
  #
  # IOS-XR has no campus VLAN records.  The codec harvests the ID from
  # `encapsulation dot1q <N>` on a sub-interface, so a VLAN record on this
  # pair carries an id and nothing else — verified on all 4 populated cells.

  "vlans[].id":
    disposition: good
    note: >
      Both matrices declare `/vlans/vlan/id` supported and the ID is
      preserved on all 4 cells that carry VLANs (35, 35, 200, 100); the other
      8 cells have none.  These are dot1q sub-interface encapsulation IDs,
      not campus VLANs — the matching L3 lives on the sub-interface record
      under `interfaces[].ipv4_addresses`.
    references: [iosxr-nxos-surface]

  "vlans[].name":
    disposition: good
    note: >
      Both matrices declare `/vlans/vlan/name` supported.  No committed cell
      populates it — a dot1q-harvested VLAN record carries an id and an empty
      name on all 4 populated cells — so this disposition rests on the two
      declarations, not on an observed round-trip.  Said plainly rather than
      dressed up as a measurement.
    references: [iosxr-nxos-surface]

  "vlans[].ipv4_addresses":
    disposition: not_applicable
    note: >
      Source-side gap, and structural rather than declarative.  IOS-XR never
      mounts L3 on a VLAN record: verified on all 4 populated cells, every
      VLAN record has `ipv4_addresses == []`.  The address for a dot1q VLAN
      lives on its sub-interface (`GigabitEthernet0/0/0/1.35`) and
      round-trips cleanly there.  Both codecs additionally declare
      `/vlans/vlan/ipv4/address/ip` lossy with the identical reason — each
      "renders VLAN SVI / management L3 only from a sibling interface
      stanza" — so the SVI-on-VLAN shape (the Junos irb / Aruba form) would
      degrade in BOTH directions; it simply never arises from this source.
    references: [iosxr-nxos-surface]

  "vlans[].untagged_ports":
    disposition: not_applicable
    note: >
      Source-side gap.  cisco_iosxr declares `/interfaces/interface/
      switchport-mode` and `/access-vlan` unsupported — "IOS-XR is SP-routing
      with no L2 switchport model" — and declares nothing at all for
      `/vlans/vlan/untagged-ports`, so VLAN port membership cannot be
      expressed by this source.  Verified empty on all 4 populated cells.
      cisco_nxos declares `/vlans/vlan/untagged-ports` supported, so access
      membership authored on the Nexus after cutover will hold.
    references: [iosxr-nxos-surface]

  "vlans[].tagged_ports":
    disposition: not_applicable
    note: >
      Source-side gap, same shape as `vlans[].untagged_ports`: cisco_iosxr
      declares `/interfaces/interface/trunk-allowed-vlans` and
      `/trunk-native-vlan` unsupported and declares nothing for
      `/vlans/vlan/tagged-ports`.  Verified empty on all 4 populated cells.
      cisco_nxos supports the path, so trunk membership is re-authorable on
      the target.
    references: [iosxr-nxos-surface]

  "vlans[].description":
    disposition: not_applicable
    note: >
      Source-side gap: cisco_iosxr declares nothing for
      `/vlans/vlan/description` and a dot1q-harvested VLAN record carries no
      description on any of the 4 populated cells.  Recorded
      `not_applicable` rather than `unsupported` even though cisco_nxos
      declares the path LOSSY ("Render emits the VLAN name but not a separate
      description line") — that target-side loss is real but unreachable from
      this source, so flagging it here would misattribute the constraint.
    references: [iosxr-nxos-surface]

  # -- Routing --------------------------------------------------------------

  static_routes:
    disposition: good
    note: >
      Preserved on all 6 cells that populate it — 20 routes total, with
      destination, gateway, outgoing interface, metric and VRF all intact
      (3 of the 20 are per-VRF routes and keep their VRF binding).  Both
      matrices declare `/routing/static-route` and `/routing/static-route/vrf`
      supported.  Both also declare `/routing/static-route/description`
      lossy, but no committed cell sets a route description (verified: 0 of
      20), so that sub-surface is untested rather than clean — re-check it if
      your source config names its routes.
    references: [iosxr-nxos-surface]

  # -- Services -------------------------------------------------------------

  dhcp_servers:
    disposition: unsupported
    reason: >
      Both matrices declare `/dhcp-servers/pool` unsupported with the same
      reason — "Render emits no DHCP server pool; intent.dhcp_servers are
      dropped on migration" — so this is a symmetric gap in the pair.  An SP
      edge router relays DHCP rather than serving it, so the canonical pool
      is never populated from this source either (verified empty on all 12
      cells).  Re-author any DHCP scope on the target by hand.
    references: [iosxr-nxos-surface]

  "snmp.community":
    disposition: not_applicable
    note: >
      Source-side gap: cisco_iosxr declares `/snmp/community` unsupported —
      "SNMP parse + render is out of the v1 XR scope" — so the source never
      emits a community and no committed cell populates SNMP at all
      (verified: `intent.snmp` empty on all 12 cells).  cisco_nxos declares
      `/snmp/community` SUPPORTED, so re-authoring communities on the Nexus
      will stick.  Recorded `not_applicable`, not `unsupported`: the target
      is not the constraint.
    references: [iosxr-nxos-surface]

  "snmp.location":
    disposition: not_applicable
    note: >
      Source-side gap under the same umbrella as `snmp.community` — SNMP is
      out of the v1 IOS-XR scope, so the source emits no `snmp-server
      location` and the field is empty on all 12 cells.  cisco_nxos declares
      `/snmp/location` supported; re-author it on the target.
    references: [iosxr-nxos-surface]

  "snmp.contact":
    disposition: not_applicable
    note: >
      Source-side gap, same umbrella as `snmp.community`.  Empty on all 12
      cells; cisco_nxos declares `/snmp/contact` supported, so the target
      will hold it once re-authored.
    references: [iosxr-nxos-surface]

  "snmp.trap_hosts":
    disposition: not_applicable
    note: >
      Source-side gap, same umbrella as `snmp.community`.  Empty on all 12
      cells; cisco_nxos declares `/snmp/trap-host` supported.
    references: [iosxr-nxos-surface]

  "snmp.v3_users":
    disposition: not_applicable
    note: >
      Source-side gap, and the most explicitly declared of the five:
      cisco_iosxr declares `/snmp/v3-user/auth-protocol`, `/priv-protocol`,
      `/priv-passphrase` and `/group` all unsupported.  No v3 user reaches
      the target on any cell.  Re-creating SNMPv3 users on the Nexus is
      unavoidable regardless — cisco_nxos declares the auth and privacy
      passphrases lossy because NX-OS normalises them to the older
      `localizedkey` digest form, so v3 credentials cannot be migrated
      between platforms even when a source does emit them.  No key material
      is reproduced here.
    references: [iosxr-nxos-surface]

  # -- LAGs -----------------------------------------------------------------

  lags:
    disposition: lossy
    reason: >
      Drifts on all 4 cells that carry bundles.  Verified by round-tripping
      the fixtures rather than inferred from the drift shape.  Two distinct
      effects, one mechanism shared with `interfaces[].lag_member_of` — this
      entry states the cause; that one cross-references it rather than
      counting it twice.
      (1) NAME FORM.  The render emits the aggregate as `interface
      Bundle-Ether<N>` (the IOS-XR name, verbatim) and each member as
      `channel-group <N> mode active|on`.  The re-parse rebuilds the LAG from
      the channel-group number and names it `port-channel<N>`.  8 of the 10
      bundle records in the corpus take this path: bundle ID, member set and
      LACP mode all survive byte-identical; only the name token changes.
      (2) MEMBERLESS BUNDLES VANISH.  On `iosxr_design_cst_pa3_xr752.cfg` the
      source carries 5 bundles, 2 of which (`Bundle-Ether2123`,
      `Bundle-Ether2124`) have no members.  With no member port there is no
      `channel-group 2123` line anywhere in the render, so the re-parse has
      nothing to rebuild from and the LAG record is lost: 5 -> 3.  Their
      INTERFACE records survive — `interface Bundle-Ether2123` renders and
      re-parses fine — so only the `CanonicalLAG` is gone.
      Recorded `lossy` rather than `unsupported` deliberately.  #436's "a
      vanished record is not lossy" governs a TOTAL concept drop, and this is
      not one: on 3 of the 4 populated cells every bundle survives with its
      members intact, and even on the fourth 3 of 5 survive.  `unsupported`
      blocks, and blocking a migration whose LAG membership is entirely
      correct would be a false alarm; `lossy` warns and stays compatible,
      which is the honest severity.  Both matrices declare `/lags/lag/name`,
      `/lags/lag/members` and `/lags/lag/mode` supported, and they are right
      about members and mode.
      Before cutover: re-create any bundle that has no members yet, and
      expect the bundle names on the target to read `port-channel<N>`.
    references: [iosxr-nxos-surface]

  # -- Identity -------------------------------------------------------------
  #
  # `local_users` drifts on 9 of 12 cells and that number is easy to misread.
  # Measured record by record, all three keys below are clean; the whole of
  # the parent's drift is `privilege_level` (15 -> 1), which is NOT a key in
  # this pair's expectation set and is therefore claimed by nothing here.

  "local_users[].name":
    disposition: good
    note: >
      Usernames preserved on every one of the 9 user records across the 5
      cells that populate local users; the other 7 cells define none.  Both
      matrices declare `/local-users/user/name` supported.
    references: [iosxr-nxos-surface]

  "local_users[].role":
    disposition: good
    note: >
      Role preserved verbatim on every populated record (`root-lr` ->
      `root-lr`, `operator` -> `operator`); both matrices declare
      `/local-users/user/role` supported.  Two honest caveats that this
      `good` does NOT cover.  First, the render passes the IOS-XR role token
      through unchanged, and `root-lr` is an IOS-XR role name, not an NX-OS
      one (`network-admin` / `network-operator` / a custom role) — canonical
      fidelity is exact, but the emitted config needs a role-name rewrite
      before it is idiomatic NX-OS.  Second, the companion
      `privilege_level` degrades 15 -> 1 because cisco_nxos maps
      network-admin / vdc-admin -> 15 and everything else -> 1; that path is
      declared lossy on the NX-OS side and is not one of this pair's keys, so
      nothing here claims it.  It is the sole reason the parent
      `local_users` list measures as drifted.
    references: [iosxr-nxos-surface]

  "local_users[].hashed_password":
    disposition: good
    note: >
      The password digest is preserved BYTE-IDENTICAL on every one of the 9
      populated user records — verified by direct comparison of the source
      and re-parsed canonical trees, not assumed.  Both matrices declare
      `/local-users/user/hashed-password` supported and the NX-OS render
      carries the digest straight onto a `username ... password <type> ...`
      line.
      What that does NOT establish: round-trip fidelity through the canonical
      tree says nothing about whether the target platform will ACCEPT that
      digest form at login.  Verify authentication on the Nexus before
      cutover rather than trusting this `good` to mean the accounts work.
      No credential value — plaintext, digest or vendor blob — is reproduced
      in this file or in the reference note; only its shape is described.
    references: [iosxr-nxos-surface]

  radius_servers:
    disposition: unsupported
    reason: >
      Both matrices declare `/radius-servers/server/host` AND
      `/radius-servers/server/key` unsupported, with the same reason on each
      side — "Render emits no AAA radius-server config" — so this is a
      symmetric gap in the pair rather than an NX-OS limitation.  No cell
      populates it.  RADIUS hosts and their shared secrets must both be
      re-authored on the target; nothing in the migration carries them, and
      the secret in particular cannot be recovered from the migrated config.
    references: [iosxr-nxos-surface]

  # -- Fabric ---------------------------------------------------------------

  "vxlan_vnis[].vni":
    disposition: not_applicable
    note: >
      Source-side gap: cisco_iosxr declares `/vxlan-vnis/vni` unsupported —
      "IOS-XR VXLAN (NCS 5500 / 540 `nve` interfaces) is rare in the SP
      corpus; no canonical demand surfaced.  Parse-and-ignore in v1" — and no
      committed cell populates VXLAN.  cisco_nxos is a VXLAN-native target
      (it declares `/vxlan-vnis/*` supported, with `/vxlan-vnis/vni` lossy
      only for per-VNI sub-flags), so an overlay built on the Nexus after
      cutover will hold.  The gap is on the source side.
    references: [iosxr-nxos-surface]

  "vxlan_vnis[].vlan_id":
    disposition: not_applicable
    note: >
      Source-side gap under the same declaration as `vxlan_vnis[].vni` —
      IOS-XR VXLAN is parse-and-ignore in v1, so no VNI-to-VLAN binding ever
      reaches the target.  Not populated on any cell.
    references: [iosxr-nxos-surface]

  "vxlan_vnis[].mcast_group":
    disposition: not_applicable
    note: >
      Source-side gap, same scope as the other two VXLAN sub-fields: the
      source emits no VNI at all, so there is no record to hang a
      replication group on.  cisco_nxos declares `/vxlan-vnis/mcast-group`
      supported, so multicast replication is re-authorable on the target.
    references: [iosxr-nxos-surface]

  evpn_type5_routes:
    disposition: not_applicable
    note: >
      Source-side gap: cisco_iosxr declares `/evpn-type5-routes/route`
      unsupported because IOS-XR EVPN runs under top-level `l2vpn` + `evpn` +
      `bridge group` stanzas, grammatically distant from the canonical
      shape.  Not populated on any cell.  cisco_nxos declares the path lossy
      rather than unsupported — it models type-5 as a VRF property via
      `CanonicalRoutingInstance.l3_vni` — which would matter only for a
      source that actually emits type-5 routes.
    references: [iosxr-nxos-surface]

  # -- VRFs -----------------------------------------------------------------

  "routing_instances[].name":
    disposition: good
    note: >
      VRF names preserved on all 8 cells that populate them (AZURE, red,
      blue, management, 100, CUSTOMER, CUSTOMER-A, MGMT); cisco_nxos declares
      `/routing-instances/instance/name` supported and renders `vrf context
      <name>`.
      Read this `good` narrowly: it means the VRF NAMES arrive, not that the
      L3VPN does.  cisco_iosxr declares `/routing-instances/instance` itself
      LOSSY, and cisco_nxos declares `/route-distinguisher`, `/rt-imports`
      and `/instance-type` lossy.  None of those paths is a key in this
      pair's expectation set, so nothing here claims them — but on a PE
      migration they are the substance: IOS-XR derives the VRF RD from
      `router bgp`, and `router bgp` is itself declared unsupported as Tier-3
      on the source side.  Re-author RD, route-targets and the BGP
      address-families on the Nexus by hand.
    references: [iosxr-nxos-surface]

  "routing_instances[].description":
    disposition: good
    note: >
      cisco_nxos declares `/routing-instances/instance/description`
      supported, and the one cell that sets VRF descriptions
      (`kitchen_sink.cfg`, two VRFs) round-trips both strings intact.  The
      other 11 cells set none, so this `good` rests on a single populated
      cell — thin, and said so rather than implied.
    references: [iosxr-nxos-surface]

  # -- Passthrough / vendor-specific ----------------------------------------

  raw_sections:
    disposition: not_applicable
    note: >
      Not populated on any cell of this pair, and cisco_iosxr declares
      nothing under raw sections at all.  cisco_nxos declares two lossy raw
      paths (`/system/raw-sections/vdc`, `/system/raw-sections/features`),
      but both are NX-OS-native grammar reachable only from an NX-OS source —
      unreachable from IOS-XR, so they do not bear on this direction.
    references: [iosxr-nxos-surface]

  apply_groups:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair populates it."
    references: [iosxr-nxos-surface]

  group_content:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair populates it."
    references: [iosxr-nxos-surface]

  anycast_gateway_mac:
    disposition: not_applicable
    note: >
      Source-side gap: cisco_iosxr declares `/anycast-gateway-mac`
      unsupported — "IOS-XR has no VARP / distributed-anycast-gateway
      grammar" — so the chassis-wide MAC is never populated (verified empty
      on all 12 cells).  cisco_nxos declares the path SUPPORTED and renders
      `fabric forwarding anycast-gateway-mac`, so a distributed anycast
      gateway is fully authorable on the target — it just cannot be carried
      over from an IOS-XR source, which had none to give.
    references: [iosxr-nxos-surface]
