# Cross-vendor fidelity expectations: fortigate_cli -> dell_os10
#
# Source: fortigate_cli codec.  Target: dell_os10 codec.
#
# Every disposition below is resolved through the audit's own
# `actual_disposition()` over a measured `tools/run_full_mesh.py`
# pass, NOT read off the two capability matrices.  That ordering
# is forced by the per-pair unevidenced ratchet
# (`test_no_new_pair_declares_a_loss_it_never_observes`), which
# allows a NEW pair exactly zero declared-but-never-observed
# losses: a field this corpus preserves on every cell MUST be
# `good`, so hedging to `lossy` when unsure fails the build just
# as surely as missing a real loss does.  The matrices supply
# only the MECHANISM prose for a loss the corpus exhibits.
#
# Measured: 4 fixture cells, 0 render errors, 0 re-parse errors.
# Dispositions: {'unsupported': 13, 'good': 18, 'lossy': 13, 'not_applicable': 2}
#
# Schema spec: tests/fixtures/cross_vendor_expectations/README.md
# Vendor reference cache: docs/vendor-references/fortigate_cli_to_dell_os10/
#
# Authored 2026-09-21 with the dell_os10 registration (Phase 4).

meta:
  source_vendor: fortigate_cli
  target_vendor: dell_os10
  primary_use_case: >
    Replacing a FortiGate device with a Dell EMC PowerSwitch running
    SmartFabric OS10. OS10 is port-centric (no top-level `vlan <id>`
    stanza -- VLANs are derived from `interface vlan<N>` SVIs), runs
    real VRRP rather than a vendor FHRP, has no VARP/anycast-gateway
    concept, and defers VXLAN/EVPN behind a `virtual-network`
    indirection. This file records what a FortiGate config keeps and
    loses when rendered onto OS10.
  certainty: medium
  references:
    - id: fortigate-os10-surface
      path: docs/vendor-references/fortigate_cli_to_dell_os10/canonical_surface.md
      title: "FortiGate -> Dell OS10: measured canonical surface (4 fixture cells)"
      source_url: "https://github.com/netcanon/netcanon"
      retrieved: "2026-09-21"

# -------------------------------------------------------------------------

per_field_expectation:

