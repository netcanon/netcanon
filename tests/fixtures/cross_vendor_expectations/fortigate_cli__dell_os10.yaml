      CORPUS — all 4 cells are empty on both sides, so this
      disposition rests on the target codec's own capability
      declaration rather than on an observed round-trip. OS10
      expresses first-hop redundancy as real VRRP, not a chassis-wide
      anycast-gateway MAC; nothing renders it. Measured over 4 cells:
      drifted on 0, preserved on 0, both sides empty on 4.
    references: [fortigate-os10-surface]

