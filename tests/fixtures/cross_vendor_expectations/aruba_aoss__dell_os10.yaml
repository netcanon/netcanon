    disposition: good
    note: >
      Preserved on 2 of 7 cells. On the other 5 the whole
      `interfaces` list drifted at once (records added or dropped),
      and the reconciler attributes that single structural event to
      one owner sub-field rather than counting it against every
      sibling. So this field shows no loss of its own on this pair:
