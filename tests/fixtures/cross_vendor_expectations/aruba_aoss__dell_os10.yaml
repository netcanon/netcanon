  interfaces[].interface_type:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round
      trip. This path translates no port name, so an AOS-S port keeps
      its AOS-S name (`1`, `1/25`, `A3`, `Trk1`), which is no OS10
      interface name; the OS10 parser types an interface from its
      name and gives one it does not know `ianaift:other`. Every port
      and trunk record is typed so -- 289 of the 312 records, the
      other 23 being SVIs, whose `vlan<N>` names it does know.
      Measured over 7 cells: drifted on 7, preserved on 0. On 5 of
      the 7 the whole `interfaces` list also drifts at once (the
      render writes an `interface vlan<N>` for a VLAN that has a name
      and no address, where the source has no SVI record), which the
      reconciler records against one owner sub-field; on
      `hpe_community_2930f_wc1610_dhcp_server.cfg` and
      `aruba_central_5memberstack_rendered.cfg` the list keeps its
      length and this field's own drift shows, on 10 of 10 and 49 of
      49 port records. Until the AOS-S parser gave a port named only in a
      VLAN's list a record, that capture's tree held its four SVIs
      and no port, and the field read as preserved. Through the
      port-name translation the ports become `ethernet1/1/<n>` and
      keep their type (52 of 312 records do not: the letter-slot
      ports of the kitchen sink and of the KB.15.15 capture, which the
      translator leaves under their source names).
    references: [aoss-os10-surface]

