# Cross-vendor fidelity expectations: aruba_aoss -> dell_os10
#
# Source: aruba_aoss codec.  Target: dell_os10 codec.
#
# Every disposition below is resolved through the audit's own
# `actual_disposition()` over a measured `tools/run_full_mesh.py`
# pass, NOT read off the two capability matrices.  That ordering
# is forced by the per-pair unevidenced ratchet
# (`test_no_new_pair_declares_a_loss_it_never_observes`), which
# allows a NEW pair exactly zero declared-but-never-observed
# losses: a field this corpus preserves on every cell MUST be
# `good`, so hedging to `lossy` when unsure fails the build just
# as surely as missing a real loss does.  The matrices supply
# only the MECHANISM prose for a loss the corpus exhibits.
#
# Measured: 7 fixture cells, 0 render errors, 0 re-parse errors.
# Dispositions: {'unsupported': 13, 'good': 18, 'lossy': 15}
#
# Schema spec: tests/fixtures/cross_vendor_expectations/README.md
# Vendor reference cache: docs/vendor-references/aruba_aoss_to_dell_os10/
#
# Authored 2026-09-21 with the dell_os10 registration (Phase 4).

meta:
  source_vendor: aruba_aoss
  target_vendor: dell_os10
  primary_use_case: >
    Replacing a AOS-S device with a Dell EMC PowerSwitch running
    SmartFabric OS10. OS10 is port-centric (no top-level `vlan <id>`
    stanza -- VLANs are derived from `interface vlan<N>` SVIs), runs
    real VRRP rather than a vendor FHRP, has no VARP/anycast-gateway
    concept, and defers VXLAN/EVPN behind a `virtual-network`
    indirection. This file records what a AOS-S config keeps and loses
    when rendered onto OS10.
  certainty: medium
  references:
    - id: aoss-os10-surface
      path: docs/vendor-references/aruba_aoss_to_dell_os10/canonical_surface.md
      title: "AOS-S -> Dell OS10: measured canonical surface (7 fixture cells)"
      source_url: "https://github.com/netcanon/netcanon"
      retrieved: "2026-09-21"

# -------------------------------------------------------------------------

per_field_expectation:

  anycast_gateway_mac:
    disposition: unsupported
    reason: >
      Dell OS10 renders no instance of this surface, so the record
      cannot exist on the target side at all. NOT EXERCISED BY THIS
      CORPUS — all 7 cells are empty on both sides, so this
      disposition rests on the target codec's own capability
      declaration rather than on an observed round-trip. OS10
      expresses first-hop redundancy as real VRRP, not a chassis-wide
      anycast-gateway MAC; nothing renders it. Measured over 7 cells:
      drifted on 0, preserved on 0, both sides empty on 7.
    references: [aoss-os10-surface]

