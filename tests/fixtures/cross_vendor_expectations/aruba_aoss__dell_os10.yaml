      per interface, so it travels on the port's interface record;
      the AOS-S parser makes that record for every port a VLAN's list
      names, whether or not the config has an `interface` stanza for
      it. Until it did, a port with no stanza had no record and this
      list came back short on 4 cells.
    references: [aoss-os10-surface]

