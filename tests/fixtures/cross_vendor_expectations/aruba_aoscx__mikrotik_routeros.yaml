# Cross-vendor fidelity expectations: aruba_aoscx -> mikrotik_routeros
#
# Source: aruba_aoscx codec — ArubaOS-CX `show running-config` text.
# Target: mikrotik_routeros codec — RouterOS `/export`-style command render.
#
# Asymmetric by device class. AOS-CX in the committed corpus is a campus /
# small-DC access-aggregation switch with a hardware L2 forwarding plane;
# RouterOS is a router-first OS whose L2 lives in a software bridge with VLAN
# filtering.  The realistic migration is a small site whose AOS-CX aggregation
# switch is replaced by a RouterOS box: routed uplinks, SVI addressing, LAGs,
# static routes, SNMP and local accounts move; the VLAN-centric switching
# model does not.
#
# The dominant finding on this pair is the MIRROR IMAGE of aruba_aoscx ->
# arista_eos.  There the interface list shrank; here it GROWS.  Measured over
# the 7 committed cells: 0 of 157 source interface records is dropped, and 37
# records are ADDED (one `bridge1`, plus one synthetic `vlanN` L3 interface
# per VLAN).  So every `interfaces[].*` key still measures as drifted on all 7
# cells and every one below still records a loss — but the cause is insertion,
# not deletion, and four of those keys additionally lose real per-attribute
# data.  Each entry states which of the two applies to it, because reading the
# record-count drift as corroboration for an attribute loss (or the reverse)
# is the mistake this pair is built to invite.
#
# The second structural finding is the VLAN model.  RouterOS declares
# `/vlans/vlan/tagged-ports` and `/vlans/vlan/untagged-ports` unsupported and
# the measurement agrees exactly: 13 of 13 populated untagged lists and 11 of
# 11 populated tagged lists arrive empty.  Port membership is not degraded on
# this pair, it is gone.
#
# Dispositions are grounded in the codecs' `CapabilityMatrix` declarations and
# a full `run_full_mesh.py` pass over the committed corpus (7 fixture cells,
# 0 render errors, 0 re-parse errors), resolved through the audit's own
# `actual_disposition()` so this file and the ratchet cannot disagree.  Every
# ambiguous lossy-vs-unsupported call below was settled by parsing the fixture
# with aruba_aoscx and rendering it with mikrotik_routeros, not by reading
# grammar.
#
# Schema spec: tests/fixtures/cross_vendor_expectations/README.md
# Vendor reference cache: docs/vendor-references/aruba_aoscx_to_mikrotik_routeros/
#
# Authored 2026-08-25 as part of the aruba_aoscx expectation mesh (A6 wave 2),
# alongside the aruba_aoscx -> arista_eos pair.

meta:
  source_vendor: aruba_aoscx
  target_vendor: mikrotik_routeros
  primary_use_case: >
    Small-site aggregation replacement: an ArubaOS-CX switch swapped for a
    MikroTik RouterOS router-switch carrying the same uplinks, SVI addressing,
    bonds and static routes.  Hostname, VLAN IDs, LAG name/members/mode,
    per-port MTU, port-to-LAG membership, static routes, SNMP scalars and
    local usernames all survive.  What does not is VLAN port membership, the
    anycast virtual-gateway addressing, VRFs, VXLAN, the AOS-CX role strings
    and the user-password form — plus a synthetic-interface inflation that
    leaves each SVI mounted twice under two different names.
  certainty: medium
  references:
    - id: aoscx-routeros-surface
      path: docs/vendor-references/aruba_aoscx_to_mikrotik_routeros/canonical_surface.md
      title: "AOS-CX -> MikroTik RouterOS: measured canonical surface (7 fixture cells)"
      source_url: "https://github.com/netcanon/netcanon"
      retrieved: "2026-08-25"

# ---------------------------------------------------------------------------

per_field_expectation:

  # -- Tier 1 -- system scalars ---------------------------------------------
  #
  # None of these is populated on any of the 7 source cells, so nothing was
  # observed to be lost.  The split below is by MATRIX, and the distinction is
  # operational: `not_applicable` means the SOURCE cannot emit it (re-authoring
  # on the target will stick), `unsupported` means BOTH sides declare the gap
  # (re-authoring on the target is outside what this migration models at all).

  hostname:
    disposition: good
    note: >
      `hostname <name>` on AOS-CX, `/system identity set name=` on RouterOS;
      preserved verbatim on 7 of 7 cells.
    references: [aoscx-routeros-surface]

  domain:
    disposition: unsupported
    reason: >
      Symmetric gap: aruba_aoscx declares `/system/domain` unsupported and
      mikrotik_routeros declares it unsupported too, with the explicit reason
      that its render emits no system domain-name.  Neither codec parses nor
      renders the stanza, and no source cell populates it.  Set the domain by
      hand on the target; nothing in the migration will carry it.
    references: [aoscx-routeros-surface]

  dns_servers:
    disposition: not_applicable
    note: >
      Source-side gap, not a RouterOS limitation: aruba_aoscx declares
      `/system/dns-server` unsupported so nothing reaches the target, while
      mikrotik_routeros declares the field SUPPORTED.  Re-author name-servers
      on the RouterOS side and they will stick — worth doing by hand as part
      of the cutover.
    references: [aoscx-routeros-surface]

  ntp_servers:
    disposition: not_applicable
    note: >
      Source-side gap, same shape as `dns_servers`: aruba_aoscx declares
      `/system/ntp-server` unsupported while mikrotik_routeros supports it.
      Re-author the NTP client on the target.
    references: [aoscx-routeros-surface]

  timezone:
    disposition: unsupported
    reason: >
      Both matrices declare `/system/timezone` unsupported — the RouterOS side
      states plainly that its render emits no clock/timezone stanza.  A
      symmetric gap in the pair rather than a target limitation; set the clock
      on the target by hand.
    references: [aoscx-routeros-surface]

  syslog_servers:
    disposition: unsupported
    reason: >
      Both matrices declare `/system/syslog-server` unsupported; the RouterOS
      declaration states its render emits no logging config, so
      `intent.syslog_servers` is dropped on migration.  Unlike `dns_servers`,
      re-authoring is not just a source gap here — the target codec will not
      round-trip logging hosts either.  Configure `/system logging action` on
      the target manually and do not expect the audit to cover it.
    references: [aoscx-routeros-surface]

  # -- Interfaces -- inflation, plus four real attribute losses -------------

  "interfaces[].name":
    disposition: lossy
    reason: >
      Measured across all 7 cells: ZERO of the 157 source interface records is
      dropped — every AOS-CX port, LAG, loopback, SVI and `mgmt` survives by
      name — while 37 records are ADDED.  Per-cell the inventory goes 9->12,
      9->12, 18->23, 42->47, 22->31, 44->51 and 13->18.  The additions are one
      `bridge1` per config plus one synthetic `vlanN` L3 interface per VLAN.
      The operator consequence is worse than the count suggests: each AOS-CX
      SVI now exists TWICE in the render, once as the carried-over `vlan N`
      (with a space) and once as the synthetic `vlanN`, and the address is
      bound to the former — a name the render never creates.  20 of the 43
      address-block `interface=` references across the corpus point at an
      interface that does not exist in the same file.  Reconcile the SVI
      naming by hand before applying a rendered config; it will not apply
      clean as-is.
    references: [aoscx-routeros-surface]

  "interfaces[].description":
    disposition: lossy
    reason: >
      A real attribute loss on top of the record inflation, measured
      independently: 66 source interfaces carry a description and 10 lose it
      entirely.  All 10 are SVI records — physical-port descriptions survive
      as RouterOS `comment=` on the `/interface ethernet` line.  Capture SVI
      descriptions before cutover; they are the labels that tie a VLAN to a
      site or tenant and they do not come back.
    references: [aoscx-routeros-surface]

  "interfaces[].enabled":
    disposition: lossy
    reason: >
      A real attribute loss, and the one on this pair with a safety edge.  16
      of 157 interface records change admin state and every one of the 16
      flips the SAME direction — `enabled: false` on the AOS-CX SVI becomes
      `enabled: true` after the RouterOS round-trip.  An SVI that was
      deliberately shut on the source comes up live on the target.  Re-apply
      `disabled=yes` on every SVI you intended to keep down BEFORE the box
      carries traffic; do not discover this from a routing table.
    references: [aoscx-routeros-surface]

  "interfaces[].mtu":
    disposition: lossy
    reason: >
      No independent loss was observed: 50 source interfaces carry an explicit
      MTU and all 50 round-trip byte-identical (the 9198 jumbo uplinks on the
      arch4 cells included).  This key is lossy ONLY because the parent record
      list drifts on all 7 cells — see `interfaces[].name`.  Stated that way
      rather than dressed up: MTU itself is safe on this pair.
    references: [aoscx-routeros-surface]

  "interfaces[].ipv4_addresses":
    disposition: lossy
    reason: >
      Two distinct causes, measured separately.  (1) The address and prefix
      themselves never drift: all 41 interface-mounted IPv4 addresses survive
      intact.  (2) The anycast companion does not: 15 of those 41 carry a
      `virtual_gateway_address` and all 15 lose it, which matches the RouterOS
      declaration of `/interfaces/interface/ipv4/address/virtual-gateway-address`
      as unsupported ("parses-and-ignores in v1").  A routed port keeps its
      address and loses its shared first-hop gateway, so re-author the target's
      VRRP or gateway addressing explicitly — this is the field most likely to
      break first-hop reachability at cutover.
    references: [aoscx-routeros-surface]

  "interfaces[].ipv6_addresses":
    disposition: lossy
    reason: >
      No independent loss was observed.  Only 2 interfaces in the whole corpus
      carry IPv6 (one SVI on the CANU spine cell, one on the kitchen-sink) and
      both round-trip with address and prefix-length identical.  This key is
      lossy solely because the parent record list drifts — see
      `interfaces[].name`.  The corpus is too thin to say more, and that is
      stated rather than implied: two records is not coverage.  Note the
      RouterOS matrix separately declares `/interfaces/interface/dhcp-client-v6`
      lossy, which no committed cell exercises.
    references: [aoscx-routeros-surface]

  "interfaces[].interface_type":
    disposition: lossy
    reason: >
      The largest real per-attribute loss on this pair, and independent of the
      record inflation.  All 157 source records carry an IANA ifType; 113 come
      back EMPTY and 10 come back WRONG, leaving 34 intact.  The mechanism is
      declared by the target itself — RouterOS does not expose IANA ifType, so
      the codec re-infers it from the interface-name prefix (`etherN`,
      `vlanN`).  AOS-CX names (`1/1/1`, `mgmt`, `lag 1`) match no prefix and
      blank out; all 10 wrong ones are `loopback N`, which the render emits as
      `/interface bridge` and which therefore re-infers as `ianaift:bridge`
      instead of `ianaift:softwareLoopback`.  If anything downstream keys off
      interface type — inventory, monitoring templates, IPAM import — re-derive
      it from the name on the target rather than trusting the migrated value.
    references: [aoscx-routeros-surface]

  "interfaces[].lag_member_of":
    disposition: lossy
    reason: >
      No independent loss was observed.  44 source interfaces carry a
      `lag_member_of` and all 44 round-trip identical; the audit also
      canonicalises LAG names before comparing, so a pure rename could not have
      shown up either way.  This key is lossy only because the parent record
      list drifts — see `interfaces[].name`.  Do NOT read this as membership
      loss; the corroborating proof runs the other way, in `lags`, which is
      `good` on all 7 cells with every bond's members and mode intact.
    references: [aoscx-routeros-surface]

  "interfaces[].vrrp_groups":
    disposition: unsupported
    reason: >
      aruba_aoscx declares the whole `/interfaces/interface/vrrp-groups/group/*`
      subtree unsupported — mode, priority, preempt, advertisement-interval,
      authentication, virtual-ipv6s and description — because AOS-CX expresses
      first-hop redundancy as VSX active-gateway rather than VRRP.  Confirmed
      by measurement: parsing all 7 fixtures yields ZERO VRRP groups, so
      nothing is ever handed to the RouterOS renderer.  Recorded `unsupported`
      rather than `not_applicable` because the audit resolves every
      `interfaces[].*` key through the parent record, which is non-trivially
      drifted on all 7 cells.  Operationally: re-author `/interface vrrp` on
      the target from the source config by hand.  Note the RouterOS side does
      model VRRP and declares only `.../group/mode` and `.../group/description`
      lossy, so a source that DID emit groups would fare better than this —
      the block is on the AOS-CX side.
    references: [aoscx-routeros-surface]

  # -- VLANs -- IDs survive, the switching model does not --------------------

  "vlans[].id":
    disposition: good
    note: >
      VLAN IDs preserved on 7 of 7 cells — 30 VLAN records, none dropped, none
      renumbered.  The one part of the L2 model that crosses this pair whole.
    references: [aoscx-routeros-surface]

  "vlans[].name":
    disposition: lossy
    reason: >
      All 30 VLAN records are renamed.  The target declares why:
      `/vlans/vlan/name` is lossy because RouterOS stores a VLAN's name as its
      L3 interface name, so every source name is replaced by the synthesised
      `vlan<id>` form (`PROD-WEB` -> `vlan101`, `HMN` -> `vlan400`).  The
      record survives and the ID is intact, which is why this is `lossy` and
      not `unsupported` — but no operator-chosen VLAN name survives the trip.
      Export the source VLAN name table before cutover if it feeds anything.
    references: [aoscx-routeros-surface]

  "vlans[].description":
    disposition: lossy
    reason: >
      Worse than a drop, and the reason this key is called out separately from
      `vlans[].name`: the description is not emptied, it is OVERWRITTEN.
      RouterOS exposes a single per-VLAN `comment` field, so the render puts
      the source NAME there and the re-parse reads it back as the DESCRIPTION.
      Measured: 23 of 30 records come back with a description equal to the
      source's name, and on 6 of them that clobbers a real source description
      (one cell turns name `VLAN 11` / description `Server VLAN` into
      description `VLAN 11`, losing `Server VLAN` outright).  A migrated
      config therefore looks annotated while carrying the wrong annotation —
      do not trust post-cutover VLAN descriptions, re-import them.
    references: [aoscx-routeros-surface]

  "vlans[].ipv4_addresses":
    disposition: lossy
    reason: >
      Recorded `lossy` rather than `unsupported` on a round-trip probe, not on
      the drift shape — the VLAN-record mount empties on all 18 populated
      records, which looks like a total drop until you follow the address.
      All 18 are re-homed INTACT onto the sibling `vlan N` interface record,
      so the prefix leaves the config nowhere; it changes mount point, exactly
      as the target's own `/vlans/vlan/ipv4/address/ip` lossy declaration
      describes.  What IS lost is the anycast companion: 15 of the 18 carry a
      `virtual_gateway_address` and none survives.  Two caveats for the
      cutover: the surviving mount is the one whose interface name the render
      never creates (see `interfaces[].name`), and the shared gateway address
      must be re-authored on the target.
    references: [aoscx-routeros-surface]

  "vlans[].untagged_ports":
    disposition: unsupported
    reason: >
      A total drop, not a degradation, and the target says so twice.
      mikrotik_routeros declares `/vlans/vlan/untagged-ports` unsupported
      (RouterOS binds a VLAN interface to a single parent, so multi-port
      membership is dropped on render) AND declares the per-port twin
      `/interfaces/interface/access-vlan` unsupported as well, so the
      membership has no surviving mount on either side of the model.  The
      measurement matches exactly: 13 of 13 populated untagged lists come back
      empty — including a 29-entry list on the arch4 core cell.  Recorded
      `unsupported` rather than `lossy` because a vanished record is not lossy
      (#436): `lossy` warns and stays compatible, which would badly understate
      losing every access-port assignment on the switch.  Rebuild the RouterOS
      bridge VLAN table by hand.
    references: [aoscx-routeros-surface]

  "vlans[].tagged_ports":
    disposition: unsupported
    reason: >
      Same mechanism and same verdict as `vlans[].untagged_ports`: the target
      declares `/vlans/vlan/tagged-ports` unsupported alongside the per-port
      twins `/interfaces/interface/trunk-allowed-vlans` and
      `/interfaces/interface/trunk-native-vlan`, and 11 of 11 populated tagged
      lists come back empty.  Every trunk in the source arrives on the target
      carrying nothing.  Rebuild trunk membership by hand; this is the single
      largest re-authoring task in an AOS-CX -> RouterOS cutover.
    references: [aoscx-routeros-surface]

  # -- Routing --------------------------------------------------------------

  static_routes:
    disposition: good
    note: >
      Preserved on both cells that populate it — 3 routes total, with
      destination, gateway AND metric identical after the round-trip (the
      metric-200 backup route on the kitchen-sink cell included).  Both
      matrices declare `/routing/static-route` supported.  One caveat that
      does not affect this corpus: both sides declare `/routing/static-route/vrf`
      unsupported, so a per-VRF static route would lose its VRF binding —
      no committed cell exercises one.
    references: [aoscx-routeros-surface]

  "routing_instances[].name":
    disposition: unsupported
    reason: >
      A total drop, verified by round-trip on all 3 cells that populate VRFs:
      6 routing instances go in (`CSM`/`keepalive`, `test`/`keepalive`,
      `RED`/`BLUE`) and 0 come out.  mikrotik_routeros declares
      `/routing-instances/instance` unsupported outright — its render emits no
      VRF construct at all — and the interface-level `vrf` attribute goes with
      it (interfaces that were in `CSM` or `test` come back with an empty
      VRF).  Recorded `unsupported` rather than `lossy` per #436: nothing about
      this stays compatible.  If the source separates management or keepalive
      traffic into a VRF, that separation does not exist on the target after
      migration — design the replacement before you cut over, not after.
    references: [aoscx-routeros-surface]

  "routing_instances[].description":
    disposition: unsupported
    reason: >
      Doubly blocked, and neither side is the weak link alone.  aruba_aoscx
      declares `/routing-instances/instance/description` unsupported so as a
      source it never emits one (confirmed: all 6 parsed instances carry an
      empty description), and mikrotik_routeros drops the entire parent
      instance anyway.  Recorded `unsupported` rather than `not_applicable`
      because the parent record is really dropped on 3 of 7 cells, so this key
      does not resolve as an untouched source-side gap.
    references: [aoscx-routeros-surface]

  # -- Services -------------------------------------------------------------

  dhcp_servers:
    disposition: not_applicable
    note: >
      Source-side gap: aruba_aoscx declares `/dhcp-servers/pool` unsupported
      and no committed cell populates a pool — an AOS-CX aggregation switch
      relays DHCP rather than serving it.  The target does model DHCP scopes
      (it declares only `/dhcp-servers/pool/lease-time` lossy), so re-authoring
      `/ip dhcp-server` on RouterOS is worthwhile and will largely stick;
      expect a non-default lease time not to round-trip.
    references: [aoscx-routeros-surface]

  "snmp.community":
    disposition: good
    note: "Preserved on all 4 cells that populate SNMP."
    references: [aoscx-routeros-surface]

  "snmp.location":
    disposition: good
    note: >
      Preserved verbatim on all 4 cells that populate SNMP, punctuation and
      spacing included.
    references: [aoscx-routeros-surface]

  "snmp.contact":
    disposition: good
    note: "Preserved verbatim on all 4 cells that populate SNMP."
    references: [aoscx-routeros-surface]

  "snmp.trap_hosts":
    disposition: good
    note: >
      No trap-host drift on any of the 4 cells that populate SNMP.  Stated
      precisely, because the field deserves it: no committed AOS-CX cell
      actually carries a trap host, and aruba_aoscx declares `/snmp/trap-host`
      unsupported as a source.  So this `good` records the ABSENCE of drift in
      a populated SNMP block, not an observed trap-host migration.  Re-author
      `/snmp trap-target` on the target and verify it independently.
    references: [aoscx-routeros-surface]

  "snmp.v3_users":
    disposition: lossy
    reason: >
      Drifts on 1 of the 4 cells that populate SNMP, and the round-trip shows
      exactly what changed: the USM user survives with its name and both
      passphrases, but the privacy algorithm is rewritten (`aes` comes back as
      `aes128`).  That matches the target's own `/snmp/v3-user/priv-protocol`
      lossy declaration, which warns that RouterOS supports only DES/AES and
      substitutes — including `3des` -> `DES`, a strength DOWNGRADE — and its
      matching `/snmp/v3-user/auth-protocol` declaration, which substitutes
      sha224/sha384 and maps anything unknown to SHA1.  RouterOS also carries
      no VACM group binding and emits no per-user engineID, both declared
      lossy.  Re-key SNMPv3 on the target and re-point the manager: an
      algorithm substitution that silently downgrades crypto is worse than a
      user that simply fails to appear.
    references: [aoscx-routeros-surface]

  radius_servers:
    disposition: not_applicable
    note: >
      Source-side gap: aruba_aoscx declares both `/radius-servers/server/host`
      and `/radius-servers/server/key` unsupported, and no committed cell
      populates the field, so nothing reaches the target.  Re-author RADIUS on
      the RouterOS side; the target codec declares nothing here either way, so
      treat it as out of scope for the audit rather than known-good.
    references: [aoscx-routeros-surface]

  # -- LAGs -- the clean win on this pair ------------------------------------

  lags:
    disposition: good
    note: >
      The best-preserved non-trivial field on this pair: preserved on 7 of 7
      cells, with every bond's name, member list AND mode identical after the
      round-trip — 16 bonds on the densest cell, `lag 256` VSX-ISL pairs
      included.  Verified by round-trip rather than taken from the drift shape,
      because a bare `lags` result is the pair's known naming artifact: the
      audit canonicalises LAG names before comparing, and renderers key off
      `CanonicalInterface.lag_member_of` rather than `CanonicalLAG.members`.
      Both were checked here — all 44 `lag_member_of` values also round-trip
      identical.  One caveat that this corpus cannot exercise: both matrices
      declare `/lags/lag/mode` lossy, the target because RouterOS
      `mode=802.3ad` has no passive variant, so a `passive` bundle would come
      back `active`.  Every bond in the corpus is already active.
    references: [aoscx-routeros-surface]

  # -- Identity -------------------------------------------------------------

  "local_users[].name":
    disposition: good
    note: >
      Usernames preserved on all 6 cells that populate local users — 7 account
      records, none dropped, none renamed.  The account arrives; see the two
      keys below for what it arrives WITHOUT.
    references: [aoscx-routeros-surface]

  "local_users[].role":
    disposition: lossy
    reason: >
      Drifts on all 7 account records.  The AOS-CX role string is routed
      through RouterOS group names on render and read back under RouterOS's
      vocabulary, so `administrators` returns as `admin` and `operators` as
      `operator`.  The privilege TIER is carried — the render puts the
      administrator in `group=full` and the operator in `group=read` — but the
      literal role does not survive, and `read` is a strictly read-only group.
      Recorded `lossy` rather than `unsupported` because the account and its
      tier both arrive.  Re-check which group each migrated account lands in
      before handing the box to an operations team; neither matrix declares
      anything for local users, so nothing but this measurement is warning you.
    references: [aoscx-routeros-surface]

  "local_users[].hashed_password":
    disposition: lossy
    reason: >
      Drifts on all 7 account records, and the round-trip shows something the
      drift count alone hides.  AOS-CX stores the user secret in its own
      encrypted form — an `AQB…`-prefixed ciphertext blob of roughly 180
      characters, neither a crypt(3) hash nor anything RouterOS can consume.
      The renderer does not drop it: on 7 of 7 cells it echoes the blob
      VERBATIM into a RouterOS `password=` field, which is a plaintext
      credential slot, and the re-parse then recovers no password at all.  Two
      consequences, both worth acting on.  First, every migrated account
      arrives without a working credential — set passwords on the target
      before cutover or the accounts are unusable.  Second, the rendered
      artifact carries operator-traceable key material in a plaintext field,
      so treat a rendered RouterOS config from an AOS-CX source as a secret
      and store it accordingly.  The ciphertext is deliberately NOT quoted
      here or in the reference note; a document that reproduces the value it
      describes defeats its own redaction.
    references: [aoscx-routeros-surface]

  # -- Fabric ---------------------------------------------------------------

  "vxlan_vnis[].vni":
    disposition: unsupported
    reason: >
      A total drop, verified by round-trip on all 3 cells that populate VXLAN:
      4 VNI records go in (VNI 11 on each leaf cell, 10010 and 10020 on the
      kitchen-sink) and 0 come out.  mikrotik_routeros declares
      `/vxlan-vnis/vni` unsupported outright — "RouterOS VXLAN exists but is
      rare in canonical scope and not modelled in v1" — along with
      `/vxlan-vnis/source-interface` and `/vxlan-vnis/udp-port`.  Recorded
      `unsupported` rather than `lossy` per #436: the record vanishes, so
      warning-and-continuing would misrepresent it.  An AOS-CX leaf carrying
      an overlay has no target-side equivalent in this migration at all —
      that is an architecture decision, not a cutover checklist item.
    references: [aoscx-routeros-surface]

  "vxlan_vnis[].vlan_id":
    disposition: unsupported
    reason: >
      Same total drop as `vxlan_vnis[].vni` and for the same reason — the
      VNI-to-VLAN binding is an attribute of a record the target does not
      emit, so all 4 bindings vanish with their parents on 3 of 7 cells.  No
      separate mechanism, no separate remedy.
    references: [aoscx-routeros-surface]

  "vxlan_vnis[].mcast_group":
    disposition: unsupported
    reason: >
      Blocked on both sides, though the parent drop is what decides it.
      aruba_aoscx declares `/vxlan-vnis/mcast-group` lossy in its own right,
      and every AOS-CX fixture that carries VXLAN uses ingress replication, so
      all 4 records carry an empty group; the target then drops the whole
      parent record regardless.  Recorded `unsupported` to match its parent
      rather than `not_applicable`, because the record really is dropped on 3
      of 7 cells rather than never emitted.
    references: [aoscx-routeros-surface]

  evpn_type5_routes:
    disposition: not_applicable
    note: >
      Not populated on any cell of this pair, and neither codec declares
      anything at `/evpn-type5-routes` — an AOS-CX aggregation switch is not
      an EVPN border-leaf and RouterOS does not model the overlay at all.  The
      canonical field stays empty on both sides.
    references: [aoscx-routeros-surface]

  anycast_gateway_mac:
    disposition: unsupported
    reason: >
      A total drop on all 5 cells that populate it: the fabric-wide MAC is
      present in the source and empty after the round-trip, every time.
      mikrotik_routeros declares `/anycast-gateway-mac` unsupported —
      "parses-and-ignores in v1", with wire-up scheduled for v0.2.0 Wave C —
      while aruba_aoscx declares it supported, so this is a clean target-side
      block.  Recorded `unsupported` rather than `lossy` per #436.  Read it
      together with `vlans[].ipv4_addresses`: the shared MAC and the 15
      per-SVI virtual-gateway addresses it serves are BOTH lost on this pair,
      so anycast first-hop redundancy has to be rebuilt from scratch on the
      target — this is the opposite of the aruba_aoscx -> arista_eos pair,
      where the MAC survived and only the addresses did not.
    references: [aoscx-routeros-surface]

  # -- Passthrough / vendor-specific ----------------------------------------

  raw_sections:
    disposition: not_applicable
    note: >
      Not populated on any cell of this pair.  aruba_aoscx declares a lossy
      child path at `/system/raw-sections/version-banner`, but no committed
      AOS-CX fixture carries an unparsed block that survives to render, and
      mikrotik_routeros declares nothing here at all.
    references: [aoscx-routeros-surface]

  apply_groups:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair populates it."
    references: [aoscx-routeros-surface]

  group_content:
    disposition: not_applicable
    note: "Junos-specific canonical surface; neither codec in this pair populates it."
    references: [aoscx-routeros-surface]
