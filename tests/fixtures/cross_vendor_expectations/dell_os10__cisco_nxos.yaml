  interfaces[].vrrp_groups:
    disposition: lossy
    reason: >
      The anchor renders but the value does not survive the round
      trip. NX-OS expresses FHRP as HSRP (`interface VlanN / hsrp N /
      ip <vip> / priority / preempt`). The codec renders EVERY
      CanonicalVRRPGroup as an `hsrp` block regardless of the source
      `mode` discriminator, so a cross-vendor VRRP / CARP group
      normalises to HSRP on NX-OS — the operator's redundancy intent
      for the virtual IP survives, but the wire protocol changes.
      Same-vendor HSRP round-trips losslessly. Sub-second timers,
      virtual-MAC, and track objects are not modelled in v1. Measured
      over 1 cell: drifted on 1, preserved on 0, both sides empty on
      0.
    references: [os10-nxos-surface]

