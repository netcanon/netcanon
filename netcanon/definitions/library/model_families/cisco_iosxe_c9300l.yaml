  C9300L-24T-4G:
    skus: [C9300L-24T-4G]
    display_name: "Cisco Catalyst C9300L-24T-4G"
    panel: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Product Overview, Table 2 (C9300L-24T-4G: stackable 24 10/100/1000 Mbps Ethernet ports; 4x1 GE SFP fixed uplink ports; 350 WAC power supply; supports StackWise-320); Cisco IOS XE 17.12 Interface and Hardware Components Configuration Guide (Catalyst 9300 Switches), Configuring Interface Characteristics, Interface Configuration Mode (on a device with SFP uplink ports the module number is 1 and the port numbers restart: GigabitEthernet1/1/1 through GigabitEthernet1/1/4; on a Cisco Catalyst 9300L Series Switch the type can be either Gigabit Ethernet or 10-Gigabit Ethernet)"}
    ports:
      - {role: access, count: 24, prefix: GigabitEthernet, speed: gig, cage: rj45}
      - {role: uplink, count: 4, slot: "1", prefix: GigabitEthernet, speed: gig, cage: sfp}

