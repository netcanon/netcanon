      - {role: uplink, count: 2, speed: 10gig, cage: sfp+}

  # --- 12 access + 4 uplinks of two kinds: 1-12, 13-14, 15-16 ---------------
  # HPE describes this model as "12x 1Gbps Ethernet PoE+ ports and four
  # built-in uplinks (2x SFP+ and 2x 1GBASE-T)": ports 13-14 are copper
  # gigabit WITHOUT PoE, 15-16 are SFP+.  Counting 13-14 as uplinks is
  # the vendor's wording, not a property of the faceplate.
  2930F-12G-PoEP-2G-2SFPP:
    skus: [JL693A]
    display_name: "Aruba 2930F-12G-PoE+-2G/2SFP+ (JL693A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Figure 1 item 15 (photograph: 1-12, 13-14, 15-16) + Table 3; HPE QuickSpecs c05052929 V33 pp.4, 31"}
    caveat: "JL693A: port numbers are read from HPE's faceplate photograph; no device output of this model was seen. Its uplinks are two copper gigabit ports (13-14, no PoE) followed by two SFP+ (15-16)."
    ports:
      - {role: access, count: 12, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 2, speed: gig, cage: rj45}
      - {role: uplink, count: 2, speed: 10gig, cage: sfp+}

