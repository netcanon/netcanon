    ports:
      - {role: access, count: 24, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 4, speed: gig, cage: sfp}

  # --- 48 access + 4 uplinks: 1-48, 49-52 -----------------------------------
  2930F-48G-4SFPP:
    skus: [JL254A]
    display_name: "Aruba 2930F-48G-4SFP+ (JL254A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Figure 1 + Table 3; HPE QuickSpecs c05052929 V33 p.24; 2930 M/F Management and Configuration Guide 16.10 pp.642, 647-648 (JL254A member at 2/49, 2/51)"}
    ports:
      - {role: access, count: 48, speed: gig, cage: rj45}
      - {role: uplink, count: 4, speed: 10gig, cage: sfp+}

  2930F-48G-PoEP-4SFPP:
    skus: [JL256A, JL256ACM]
    display_name: "Aruba 2930F-48G-PoE+-4SFP+ (JL256A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Figure 1 + Table 3; HPE QuickSpecs c05052929 V33 p.27; HPE white paper Backplane Stacking and VSF Best Practices (AOS-S 16.08) (jl256a links 2/49-2/52); 2930 M/F Management and Configuration Guide 16.10 pp.642, 647-648"}
    ports:
      - {role: access, count: 48, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 4, speed: 10gig, cage: sfp+}

  2930F-48G-PoEP-4SFPP-TAA:
    skus: [JL264A]
    display_name: "Aruba 2930F-48G-PoE+-4SFP+ TAA (JL264A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Figure 1 (JL264A picture) + Table 3; HPE QuickSpecs c05052929 V33 p.40"}
    ports:
      - {role: access, count: 48, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 4, speed: 10gig, cage: sfp+}

  2930F-48G-4SFP:
    skus: [JL260A]
    display_name: "Aruba 2930F-48G-4SFP (JL260A)"
