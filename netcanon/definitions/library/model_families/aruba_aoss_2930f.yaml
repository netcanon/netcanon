      - {role: uplink, count: 4, speed: 10gig, cage: sfp+}

  # --- 8 access + 2 uplinks: 1-8, 9-10 --------------------------------------
  2930F-8G-PoEP-2SFPP:
    skus: [JL258A, JL258ACM]
    display_name: "Aruba 2930F-8G-PoE+-2SFP+ (JL258A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Figure 1 + Table 3; HPE QuickSpecs c05052929 V33; 2930 M/F Management and Configuration Guide 16.10 pp.642, 647-648 (JL258A member at 1/9)"}
    ports:
      - {role: access, count: 8, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 2, speed: 10gig, cage: sfp+}

  2930F-8G-PoEP-2SFPP-TAA:
    skus: [JL692A]
