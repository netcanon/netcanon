    ports:
      - {role: access, count: 48, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 4, speed: gig, cage: sfp}

  2930F-48G-740W-PoEP-4SFP:
    skus: [JL557A]
    display_name: "Aruba 2930F-48G-PoE+-4SFP 740W (JL557A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Table 3 (4 SFP); 2930F data sheet 4AA6-5469ENW (4 SFP, 104 Gb/s); HPE QuickSpecs c05052929 V33 p.42 capacity 104 Gb/s -- NOT its '4 SFP+' line"}
    ports:
      - {role: access, count: 48, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 4, speed: gig, cage: sfp}

  2930F-48G-740W-PoEP-4SFPP:
    skus: [JL558A, JL558ACM]
    display_name: "Aruba 2930F-48G-PoE+-4SFP+ 740W (JL558A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Table 3 (4 SFP+); 2930F data sheet 4AA6-5469ENW; HPE QuickSpecs c05052929 V33 p.43 (4 SFP+ 1/10GbE, 176 Gb/s); 2930 M/F Management and Configuration Guide 16.10 p.643"}
    ports:
      - {role: access, count: 48, speed: gig, cage: rj45, poe: true}
