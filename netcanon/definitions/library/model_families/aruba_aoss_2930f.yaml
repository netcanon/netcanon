    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Figure 1 (JL263A picture) + Table 3; HPE QuickSpecs c05052929 V33 p.39"}
    ports:
      - {role: access, count: 24, speed: gig, cage: rj45, poe: true}
      - {role: uplink, count: 4, speed: 10gig, cage: sfp+}

  2930F-24G-4SFP:
    skus: [JL259A]
    display_name: "Aruba 2930F-24G-4SFP (JL259A)"
    panel: {grade: vendor-doc, ref: "2930F Installation Guide 5200-1194d Figure 1 (1GbE SFP Ports, 25-28) + Table 3; HPE QuickSpecs c05052929 V33 p.33"}
    ports:
      - {role: access, count: 24, speed: gig, cage: rj45}
      - {role: uplink, count: 4, speed: gig, cage: sfp}

  2930F-24G-PoEP-4SFP:
    skus: [JL261A, JL261ACM]
