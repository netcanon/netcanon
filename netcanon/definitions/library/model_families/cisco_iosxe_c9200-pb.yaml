# Cisco Catalyst 9200 PB models (IOS XE): C9200-24PB, C9200-48PB
#
# The panels, network modules and port names of the C9200 models of
# cisco_iosxe_c9200.yaml -- that file's header says how a name is made
# and where each fact comes from -- in a family of their own for one
# reason: the Stacking and High Availability Configuration Guide, Cisco
# IOS XE Dublin 17.12.x (Catalyst 9200 Switches), says "C9200-24PB and
# C9200-48PB switch models can only be stacked with each other", and
# the data sheet that these SKUs "cannot be stacked with C9200 SKUs
# with 4VNs".  A deployment is one family, so a stack that mixes the
# two is refused.
#
# No configuration of either was seen.  What that file lists as not
# modelled is not modelled here either.
schema: 1
vendor: cisco_iosxe
family: C9200-PB
display_name: "Cisco Catalyst 9200 PB (32 virtual networks)"
naming: catalyst
default_mode: stack

modes:
  stack:
    label: "StackWise-160 stack of PB models (`switch N provision`; a switch that is alone is a stack of one)"
    member_ids: [1, 8]
    naming:
      grade: vendor-doc
      ref: "Interface and Hardware Components Configuration Guide, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches), Configuring Interface Characteristics, Interface Configuration Mode (interface type, module number and port number; switch (downlink) ports are module 0 and uplink ports module 1, where the port numbers restart; a standalone device's ports are numbered as switch 1); Command Reference, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches), interface (switch ID 1 to 8); Stacking and High Availability Configuration Guide, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches), Managing Switch Stacks (up to eight stacking-capable switches; C9200-24PB and C9200-48PB switch models can only be stacked with each other)"
    caveat: "Names carry the switch number even on a switch that is alone. A C9200-24PB or C9200-48PB stacks only with another of the two (Stacking and High Availability Configuration Guide, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches)), and Cisco does not stack switches of different license levels; the license is not checked here. The stack's own lines (switch N provision, switch priorities) describe the hardware and are not translated. No configuration of a Catalyst 9200 was seen: whether one holds an interface for the ports of a network module that is not fitted, as a C9300's does, is not established."

modules:
  C9200-NM-4G:
    description: "4-port 1G SFP network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9200 Series Switches Data Sheet, Table 3 (C9200-NM-4G: 4x 1G network module, not supported on C9200-24PXG and C9200-48PXG); Interface and Hardware Components Configuration Guide, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches), Configuring Interface Characteristics, Interface Configuration Mode (on a device with SFP uplink ports the module number is 1; the SFP module ports are GigabitEthernet1/1/1 through GigabitEthernet1/1/4)"}
    ports:
      - {role: uplink, count: 4, prefix: GigabitEthernet, speed: gig, cage: sfp}
  C9200-NM-4X:
    description: "4-port 10G SFP+ network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9200 Series Switches Data Sheet, Table 3 (C9200-NM-4X: 4x 1G/10G network module); Command Reference, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches), interface (TenGigabitEthernet, slot 0 to 1, port ranges 1 to 4, 17 to 24 and 37 to 48); Interface and Hardware Components Configuration Guide, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches), Configuring Interface Characteristics, Interface Configuration Mode (uplink ports are module 1; interface TenGigabitEthernet 1/1/1)"}
    ports:
      - {role: uplink, count: 4, prefix: TenGigabitEthernet, speed: 10gig, cage: sfp+}

deployment_ports:
  - name: GigabitEthernet0/0
    role: mgmt
    speed: gig
    cage: rj45
    notes: "Ethernet management port, one per stack: the active switch's carries the link"
    naming: {grade: vendor-doc, ref: "Interface and Hardware Components Configuration Guide, Cisco IOS XE Dublin 17.12.x (Catalyst 9200 Switches), Configuring Ethernet Management Port (the Ethernet management port, also referred to as the Gi0/0 or GigabitEthernet0/0 port; in a stack the active link is from the Ethernet management port on the active switch); Cisco Catalyst 9200 Series Switches Hardware Installation Guide, Product Overview, Rear Panel of a C9200 Switch (MGMT, RJ-45 10/100/1000 management port)"}

models:
  C9200-24PB:
    skus: [C9200-24PB]
    display_name: "Cisco Catalyst C9200-24PB"
    panel: {grade: vendor-doc, ref: "Cisco Catalyst 9200 Series Switches Hardware Installation Guide, Product Overview, Table 2 (C9200-24PB: 24x1G PoE+ ports; 4x1G and 4x10G network modules); Cisco Catalyst 9200 Series Switches Data Sheet, Table 2 (24 ports full PoE+)"}
    ports:
      - {role: access, count: 24, prefix: GigabitEthernet, speed: gig, cage: rj45, poe: true}
    bays:
      "1": {accepts: [C9200-NM-4G, C9200-NM-4X]}

  C9200-48PB:
    skus: [C9200-48PB]
    display_name: "Cisco Catalyst C9200-48PB"
    panel: {grade: vendor-doc, ref: "Cisco Catalyst 9200 Series Switches Hardware Installation Guide, Product Overview, Table 2 (C9200-48PB: 48x1G PoE+ ports; 4x1G and 4x10G network modules); Cisco Catalyst 9200 Series Switches Data Sheet, Table 2 (48 ports full PoE+)"}
    ports:
      - {role: access, count: 48, prefix: GigabitEthernet, speed: gig, cage: rj45, poe: true}
    bays:
      "1": {accepts: [C9200-NM-4G, C9200-NM-4X]}
