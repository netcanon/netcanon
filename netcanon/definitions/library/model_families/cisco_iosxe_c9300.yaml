# Cisco Catalyst 9300 and 9300X switch series (IOS XE), modular uplinks
#
# A fixed-port access switch with ONE network-module bay and a stack of
# up to eight members: StackWise-480, or StackWise-1T where every member
# is a C9300X.  DS says a C9300X "Stacks with C9300 SKUs at StackWise-480
# speeds", so the two series are one family.  Their network modules are
# not shared: HIG gives a C9300X C9300X-NM network modules only, and
# says that "C9300X network modules are supported only on C9300X
# switches".  Three facts decide every port name on it:
#
#   * Every name is `<type><switch>/<module>/<port>`, and the switch
#     number is never absent: a switch that is in no stack is switch 1,
#     and keeps any number it was given until another is assigned.
#   * The switch's own ports are module 0, numbered from 1 straight
#     through the panel whatever their type: a C9300-48UXM is
#     TwoGigabitEthernet1/0/1-36 and then TenGigabitEthernet1/0/37-48.
#   * A network module's ports are module 1 and restart at 1:
#     TenGigabitEthernet1/1/1-8 for a C9300-NM-8X.
#
# The TYPE word is stated per group of ports, from Cisco's own
# interface lists (`prefix:`), and never derived from a speed.
#
# The stack has ONE management interface, GigabitEthernet0/0: each
# member has the jack and the active switch's carries the link.  It is
# declared once, under `deployment_ports`, and belongs to no member.
#
# `ports:` lists are in PORT-NUMBER order.
#
# Sources.  Each `ref` field names its document in full, because the
# refs are served to API clients who cannot read this comment.  The
# short tags below are used in the comments of this file only:
#
#   HIG   Cisco Catalyst 9300 Series Switches Hardware Installation
#         Guide: "Product Overview" (Table 1, the C9300 models; Table 4,
#         the C9300X models; Table 5, the C9300X network modules;
#         Table 6, those modules on a C9300X-48HXN) and
#         "Installing a Network Module" ("Network Modules Overview";
#         "Network Module Port Configurations", Tables 1-9).
#   DS    Cisco Catalyst 9300 Series Switches Data Sheet, Table 2
#         ("Cisco Catalyst 9300 Series switch configurations"), Table 3
#         (network modules) and Table 5 (stacking).
#   CR    Cisco IOS XE 17.12 Command Reference (Catalyst 9300
#         Switches), "Interface and Hardware Commands", `interface`:
#         the range of switch, module and port numbers per type.
#   CG    Cisco IOS XE 17.12 Interface and Hardware Components
#         Configuration Guide (Catalyst 9300 Switches), "Configuring
#         Interface Characteristics" > "Interface Configuration Mode",
#         and "Configuring Ethernet Management Port".
#
# Where the sources disagree.  HIG Table 1 gives the C9300-48UN the
# port description that DS, CR and public device output give the
# C9300-48UXM ("12 Multigigabit Ethernet and 36 2.5 Gbps"), and the
# 48UXM the 48UN's; the two rows are swapped there, and this file
# follows DS and CR.  HIG Table 4 spells the C9300-NM-2Y's ports
# "TwentyFiveGigabitEthernet1/1/1-2"; CR and device output spell the
# type `TwentyFiveGigE`, which is what a config holds.  HIG's Product
# Overview says the C9300X-NM-4C "is supported only on C9300X-24Y"; its
# network-module chapter and DS fit it to the C9300X-24Y, -48HX and
# -48TX, and this file follows them.  HIG says each port of a
# C9300X-NM-2C or -NM-4C is a 40 GE/100 GE slot "with a QSFP+
# connector"; a cage that takes 100G is a QSFP28 one, and the cage here
# says qsfp28.
#
# Inferred, and graded so, each with its reason in its caveat:
#
#   * The names of a C9300X's own ports.  No document read names them:
#     CR names no C9300X, numbers TwentyFiveGigE ports in module 1 only
#     (1 to 2), and numbers TenGigabitEthernet ports 1 to 24 and 37 to
#     48 of module 0, which leaves out ports 25 to 36 of a 48-port
#     C9300X.  They are taken as TwentyFiveGigE<n>/0/1-12 or -24 on a Y
#     model and TenGigabitEthernet<n>/0/1-24 or -48 on an HX or TX
#     model: the types a C9300 config gives a 25G port and a 10G
#     Multigigabit one.
#
# Not modelled yet, and said here so that nobody adds it by guessing:
#
#   * The names a C9300 lists for the modules that are NOT fitted.  A
#     C9300 config holds an interface for every port of every network
#     module the bay can take (GigabitEthernet1/1/1-4,
#     TenGigabitEthernet1/1/1-8, FortyGigabitEthernet1/1/1-2,
#     TwentyFiveGigE1/1/1-2), whichever is installed; the inventory
#     lists the ports of the module that IS fitted, so the others are
#     names the config uses that the inventory does not have.  For
#     the same reason no capture claim is made: no capture's names
#     equal one deployment's ports.
#   * A breakout of a C9300-NM-2Q's QSFP+ ports.
#   * The Catalyst 3850 network modules, which DS says a C9300 also
#     takes: how a C9300 names their ports is not established here.
#   * AppGigabitEthernet<switch>/0/1, the internal app-hosting
#     interface.  It is not a port.
#   * The higher-scale models (C9300-24UB, C9300-48UB, C9300-24UXB):
#     DS says they "need to be stacked with other higher-scale
#     models", so they are a family of their own
#     (cisco_iosxe_c9300-higher-scale.yaml) and cannot share a stack
#     with the models here.
#   * The C9300L and C9300LM, whose uplinks are fixed: DS says a
#     fixed uplink model does not stack with a C9300, so they are a
#     family of their own (cisco_iosxe_c9300l.yaml).
#   * The C9300X-48HXN.  DS gives it "8x 10G Multigigabit ... + 40x 5G
#     Multigigabit", and no document read says which eight are 10G; and
#     HIG's Product Overview (Table 6) says that from 17.8.1 ports 7 and
#     8 of a C9300X-NM-8Y or -NM-8M are "permanently disabled" on it,
#     which a module of this file cannot say of one model.
#   * A breakout of a C9300X-NM-2C's or -NM-4C's ports.
#   * Which interfaces a C9300X config holds besides its ports: no
#     configuration of one was seen.
schema: 1
vendor: cisco_iosxe
family: C9300
display_name: "Cisco Catalyst 9300 and 9300X"
naming: catalyst
default_mode: stack

modes:
  stack:
    label: "StackWise-480 stack, StackWise-1T where every member is a C9300X (`switch N provision`; a switch that is alone is a stack of one)"
    member_ids: [1, 8]
    naming:
      grade: vendor-doc
      ref: "Cisco IOS XE 17.12 Interface and Hardware Components Configuration Guide (Catalyst 9300 Switches), Configuring Interface Characteristics, Interface Configuration Mode (type, stack member number, module number and port number; switch ports are module 0 and uplink ports module 1; the default device number is 1); Cisco IOS XE 17.12 Command Reference (Catalyst 9300 Switches), interface (switch numbers 1 to 8)"
    caveat: "Names carry the switch number even on a switch that is alone, and a switch keeps its number until another is assigned to it, so a lone switch can be switch 3. The stack's own lines (switch N provision, switch priorities, StackPower) describe the hardware and are not translated (the job lists each among the sections it did not translate). A C9300 config holds an interface for every port of every network module the bay can take, fitted or not; the names of a module that is not fitted are not ports of this inventory, and a job that uses them asks what to do with each. Whether a C9300X config does the same is not established: no configuration of one was seen. A C9300X stacks with a C9300 at StackWise-480 speeds and only at the same license level (Cisco Catalyst 9300 Series Switches Data Sheet); the license is not checked here."

modules:
  C9300-NM-4G:
    description: "4-port 1G SFP network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (four 1 GE SFP ports) and Network Module Port Configurations, Table 2 (configure GigabitEthernet1/1/1-4)"}
    ports:
      - {role: uplink, count: 4, prefix: GigabitEthernet, speed: gig, cage: sfp}
  C9300-NM-4M:
    description: "4-port Multigigabit network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (four Multigigabit Ethernet ports) and Network Module Port Configurations, Table 3 (configure TenGigabitEthernet1/1/1-4)"}
    ports:
      - {role: uplink, count: 4, prefix: TenGigabitEthernet, speed: 10gig, cage: rj45, notes: "Multigigabit"}
  C9300-NM-8X:
    description: "8-port 10G SFP+ network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (eight 10 GE SFP+ ports) and Network Module Port Configurations, Table 5 (configure TenGigabitEthernet1/1/1-8)"}
    ports:
      - {role: uplink, count: 8, prefix: TenGigabitEthernet, speed: 10gig, cage: sfp+}
  C9300-NM-2Q:
    description: "2-port 40G QSFP+ network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (two 40 GE QSFP+ ports) and Network Module Port Configurations, Table 1 (configure FortyGigabitEthernet1/1/1-2)"}
    caveat: "The C9300-NM-2Q is modelled as two 40G ports; a breakout of them is not modelled."
    ports:
      - {role: uplink, count: 2, prefix: FortyGigabitEthernet, speed: 40gig, cage: qsfp+}
  C9300-NM-2Y:
    description: "2-port 25G SFP28 network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (two 25 GE SFP28 ports) and Network Module Port Configurations, Table 4 (ports 1/1/1-2); Cisco IOS XE 17.12 Command Reference (Catalyst 9300 Switches), interface (TwentyFiveGigE, module 1, ports 1 to 2)"}
    ports:
      - {role: uplink, count: 2, prefix: TwentyFiveGigE, speed: 25gig, cage: sfp28}
  C9300X-NM-8M:
    description: "8-port Multigigabit network module (C9300X only)"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (eight Multigigabit Ethernet (mGig) module slots; supported only on Cisco Catalyst 9300X Series Switches) and Network Module Port Configurations, Table 8 (configure TenGigabitEthernet1/1/1-8); Cisco Catalyst 9300 Series Switches Data Sheet, Table 3 (Catalyst 9300X 8x 10G/1G Multigigabit Network Module)"}
    ports:
      - {role: uplink, count: 8, prefix: TenGigabitEthernet, speed: 10gig, cage: rj45, notes: "Multigigabit"}
  C9300X-NM-8Y:
    description: "8-port 25G SFP28 network module (C9300X only)"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (eight 25 GE/10 GE/1 GE slots with an SFP28 port in each slot; supported only on Cisco Catalyst 9300X Series Switches) and Network Module Port Configurations, Table 9 (configure TwentyFiveGigE1/1/1-8); Cisco Catalyst 9300 Series Switches Data Sheet, Table 3 (Catalyst 9300X 8x 25G/10G/1G Network Module)"}
    ports:
      - {role: uplink, count: 8, prefix: TwentyFiveGigE, speed: 25gig, cage: sfp28}
  C9300X-NM-2C:
    description: "2-port 100G/40G network module (C9300X only)"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (two 40 GE/100 GE slots with a QSFP+ connector in each slot; supported only on Cisco Catalyst 9300X Series Switches) and Network Module Port Configurations, Table 6 (configure HundredGigE1/1/1-2); Cisco Catalyst 9300 Series Switches Data Sheet, Table 3 (Catalyst 9300X 2x 100G/40G Network Module)"}
    caveat: "The C9300X-NM-2C is modelled as two 100G ports; a breakout of them is not modelled."
    ports:
      - {role: uplink, count: 2, prefix: HundredGigE, speed: 100gig, cage: qsfp28}
  C9300X-NM-4C:
    description: "4-port 100G/40G network module (C9300X-24Y, -48HX and -48TX only)"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (four 40 GE/100 GE slots with a QSFP+ connector in each slot; supported only on C9300X-24Y, C9300X-48HX, and C9300X-48TX models) and Network Module Port Configurations, Table 7 (configure HundredGigE1/1/1-4); Cisco Catalyst 9300 Series Switches Data Sheet, Table 3 (Catalyst 9300X 4x 100G/40G Network Module; compatible only with the C9300X-48HX, C9300X-48TX, and C9300X-24Y models)"}
    caveat: "The C9300X-NM-4C is modelled as four 100G ports; a breakout of them is not modelled. The data sheet and the network-module chapter of Cisco's hardware installation guide fit it to a C9300X-24Y, -48HX or -48TX; the guide's Product Overview says it is supported only on the C9300X-24Y. The first is followed here."
    ports:
      - {role: uplink, count: 4, prefix: HundredGigE, speed: 100gig, cage: qsfp28}

deployment_ports:
  - name: GigabitEthernet0/0
    role: mgmt
    speed: gig
    cage: rj45
    notes: "Ethernet management port, one per stack: the active switch's carries the link"
    naming: {grade: vendor-doc, ref: "Cisco IOS XE 17.12 Interface and Hardware Components Configuration Guide (Catalyst 9300 Switches), Configuring Ethernet Management Port (the Ethernet management port, also referred to as the Gi0/0 or GigabitEthernet0/0 port; in a stack, the management port of the active switch carries the link)"}

models:
  # --- 10/100/1000 copper: GigabitEthernet<n>/0/1-24 or -48 ---------------
  C9300-24T:
    skus: [C9300-24T]
    display_name: "Cisco Catalyst C9300-24T"
    panel: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Product Overview, Table 1 (24 10/100/1000 Mbps ports); Cisco Catalyst 9300 Series Switches Data Sheet, Table 2 (24 ports data)"}
    ports:
      - {role: access, count: 24, prefix: GigabitEthernet, speed: gig, cage: rj45}
    bays:
      "1": {accepts: [C9300-NM-4G, C9300-NM-4M, C9300-NM-8X, C9300-NM-2Q, C9300-NM-2Y]}

