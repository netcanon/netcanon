# Aruba CX 6200 (6200M and 6200F): the models with 24 or 48 RJ45 ports
# and four SFP+ or SFP uplinks
#
# A fixed-port switch, alone or one of a VSF stack of up to eight.  How
# a name is made is the 6300's (VSF, "Identifying switch ports and
# interfaces"): `<member>/1/<port>`, member 1 for a switch that is
# alone, a 6200's member 1 to 8.  Aruba's own configuration of a
# standalone JL728A has `vsf member 1`, `type jl728a`, `interface mgmt`
# and an interface for each of 1/1/1 to 1/1/52.
#
# A stack has ONE management interface, `mgmt` (VSF, "Management
# interface"), declared once under `deployment_ports`.
#
# `ports:` lists are in PORT-NUMBER order.
#
# Sources.  Each `ref` field names its document in full, because the
# refs are served to API clients who cannot read this comment.  The
# short tags below are used in the comments of this file only:
#
#   VSF   HPE Aruba Networking AOS-CX 10.18 VSF Guide, 6200 and 6300
#         Switch Series (sd00007849en_us): Identifying switch ports and
#         interfaces; Interoperation; Management interface; Applicable
#         products (the 6200 Switch Series: the 6200M's R8Q67A to
#         R8Q71A among them).
#   IG62  HPE Aruba Networking CX 6200F/M Switch Series Installation and
#         Getting Started Guide, Edition 1: Table 2 (each 6200F part
#         number and its description, the A and B revisions together);
#         the 10/100/1000 Mbps out-of-band management port.
#   JP62  HPE Japan, System Configuration Guide for HPE Aruba Networking
#         CX 6200: each model's uplink port numbers, and each 6200M part
#         number with its description.
#   GH    Aruba's central-python-workflows repository on GitHub, the
#         onboarding template of a standalone JL728A.
#
# Where the sources are silent: no HPE text read numbers the RJ45 ports
# of a 6200.  JP62 numbers the four uplinks of every model here (25-28
# on a 24-port model, 49-52 on a 48-port one); that the RJ45 ports are
# 1-24 or 1-48 is graded inferred and says so.  JP62 lists the 6200F's
# B revisions only: an A revision's uplink numbers are the B
# revision's, and say so.
#
# Not modelled yet, and said here so that nobody adds it by guessing:
#
#   * R8Q71A (36 1G and 12 Smart Rate ports, with no stated numbering)
#     and R8Q72A (the 12-port model, whose two RJ45 ports without PoE
#     are not numbered by any text read, and which stacks only with its
#     own kind).
#   * The TAA-compliant twins (R8V08A to R8V13A, S0M86A to S0M90A,
#     S0G13A to S0G17A).
#   * Whether a 6200M stacks with a 6200F: VSF's Interoperation names
#     the 6200F as a family whose models stack in any combination, and
#     its Applicable products list the 6200M in the 6200 series.  A
#     deployment that mixes them is not refused.
schema: 1
vendor: aruba_aoscx
family: "6200"
display_name: "Aruba CX 6200 (6200M and 6200F)"
naming: aoscx
default_mode: vsf

modes:
  vsf:
    label: "VSF stack of up to eight members (`vsf member`; a switch that is alone is member 1)"
    member_ids: [1, 8]
    naming:
      grade: vendor-doc
      ref: "HPE Aruba Networking AOS-CX 10.18 VSF Guide, 6200 and 6300 Switch Series (sd00007849en_us), Identifying switch ports and interfaces (a port is identified using the format member/slot/port; on a 6200 the member ranges from 1 to 8; if the switch is not a member of a VSF stack, then member is 1; the slot is always 1, as the switch is not modular; the port is the physical number of a port on the switch: the logical interface 1/1/4 is associated with physical port 4 on member 1); HPE Aruba Networking AOS-CX 10.18 VSF Guide, 6200 and 6300 Switch Series (sd00007849en_us), Applicable products (the 6200 Switch Series, the 6200M R8Q67A to R8Q71A and the 6200F among them); HPE Aruba Networking AOS-CX 10.18 VSF Guide, 6200 and 6300 Switch Series (sd00007849en_us), Interoperation (a VSF stack can include any combination of models within one supported switch family, among them the 6200F; stacking is not supported across switch families)"
    caveat: "Names carry the member number even on a switch that is alone: member 1, unless it was renumbered. Whether a 6200M stacks with a 6200F is not established by the HPE text read; a deployment that mixes them is not refused, nor is one that mixes models in any other way. The stack lines (vsf member, with its type and link lines, and vsf secondary-member) describe the hardware, and the parser does not read them. No configuration of a CX 6200 was seen."

deployment_ports:
  - name: mgmt
    role: mgmt
    speed: gig
    cage: rj45
    notes: "Out-of-band management port, one interface per VSF stack: only the conductor's is given an address"
    naming: {grade: vendor-doc, ref: "HPE Aruba Networking AOS-CX 10.18 VSF Guide, 6200 and 6300 Switch Series (sd00007849en_us), Management interface (only the management interface on the conductor switch will be assigned an IP address; the management interface is applicable only for 6200 and 6300 devices); HPE Aruba Networking CX 6200F/M Switch Series Installation and Getting Started Guide, Edition 1, Switch and Port LEDs: Labels and Description (label 9: 10/100/1000 Mbps Out-of-Band Management port); Aruba's central-python-workflows repository on GitHub (aruba/central-python-workflows, branch v2), Classic-Central/device_onboarding/device_templates/cx/template.txt (the configuration of a standalone JL728A, !Version ArubaOS-CX ML.10.07.0010) (interface mgmt)"}

