    skus: [R8Q67A]
    display_name: "Aruba CX 6200M 24G 4SFP+ Switch (R8Q67A)"
    panel: {grade: inferred, ref: "HPE Japan, System Configuration Guide for HPE Aruba Networking CX 6200 (systemconfig-cx-6200) (R8Q67A: HPE Aruba Networking CX 6200M 24G 4SFP+ Switch); HPE Japan, System Configuration Guide for HPE Aruba Networking CX 6200 (systemconfig-cx-6200) (a 24-port 6200 numbers its four SFP+ ports 25 to 28)", caveat: "R8Q67A: HPE numbers the four SFP+ ports of a 24-port 6200 25-28 (1/1/25-1/1/28 on member 1).  That its 24 RJ45 ports are 1-24 is inferred: no HPE text read numbers them, and the front-panel figure of the installation guide was not read.  No configuration of a R8Q67A was seen."}
    ports:
      - {role: access, count: 24, speed: gig, cage: rj45}
      - {role: uplink, count: 4, speed: 10gig, cage: sfp+}

