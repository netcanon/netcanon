# Cisco Catalyst 9300 higher-scale models (IOS XE): C9300-24UB,
# C9300-48UB, C9300-24UXB
#
# The same panels, network modules and port names as the C9300 models
# of cisco_iosxe_c9300.yaml -- that file's header says how a name is
# made and where each fact comes from -- in a family of their own for
# one reason: the Cisco Catalyst 9300 Series Switches Data Sheet says
# "Catalyst 9300 Series higher-scale SKUs (C9300-24UB, C9300-24UXB,
# C9300-48UB) need to be stacked with other higher-scale models".  A
# deployment is one family, so a stack that mixes the two is refused.
#
# No configuration of any of the three was seen; each model says so.
# What that file lists as not modelled is not modelled here either.
schema: 1
vendor: cisco_iosxe
family: C9300-higher-scale
display_name: "Cisco Catalyst 9300 higher-scale (B models)"
naming: catalyst
default_mode: stack

modes:
  stack:
    label: "StackWise-480 stack of higher-scale models (`switch N provision`; a switch that is alone is a stack of one)"
    member_ids: [1, 8]
    naming:
      grade: vendor-doc
      ref: "Cisco IOS XE 17.12 Interface and Hardware Components Configuration Guide (Catalyst 9300 Switches), Configuring Interface Characteristics, Interface Configuration Mode (type, stack member number, module number and port number; switch ports are module 0 and uplink ports module 1; the default device number is 1); Cisco IOS XE 17.12 Command Reference (Catalyst 9300 Switches), interface (switch numbers 1 to 8)"
    caveat: "Names carry the switch number even on a switch that is alone, and a switch keeps its number until another is assigned to it, so a lone switch can be switch 3. A higher-scale model stacks only with other higher-scale models (Cisco Catalyst 9300 Series Switches Data Sheet). The stack's own lines (switch N provision, switch priorities, StackPower) describe the hardware and are not translated. A C9300 config holds an interface for every port of every network module the bay can take, fitted or not; the names of a module that is not fitted are not ports of this inventory, and a job that uses them asks what to do with each."

modules:
  C9300-NM-4G:
    description: "4-port 1G SFP network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (four 1 GE SFP ports) and Network Module Port Configurations, Table 2 (configure GigabitEthernet1/1/1-4)"}
    ports:
      - {role: uplink, count: 4, prefix: GigabitEthernet, speed: gig, cage: sfp}
  C9300-NM-4M:
    description: "4-port Multigigabit network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (four Multigigabit Ethernet ports) and Network Module Port Configurations, Table 3 (configure TenGigabitEthernet1/1/1-4)"}
    ports:
      - {role: uplink, count: 4, prefix: TenGigabitEthernet, speed: 10gig, cage: rj45, notes: "Multigigabit"}
  C9300-NM-8X:
    description: "8-port 10G SFP+ network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (eight 10 GE SFP+ ports) and Network Module Port Configurations, Table 5 (configure TenGigabitEthernet1/1/1-8)"}
    ports:
      - {role: uplink, count: 8, prefix: TenGigabitEthernet, speed: 10gig, cage: sfp+}
  C9300-NM-2Q:
    description: "2-port 40G QSFP+ network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (two 40 GE QSFP+ ports) and Network Module Port Configurations, Table 1 (configure FortyGigabitEthernet1/1/1-2)"}
    caveat: "The C9300-NM-2Q is modelled as two 40G ports; a breakout of them is not modelled."
    ports:
      - {role: uplink, count: 2, prefix: FortyGigabitEthernet, speed: 40gig, cage: qsfp+}
  C9300-NM-2Y:
    description: "2-port 25G SFP28 network module"
    inventory: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Installing a Network Module: Network Modules Overview (two 25 GE SFP28 ports) and Network Module Port Configurations, Table 4 (ports 1/1/1-2); Cisco IOS XE 17.12 Command Reference (Catalyst 9300 Switches), interface (TwentyFiveGigE, module 1, ports 1 to 2)"}
    ports:
      - {role: uplink, count: 2, prefix: TwentyFiveGigE, speed: 25gig, cage: sfp28}

deployment_ports:
  - name: GigabitEthernet0/0
    role: mgmt
    speed: gig
    cage: rj45
    notes: "Ethernet management port, one per stack: the active switch's carries the link"
    naming: {grade: vendor-doc, ref: "Cisco IOS XE 17.12 Interface and Hardware Components Configuration Guide (Catalyst 9300 Switches), Configuring Ethernet Management Port (the Ethernet management port, also referred to as the Gi0/0 or GigabitEthernet0/0 port; in a stack, the management port of the active switch carries the link)"}

models:
  C9300-24UB:
    skus: [C9300-24UB]
    display_name: "Cisco Catalyst C9300-24UB"
    panel: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Product Overview, Table 1 (24 10/100/1000 Mbps ports); Cisco Catalyst 9300 Series Switches Data Sheet, Table 2 (24 port Cisco UPOE)"}
    caveat: "C9300-24UB: the port count and the naming rule are Cisco's for this model, but no configuration of a C9300-24UB was seen."
    ports:
      - {role: access, count: 24, prefix: GigabitEthernet, speed: gig, cage: rj45, poe: true}
    bays:
      "1": {accepts: [C9300-NM-4G, C9300-NM-4M, C9300-NM-8X, C9300-NM-2Q, C9300-NM-2Y]}

  C9300-48UB:
    skus: [C9300-48UB]
    display_name: "Cisco Catalyst C9300-48UB"
    panel: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Product Overview, Table 1 (48 10/100/1000 Mbps ports); Cisco Catalyst 9300 Series Switches Data Sheet, Table 2 (48 ports Cisco UPOE)"}
    caveat: "C9300-48UB: the port count and the naming rule are Cisco's for this model, but no configuration of a C9300-48UB was seen."
    ports:
      - {role: access, count: 48, prefix: GigabitEthernet, speed: gig, cage: rj45, poe: true}
    bays:
      "1": {accepts: [C9300-NM-4G, C9300-NM-4M, C9300-NM-8X, C9300-NM-2Q, C9300-NM-2Y]}

  C9300-24UXB:
    skus: [C9300-24UXB]
    display_name: "Cisco Catalyst C9300-24UXB"
    panel: {grade: vendor-doc, ref: "Cisco Catalyst 9300 Series Switches Hardware Installation Guide, Product Overview, Table 1 (24 Multigigabit Ethernet (100 Mbps or 1/2.5/5/10 Gbps) UPOE ports); Cisco Catalyst 9300 Series Switches Data Sheet, Table 2 (24 ports Multigigabit Cisco UPOE); Cisco IOS XE 17.12 Command Reference (Catalyst 9300 Switches), interface (TenGigabitEthernet, module 0, ports 1 to 24)"}
    caveat: "C9300-24UXB: the port count and the naming rule are Cisco's for this model, but no configuration of a C9300-24UXB was seen."
    ports:
      - {role: access, count: 24, prefix: TenGigabitEthernet, speed: 10gig, cage: rj45, poe: true, notes: "Multigigabit"}
    bays:
      "1": {accepts: [C9300-NM-4G, C9300-NM-4M, C9300-NM-8X, C9300-NM-2Q, C9300-NM-2Y]}
