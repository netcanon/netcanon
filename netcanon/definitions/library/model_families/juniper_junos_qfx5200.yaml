# Juniper QFX5200-32C
#
# A Junos port name is `type-fpc/pic/port`.  The FPC is the switch: 0 on
# its own, and in a Virtual Chassis the member id.  A QFX5200-32C runs in
# "an all QFX5200-32C Virtual Chassis with up to three members" from
# Junos 17.3R2 (HG5200); Juniper does not print the range of member ids
# (CLIREF says only that it depends on the number of switches allowed),
# and 0 to 2 is inferred from the three members.  A switch that leaves a
# Virtual Chassis keeps its member id in its names (VCUG), so the one
# mode below covers a switch on its own as well.  Every port is on PIC 0:
# 32 QSFP28 ports 0 to 31, "configured as 100 Gigabit Ethernet ports by
# default" (HG5200).
#
# The management ports are `em0` (C0, RJ-45 or SFP: "Use C0 for the em0
# interface using either RJ-45 (1000 Base-T) or fiber SFP connections")
# and `em1` (C1, SFP) (HG5200).
#
# A running-config never names the switch's model, so no detector reads
# one and no capture is claimed.
#
# Sources.  Each `ref` field names its document in full, because the
# refs are served to API clients who cannot read this comment.  The
# short tags below are used in the comments of this file only:
#
#   HG5200  Juniper, QFX5200 Switch Hardware Guide (2026-03-09).
#   JVD     Juniper Validated Designs, the Juniper/jvd repository on
#           GitHub: configurations Juniper publishes for its designs.
#   VCUG    Juniper, Virtual Chassis User Guide for Switches
#           (2026-09-21).
#   CLIREF  Juniper, CLI Reference, member (Virtual Chassis).
#
# Nothing is graded inferred but the range of member ids, which the
# mode's caveat states.
#
# Not modelled yet, and said here so that nobody adds it by guessing:
#
#   * The QFX5200-32C-L, which runs Junos OS Evolved: its management
#     interface is `re0:mgmt-0`, which does not classify.
#   * The QFX5200-48Y: HG5200 describes it, and no name of it was read.
#   * A QSFP28 port broken out into lanes, which auto-channelization
#     does when a breakout cable is plugged in.
schema: 1
vendor: juniper_junos
family: QFX5200
display_name: "Juniper QFX5200"
naming: junos
default_mode: virtual-chassis

modes:
  virtual-chassis:
    label: "Virtual Chassis of up to 3 QFX5200-32C switches, or a switch on its own (member 0, or the member id it kept when it left a Virtual Chassis); no port broken out"
    member_ids: [0, 2]
    naming:
      grade: vendor-doc
      ref: "Juniper, QFX5200 Switch Hardware Guide (2026-03-09) (QFX5200-32C: 32 QSFP28 ports 0 through 31, configured as 100 Gigabit Ethernet ports by default; an all QFX5200-32C Virtual Chassis with up to three members, from Junos 17.3R2); Juniper Validated Designs, the Juniper/jvd repository on GitHub, QFX5200-32C configurations (interfaces et-0/0/0 and et-0/0/1); Juniper, Virtual Chassis User Guide for Switches (2026-09-21) (the FPC of a member is its member ID, and a switch keeps the member ID it had in a Virtual Chassis after it leaves)"
    caveat: "Names carry the FPC, which is the member id: 0 on a switch that has never been in a Virtual Chassis, and a switch that left one keeps its id. Juniper does not print the range of member ids of a QFX5200-32C: that it is 0 to 2 is inferred from the three members it allows. A Juniper example of a preprovisioned EX4650 or QFX Series Virtual Chassis renumbers a member to 6; an id outside 0 to 2 is refused here. A QSFP28 port broken out into lanes is not modelled. The Virtual Chassis lines describe the hardware and are not translated, and the management interface of a Virtual Chassis is not on this inventory."

deployment_ports:
  - name: em0
    role: mgmt
    speed: gig
    notes: "Management port C0, RJ-45 or SFP, on the FRU end"
    naming: {grade: vendor-doc, ref: "Juniper, QFX5200 Switch Hardware Guide (2026-03-09), management panel (use C0 for the em0 interface using either RJ-45 (1000 Base-T) or fiber SFP connections)"}
  - name: em1
    role: mgmt
    speed: gig
    cage: sfp
    notes: "Management port C1, on the FRU end"
    naming: {grade: vendor-doc, ref: "Juniper, QFX5200 Switch Hardware Guide (2026-03-09), management panel (the em1-SFP management Ethernet port, C1, on the QFX5200-32C)"}

models:
  QFX5200-32C:
    skus: [QFX5200-32C]
    display_name: "Juniper QFX5200-32C, 32 QSFP28 (QFX5200-32C)"
    panel: {grade: vendor-doc, ref: "Juniper, QFX5200 Switch Hardware Guide (2026-03-09) (QFX5200-32C: 32 QSFP28 ports 0 through 31, configured as 100 Gigabit Ethernet ports by default; any of the 32 ports can be uplinks or access ports); Juniper Validated Designs, the Juniper/jvd repository on GitHub, QFX5200-32C configurations (interfaces et-0/0/0 and et-0/0/1)"}
    ports:
      - {role: uplink, count: 32, prefix: et, speed: 100gig, cage: qsfp28, notes: "Juniper: any of the 32 ports can be uplinks or access ports"}
