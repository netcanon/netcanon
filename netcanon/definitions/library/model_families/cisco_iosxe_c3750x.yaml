    panel: {grade: vendor-doc, ref: "Catalyst 3750-X and 3560-X Switch Hardware Installation Guide, Product Overview, Table 1-1 (Catalyst 3750-X-48PF-L, Catalyst 3750-X-48PF-S, Catalyst 3750-X-48PF-E: 48 10/100/1000 PoE+ ports, StackWise Plus, 1 network module slot, 1100-W power supply) and Table 1-3 (the network modules); Catalyst 3750-X and Catalyst 3560-X Switch Software Configuration Guide, Cisco IOS Release 15.0(2)SE and Later, Configuring Interface Characteristics (Gigabit Ethernet (gigabitethernet or gi) for 10/100/1000 Mb/s Ethernet ports; the 10/100/1000 port numbers always begin at 1, starting with the far left port when facing the front of the switch, for example gigabitethernet1/0/1)"}
