# Juniper QFX5120-48T
#
# A family of its own: a QFX5120 Virtual Chassis is of one model (HG5120,
# Table 6), and see the QFX5120-48Y family's file for why that makes one
# family per model.
#
# A Junos port name is `type-fpc/pic/port`.  The FPC is the switch: 0 on
# its own, and in a Virtual Chassis the member id, "0 through 1" (HG5120,
# Table 8); a 48T Virtual Chassis has up to 2 members (Table 6).  A
# switch that leaves a Virtual Chassis keeps its member id in its names
# (VCUG).  Every port is on PIC 0: 48 RJ-45 ports 0 to 47, 10G, and 6
# QSFP28 ports 48 to 53 (HG5120).
#
# The management port is `em0`, the one MGMT port, on the rear (HG5120).
#
# A running-config never names the switch's model, so no detector reads
# one and no capture is claimed.
#
# Sources.  Each `ref` field names its document in full, because the
# refs are served to API clients who cannot read this comment.  The
# short tags below are used in the comments of this file only:
#
#   HG5120  Juniper, QFX5120 Switch Hardware Guide (2026-09-30).
#   JVD     Juniper Validated Designs, the Juniper/jvd repository on
#           GitHub: configurations Juniper publishes for its designs.
#   VCUG    Juniper, Virtual Chassis User Guide for Switches
#           (2026-09-21).
#   PSET    Juniper, Interfaces User Guide for Switches, Port Settings
#           (2024-07-11; archived by the Wayback Machine on 2024-08-04).
#
# Nothing is graded inferred.  A table titled for the 48T prints its
# QSFP28 port names, `et-0/0/48` to `et-0/0/53` on PIC 0 (PSET, Table
# 15; Table 14 of the 2020-12-17 edition), and Table 12 of the same page
# gives them 100G by default.  JVD configurations of a 48T name
# `xe-0/0/0` to `xe-0/0/47` and no `et-` port.
#
# Not modelled yet, and said here so that nobody adds it by guessing:
#
#   * A QSFP28 port broken out into lanes (auto-channelization is on by
#     default; JVD writes `xe-0/0/50:0` under `channel-speed 10g`).
#   * The parts with high-voltage power supplies.
schema: 1
vendor: juniper_junos
family: QFX5120-48T
display_name: "Juniper QFX5120-48T"
naming: junos
default_mode: virtual-chassis

modes:
  virtual-chassis:
    label: "Virtual Chassis of 2 QFX5120-48T switches, or a switch on its own (member 0, or the member id it kept when it left a Virtual Chassis); no port broken out"
    member_ids: [0, 1]
    naming:
      grade: vendor-doc
      ref: "Juniper, QFX5120 Switch Hardware Guide (2026-09-30), the QFX5120-48T port panel (48 RJ-45 ports 0 through 47, 1/10G; 6 QSFP28 ports 48 through 53), Table 6 (a QFX5120-48T Virtual Chassis has up to 2 members, of the same model) and Table 8 (FPC 0 through 1, PIC 0); Juniper Validated Designs, the Juniper/jvd repository on GitHub, QFX5120-48T configurations (interfaces xe-0/0/0 to xe-0/0/47); Juniper, Virtual Chassis User Guide for Switches (2026-09-21) (a switch keeps the member ID it had in a Virtual Chassis after it leaves)"
    caveat: "Names carry the FPC, which is the member id: 0 on a switch that has never been in a Virtual Chassis, and a switch that left one keeps its id. The QSFP28 ports are auto-channelized, and a port broken out into lanes is not modelled. The Virtual Chassis lines describe the hardware and are not translated, and the management interface of a Virtual Chassis is not on this inventory."

deployment_ports:
  - name: em0
    role: mgmt
    speed: gig
    cage: rj45
    notes: "Management port, labelled MGMT, on the rear panel"
    naming: {grade: vendor-doc, ref: "Juniper, QFX5120 Switch Hardware Guide (2026-09-30), the QFX5120-48T management panel (one management port, em0)"}

models:
  QFX5120-48T:
    skus: [QFX5120-48T-AFO, QFX5120-48T-AFI, QFX5120-48T-DC-AFO, QFX5120-48T-DC-AFI]
    display_name: "Juniper QFX5120-48T, 48 10GBASE-T and 6 QSFP28 (QFX5120-48T-AFO)"
    panel: {grade: vendor-doc, ref: "Juniper, QFX5120 Switch Hardware Guide (2026-09-30) (QFX5120-48T-AFO, -AFI, -DC-AFO and -DC-AFI; 48 RJ-45 ports 0 through 47, 1/10G; 6 QSFP28 ports 48 through 53, 40/100G); Juniper, Interfaces User Guide for Switches, Port Settings (2024-07-11, archived by the Wayback Machine on 2024-08-04), Table 15, Interface Naming Convention for QSFP port on QFX5120-48T Switch (et-0/0/48 to et-0/0/53, on PIC 0), and Table 12 (ports 48 to 53 at 100G by default); Juniper Validated Designs, the Juniper/jvd repository on GitHub, QFX5120-48T configurations (interfaces xe-0/0/0 to xe-0/0/47)"}
    ports:
      - {role: access, count: 48, prefix: xe, speed: 10gig, cage: rj45}
      - {role: uplink, count: 6, prefix: et, speed: 100gig, cage: qsfp28}
