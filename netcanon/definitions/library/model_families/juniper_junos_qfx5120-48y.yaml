# Juniper QFX5120-48Y
#
# The QFX5120 models are four families, one per model, because a
# QFX5120 Virtual Chassis is of one model: "You can connect a QX5120
# switch only with another QFX5120 switch of the same model" (HG5120,
# Table 6).  One family per model is what keeps a declaration from
# mixing them.
#
# A Junos port name is `type-fpc/pic/port`.  The FPC is the switch: 0 on
# its own, and in a Virtual Chassis the member id, "0 through 1" (HG5120,
# Table 8); a 48Y Virtual Chassis has up to 2 members (Table 6).  A
# switch that leaves a Virtual Chassis keeps its member id in its names
# (VCUG), so the one mode below covers a switch on its own as well.
# Every port is on PIC 0: 48 SFP28 ports 0 to 47 and 8 QSFP28 ports 48
# to 55 (HG5120).
#
# The prefix follows the speed.  The SFP28 ports are "configured to
# operate at 10-Gbps speed by default" (HG5120), and are set to 25G or 1G
# four at a time: this file describes the default, `xe-`.  The QSFP28
# ports are 100G and auto-channelized; lanes are not modelled.
#
# The management ports are `em0` (C0) and `em1` (C1), both RJ-45 on the
# rear panel (HG5120).  This family agrees with the QFX5120-48Y target
# profile.
#
# A running-config never names the switch's model, so no detector reads
# one and no capture is claimed.
#
# Sources.  Each `ref` field names its document in full, because the
# refs are served to API clients who cannot read this comment.  The
# short tags below are used in the comments of this file only:
#
#   HG5120  Juniper, QFX5120 Switch Hardware Guide (2026-09-30): the
#           port panels, Table 6 (Virtual Chassis), Table 8 (CLI
#           terminology: FPC, PIC), the management panels.
#   JVD     Juniper Validated Designs, the Juniper/jvd repository on
#           GitHub: configurations Juniper publishes for its designs.
#   VCUG    Juniper, Virtual Chassis User Guide for Switches
#           (2026-09-21).
#
# Nothing is graded inferred.
#
# Not modelled yet, and said here so that nobody adds it by guessing:
#
#   * A quad of SFP28 ports set to 25G (`et-`) or 1G: the four names
#     change.  JVD configurations hold both `et-` and `xe-` names of
#     SFP28 ports in ways the chassis lines alone do not explain.
#   * A QSFP28 port broken out into lanes: a lane name does not classify.
schema: 1
vendor: juniper_junos
family: QFX5120-48Y
display_name: "Juniper QFX5120-48Y"
naming: junos
default_mode: virtual-chassis

modes:
  virtual-chassis:
    label: "Virtual Chassis of 2 QFX5120-48Y switches, or a switch on its own (member 0, or the member id it kept when it left a Virtual Chassis); each port at its default speed; no port broken out"
    member_ids: [0, 1]
    naming:
      grade: vendor-doc
      ref: "Juniper, QFX5120 Switch Hardware Guide (2026-09-30), the QFX5120-48Y port panel (48 SFP28 ports 0 through 47, configured to operate at 10-Gbps speed by default; 8 QSFP28 ports 48 through 55), Table 6 (a QFX5120-48Y Virtual Chassis has up to 2 members, of the same model) and Table 8 (FPC 0 through 1, PIC 0); Juniper Validated Designs, the Juniper/jvd repository on GitHub, QFX5120-48Y configurations (interfaces xe-0/0/0 to xe-0/0/47 and et-0/0/48 to et-0/0/55); Juniper, Virtual Chassis User Guide for Switches (2026-09-21) (a switch keeps the member ID it had in a Virtual Chassis after it leaves)"
    caveat: "Names carry the FPC, which is the member id: 0 on a switch that has never been in a Virtual Chassis, and a switch that left one keeps its id. A port's prefix follows its speed: these names are for each port at its default speed, and a quad of SFP28 ports set to 25G or 1G is named et- or ge- in its place, which is not a port of this inventory. The QSFP28 ports are auto-channelized, and a port broken out into lanes is not modelled. The Virtual Chassis lines describe the hardware and are not translated, and the management interface of a Virtual Chassis is not on this inventory."

deployment_ports:
  - name: em0
    role: mgmt
    speed: gig
    cage: rj45
    notes: "Management port C0, on the rear panel"
    naming: {grade: vendor-doc, ref: "Juniper, QFX5120 Switch Hardware Guide (2026-09-30), the QFX5120-48Y management panel (C0 is em0 and C1 is em1, both RJ-45, on the rear panel)"}
  - name: em1
    role: mgmt
    speed: gig
    cage: rj45
    notes: "Management port C1, on the rear panel"
    naming: {grade: vendor-doc, ref: "Juniper, QFX5120 Switch Hardware Guide (2026-09-30), the QFX5120-48Y management panel (C0 is em0 and C1 is em1, both RJ-45, on the rear panel)"}

models:
  QFX5120-48Y:
    skus: [QFX5120-48Y-AFO2, QFX5120-48Y-AFI2, QFX5120-48Y-DC-AFO2, QFX5120-48Y-DC-AFI2]
    display_name: "Juniper QFX5120-48Y, 48 SFP28 and 8 QSFP28 (QFX5120-48Y-AFO2)"
    panel: {grade: vendor-doc, ref: "Juniper, QFX5120 Switch Hardware Guide (2026-09-30) (QFX5120-48Y-AFO2, -AFI2, -DC-AFO2 and -DC-AFI2; 48 SFP28 ports 0 through 47, 10G by default; 8 QSFP28 ports 48 through 55, 100G); Juniper Validated Designs, the Juniper/jvd repository on GitHub, QFX5120-48Y configurations (interfaces xe-0/0/0 to xe-0/0/47 and et-0/0/48 to et-0/0/55)"}
    ports:
      - {role: access, count: 48, prefix: xe, speed: 25gig, cage: sfp28}
      - {role: uplink, count: 8, prefix: et, speed: 100gig, cage: qsfp28}
