# Netgate SG-3100 (ARM desktop firewall; end of life 2023-10)
# Dual-core Cortex-A9 @ 1.6 GHz (ARMv7)
# 2 × routed 1GbE (WAN, OPT1) + a 4-port 1GbE LAN switch
#   (Marvell 88E6141) -- six jacks, on the rear
#
# IMPORTANT -- this is pfSense Plus hardware.  OPNsense publishes amd64
# images only, and no community ARM build targets this board, so no
# OPNsense system exists to load a config onto.  The profile is kept,
# flagged, for port planning until the registry has somewhere better
# to file it; the names below are Netgate's pfSense names.
#
# Interface names (Netgate's SG-3100 I/O ports table):
#   mvneta2  -> WAN   (routed)
#   mvneta0  -> OPT1  (routed)
#   mvneta1  -> LAN   ONE interface for all four LAN jacks, which are
#                     ports of an internal switch uplinked to it
#
# There are no per-jack VLAN children in the default state (that is
# the SG-1100's scheme, on `mvneta0`).  Netgate does document optional
# per-jack VLANs for this switch -- on `mvneta1`, suggested tags
# 4081-4084 -- but only in an operator-configured 802.1Q mode, so they
# are not listed.
vendor: opnsense
model: Netgate-SG3100
display_name: "Netgate SG-3100 (WAN + OPT1 + 4-port LAN switch) - pfSense hardware"
device_class: firewall
stacking: ""
deployment_state: "pfSense Plus factory default (LAN switch in Port VLAN mode)"
evidence: inferred
evidence_ref: "Netgate SG-3100 manual, Input and Output Ports -- names documented for pfSense Plus, not for OPNsense"
caveat: "pfSense Plus hardware: OPNsense has no image for this board, official or community. These are Netgate's pfSense interface names; all four LAN jacks are the single interface mvneta1."
ports:
  - {id: "mvneta2", kind: uplink, speed: gig, notes: "WAN (routed)"}
  - {id: "mvneta0", kind: physical, speed: gig, notes: "OPT1 (routed)"}
  - {id: "mvneta1", kind: physical, speed: gig, notes: "LAN -- one interface for jacks LAN1-LAN4 (internal switch)"}
# Three OS-visible interfaces, of which only the two routed ports
# could be aggregated.
lags: {max: 1, prefix: lagg}

# OPNsense uses FreeBSD's vlan(4) interfaces; the only hard limit
# on VLAN IDs is the 802.1Q protocol ceiling (1-4094).  VLANs carried
# through the LAN switch are further limited by the switch chip (128,
# per Netgate).  No VLAN IDs are reserved on this box.
# max_local_users intentionally unset — OPNsense user config is
# software-unbounded and not a useful fit-check signal.
max_vlans: 4094
