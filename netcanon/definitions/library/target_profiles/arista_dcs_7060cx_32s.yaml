# Arista DCS-7060CX-32S
# 32 x 100GbE QSFP100 + 2 x 10GbE SFP+, Broadcom Tomahawk —
# first-generation 100G TOR.  Typical 100G-spine pairing for
# 7050SX / 7260CX leaves.  Every QSFP port breaks out.
#
# Port naming.  EOS names a single-lane port `Ethernet<port>` and a
# multi-lane (breakout-capable) port `Ethernet<port>/<lane>`.  Every
# QSFP cage on this model is multi-lane, so a cage running as one
# port is `EthernetN/1` -- there is no bare `EthernetN` for it.  Broken
# out, the same cage also has `/2`..`/4`.  This profile lists lane 1 of
# each cage.
# The two SFP+ ports are single-lane: `Ethernet33`, `Ethernet34`.
#
# Validation: tests/fixtures/real/arista_eos/lwa_dcs_7060cx_32s_eos42014.txt
# is a real DCS-7060CX-32S (`! device: arista (DCS-7060CX-32S,
# EOS-4.20.14M)`) with every QSFP cage at lane `/1` alone.  Every id
# below appears in it; tests/unit/migration/test_target_profile_evidence.py
# re-proves that on every run.  The same id set is what Arista's 7060X
# datasheet ("32x QSFP100 and 2x SFP+") and EOS manual describe, and
# what another public running-config of the model shows
# (saparikh/arista-demo snapshot0/unused/up414.cfg, commit 776baefb79,
# not committed here).
vendor: arista_eos
model: DCS-7060CX-32S
display_name: "Arista DCS-7060CX-32S (32x 100G + 2x 10G, Tomahawk)"
device_class: switch
stacking: ""
deployment_state: "every QSFP cage running as one port (lane /1)"
evidence: capture
evidence_ref: "tests/fixtures/real/arista_eos/lwa_dcs_7060cx_32s_eos42014.txt"
caveat: "A QSFP cage broken out into lanes also has EthernetN/2-/4; only lane /1 of each cage is listed."
ports:
