# Arista DCS-7050CX3-32S
# 32 x 100GbE QSFP100 + 2 x 10GbE SFP+.  Fixed 1U leaf/spine for
# 100G data-center fabrics.  Every QSFP port breaks out (4x10G,
# 4x25G or 2x50G).
#
# Port naming.  EOS names a single-lane port `Ethernet<port>` and a
# multi-lane (breakout-capable) port `Ethernet<port>/<lane>`.  Every
# QSFP cage on this model is multi-lane, so a cage running as one
# port is `EthernetN/1` -- there is no bare `EthernetN` for it.  Broken
# out, the same cage also has `/2`..`/4`.  This profile lists lane 1 of
# each cage.
# The two SFP+ ports are single-lane: `Ethernet33`, `Ethernet34`.
#
# Validation: Arista's 7050X3 datasheet (32 x QSFP100 + 2 x SFP+, every
# port breakout-capable) and EOS manual (the lane-naming rule), plus
# the platform port table for this model in SONiC (first committed
# from an arista.com address).  This is the least directly evidenced
# of the Arista profiles: no running-config of verified provenance
# was seen.
vendor: arista_eos
model: DCS-7050CX3-32S
display_name: "Arista DCS-7050CX3-32S (32x 100G QSFP28 + 2x 10G)"
device_class: switch
stacking: ""
deployment_state: "every QSFP cage running as one port (lane /1)"
evidence: vendor-doc
evidence_ref: "Arista 7050X3 datasheet (32x QSFP100 + 2x SFP+; all ports break out); EOS User Manual, Ethernet Ports (multi-lane ports are Ethernet<port>/<lane>); Arista platform port table in sonic-net/sonic-buildimage (Arista-7050CX3-32S-C32/port_config.ini). No running-config of verified provenance was seen"
caveat: "A QSFP cage broken out into lanes also has EthernetN/2-/4; only lane /1 of each cage is listed."
