# Cisco Catalyst 9300-24U
# 24 × 10/100/1000 BASE-T RJ45 + UPOE (60W/port)
# 1 × network module slot — swappable.  Common SKUs modelled below:
#   C9300-NM-8X  — 8x 10G SFP+  (preselected here; the chassis ships with no module)
#   C9300-NM-2Q  — 2x 40G QSFP+
# StackWise-480, 128 EtherChannels max.
#
# Mirrors the module-variant structure of the -24UX / -48UXM
# profiles.  The NM slot is shared with all Cat 9300 chassis.  The
# downlinks are 1G RJ45 here; on the mGig chassis they differ in
# interface TYPE NAME as well as speed (`TenGigabitEthernet` on the
# -24UX, `TwoGigabitEthernet` + `TenGigabitEthernet` on the -48UXM).
vendor: cisco_iosxe
model: C9300-24U
display_name: "Cisco Catalyst 9300-24U (1G + UPOE)"
device_class: switch
stacking: stackwise
deployment_state: "stack member 1 (the factory default; a standalone C9300 keeps whatever member number it was last given)"
evidence: vendor-doc
evidence_ref: "Cisco Catalyst 9300 Hardware Installation Guide, Product Overview; IOS XE 17.12 Interface and Hardware Components Configuration Guide (interface types and numbering); no real-device output was found for this exact model"
caveat: "Uplink ids depend on the network module fitted. A C9300 config lists every module's interface names whichever is installed, so a name appearing does not mean the port exists. An NM-2Q with 4x10G breakout cables uses TenGigabitEthernet1/1/1-8."
ports:
  - {range: "GigabitEthernet1/0/1-24", kind: physical, speed: gig, poe: true, notes: "UPOE 60W"}
  - {id: "GigabitEthernet0/0", kind: mgmt, speed: gig, notes: "OOBM (Mgmt-vrf)"}
modules:
  NM-8X:
    description: "8x 10G SFP+ uplinks (C9300-NM-8X)"
    ports:
      - {range: "TenGigabitEthernet1/1/1-8", kind: uplink, speed: 10gig, sfp: true, notes: "NM-8X SFP+ cage"}
  NM-2Q:
    description: "2x 40G QSFP+ uplinks (C9300-NM-2Q)"
    ports:
      - {range: "FortyGigabitEthernet1/1/1-2", kind: uplink, speed: 40gig, sfp: true, notes: "NM-2Q QSFP+ cage"}
lags: {max: 128, prefix: Port-channel}

# Datasheet capacity limits (IOS-XE 17.x C9300 family).
# max_local_users left unset — IOS-XE's effective limit is
# in the tens of thousands; fit-check banner stays hidden.
max_vlans: 4094
