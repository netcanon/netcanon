# Netgate SG-1100 (ARM desktop firewall)
# Marvell Armada 3720 SoC (dual-core Cortex-A53 @ 1.2 GHz)
# 3 × 1GbE jacks (WAN / LAN / OPT), all behind one Marvell 88E6141
# switch chip
#
# IMPORTANT -- this is pfSense Plus hardware.  OPNsense publishes amd64
# images only, and no community ARM build targets this board, so no
# OPNsense system exists to load a config onto.  The profile is kept,
# flagged, for port planning until the registry has somewhere better
# to file it; the names below are Netgate's pfSense names.
# OPNsense would not accept them in any case: it names VLAN devices
# `vlan0.N`, not `<parent>.<tag>`.
#
# Interface names (Netgate's SG-1100 I/O ports table).  `mvneta0` is
# the SoC MAC that uplinks to the switch; pfSense Plus exposes the
# three jacks as its factory-default switch VLANs:
#     mvneta0.4090  -> WAN
#     mvneta0.4091  -> LAN
#     mvneta0.4092  -> OPT
vendor: opnsense
model: Netgate-SG1100
display_name: "Netgate SG-1100 (3x GbE switch via mvneta0 VLAN tags) - pfSense hardware"
device_class: firewall
stacking: ""
deployment_state: "pfSense Plus factory default (switch VLANs 4090-4092)"
evidence: inferred
evidence_ref: "Netgate SG-1100 manual, Input and Output Ports -- names documented for pfSense Plus, not for OPNsense"
caveat: "pfSense Plus hardware: OPNsense publishes amd64 images only and no community ARM build targets this board. These are pfSense's names for the factory-default switch VLANs; OPNsense names VLAN devices differently (vlan0.N)."
ports:
  - {id: "mvneta0.4090", kind: uplink, speed: gig, notes: "WAN (factory default)"}
  - {id: "mvneta0.4091", kind: physical, speed: gig, notes: "LAN (factory default)"}
  - {id: "mvneta0.4092", kind: physical, speed: gig, notes: "OPT (factory default)"}
# No LAG is possible: all three ids are VLAN children of the one MAC
# (`mvneta0`) and share its single uplink.
lags: {max: 0, prefix: lagg}

# Every jack on this box is behind the switch chip, which Netgate
# says carries at most 128 VLANs -- so that, not the 802.1Q ceiling,
# is the limit here.  4090-4092 are the factory-default switch VLANs
# (editable, but best avoided for other uses).
# max_local_users intentionally unset — OPNsense's AAA/users
# config is unbounded in practice and not a useful fit-check signal.
max_vlans: 128
max_vlans_source: "Netgate SG-1100 manual, Switch Overview: the switch carries at most 128 VLANs"
