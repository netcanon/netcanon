# Aruba 2930F-48G-4SFP (JL260A)
# 48 × 10/100/1000 BASE-T RJ45 (no PoE)
# 4 × 1G SFP uplink — ports 49-52
#
# The JL260A is the "4SFP" model: its uplink cages are 1G SFP.  The
# 10G sibling is the 2930F-48G-4SFP+ (JL254A), which has the same port
# numbering.
#
# Port naming.  A 2930F has NO module slot, so there is no letter slot:
# the uplinks continue the access numbering.  With VSF disabled (the
# factory default) every port is a bare number.  With VSF enabled
# every port gains its member number as a prefix, uplinks included
# (`1/1`, `1/49` on member 1); a VSF stack holds up to 8 members (4
# before WC.16.06).  This profile describes the standalone unit; an
# `A1`-style id is never valid on a 2930F.
#
# Validation: tests/fixtures/real/aruba_aoss/
# hpe_community_2930f_wc1607_intervlan.cfg is a real JL260A
# (`; JL260A Configuration Editor`, `module 1 type jl260a`) whose VLAN
# membership lines name every port from 1 to 52.  Every id below
# appears in it; tests/unit/migration/test_target_profile_evidence.py
# re-proves that on every run.  The capture shows the port NAMES; the
# 1G uplink speed comes from the HPE QuickSpecs ("4 SFP 1G ports").
vendor: aruba_aoss
model: 2930F-48G
display_name: "Aruba 2930F-48G-4SFP (JL260A)"
device_class: switch
stacking: vsf-capable
deployment_state: "standalone (VSF disabled)"
evidence: capture
evidence_ref: "tests/fixtures/real/aruba_aoss/hpe_community_2930f_wc1607_intervlan.cfg"
caveat: "With VSF enabled every port, uplinks included, takes its member number as a prefix (49 becomes 1/49 on member 1)."
ports:
  - {range: "1-48", kind: physical, speed: gig, poe: false}
  - {range: "49-52", kind: uplink, speed: gig, sfp: true, notes: "1G SFP cage"}
lags: {max: 60, prefix: Trk}

# Capacity.  60 trunk groups (`trk1`..`trk60`): HPE data sheet,
# QuickSpecs and Management and Configuration Guides.  2048 VLANs is
# the `max-vlans` ceiling; the factory default is 256 until it is
# raised and the switch rebooted.
#
# max_local_users is deliberately unset.  HPE documents one manager and
# one operator credential plus up to 100 `aaa authorization local-user`
# accounts; which of those the local-users fit-check should count for
# an AOS-S target is undecided, and an unsourced cap is worse than none.
max_vlans: 2048
max_vlans_source: "AOS-S 16.11 2930F/2930M Advanced Traffic Management Guide: max-vlans 16-2048, factory default 256"
