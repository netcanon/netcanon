# Arista DCS-7280CR3-32P4
# 32 x 100GbE QSFP100 + 4 x 400GbE OSFP.  Spine-class routing
# platform with deep buffers, common in SP + large-enterprise DCs.
# The `P4` is four OSFP cages; QSFP-DD is the sibling `-32D4`.
#
# Port naming.  EOS names a single-lane port `Ethernet<port>` and a
# multi-lane (breakout-capable) port `Ethernet<port>/<lane>`.  Every
# QSFP and OSFP cage on this model is multi-lane, so a cage running as one
# port is `EthernetN/1` -- there is no bare `EthernetN` for it.  Broken
# out, the same cage also has `/2`..`/4` (`/2`..`/8` on the 400G cages).  This profile lists lane 1 of
# each cage.
#
# Validation: Arista's 7280R3 datasheet (32 x QSFP100 + 4 x OSFP), the
# EOS manual -- which prints `Ethernet35/1` on a DCS-7280CR3-32P4 -- and
# Arista's own platform port table for this model in SONiC.  No
# capture of this model is committed here.
vendor: arista_eos
model: DCS-7280CR3-32P4
display_name: "Arista DCS-7280CR3-32P4 (32x 100G + 4x 400G OSFP)"
device_class: switch
stacking: ""
deployment_state: "every QSFP / OSFP cage running as one port (lane /1)"
evidence: vendor-doc
evidence_ref: "Arista 7280R3 datasheet (7280CR3-32P4: 32x QSFP100 and 4x OSFP); EOS User Manual, Ethernet Ports (prints Ethernet35/1 on a DCS-7280CR3-32P4); Arista platform port table in sonic-net/sonic-buildimage (Arista-7280CR3-C32P4)"
caveat: "A cage broken out into lanes also has EthernetN/2-/4 (up to /8 on the 400G cages); only lane /1 of each cage is listed."
