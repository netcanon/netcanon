# Cisco Catalyst 9300-24UX
# 24 × Multigigabit Ethernet (100M/1G/2.5G/5G/10G) + UPOE
# 1 × network module slot — swappable.  Common SKUs modelled below:
#   C9300-NM-8X  — 8x 10G SFP+  (preselected here; the chassis ships with no module)
#   C9300-NM-2Q  — 2x 40G QSFP+
# Additional real-world SKUs (NM-4G, NM-4M, NM-2Y) are not yet
# modelled — add here as users encounter them.
# StackWise-480, 128 EtherChannels max
#
# Port naming.  The 24 multigigabit downlinks are
# `TenGigabitEthernet1/0/1`..`1/0/24` — IOS-XE names a port after its
# top speed, so a 10G-capable mGig port is not a `GigabitEthernet`.
# The leading `1` is the stack member number.  1 is the factory
# default, not an invariant: a standalone
# switch keeps its member number until someone changes it, so a unit
# pulled from a stack as member 3 is `3/0/N` on its own.
#
# Validation: tests/fixtures/real/cisco_iosxe/
# user_contrib_cat9300_iosxe1712.txt is a real C9300-24UX
# (`switch 1 provision c9300-24ux`, IOS-XE 17.12).  Every id below —
# chassis and both modules — appears in it;
# tests/unit/migration/test_target_profile_evidence.py re-proves that
# on every run.  For the 25 chassis ids that is proof the port exists.
# For the module ids it proves only that the NAME exists: IOS-XE lists
# every network module's interfaces whichever one is fitted.
vendor: cisco_iosxe
model: C9300-24UX
display_name: "Cisco Catalyst 9300-24UX (mGig 10G + UPOE)"
device_class: switch
stacking: stackwise
deployment_state: "stack member 1 (the factory default; a standalone C9300 keeps whatever member number it was last given)"
evidence: capture
evidence_ref: "tests/fixtures/real/cisco_iosxe/user_contrib_cat9300_iosxe1712.txt"
caveat: "Uplink ids depend on the network module fitted. A C9300 config lists every module's interface names whichever is installed, so a name appearing does not mean the port exists. An NM-2Q with 4x10G breakout cables uses TenGigabitEthernet1/1/1-8."
# Chassis-fixed ports — always present regardless of NM selection.
ports:
  - {range: "TenGigabitEthernet1/0/1-24", kind: physical, speed: 10gig, poe: true, notes: "mGig 100M-10G UPOE"}
  - {id: "GigabitEthernet0/0", kind: mgmt, speed: gig, notes: "OOBM (Mgmt-vrf)"}
# Swappable uplink modules.  Selecting one adds its ports to the
# chassis set; the rename-modal UI filters target-name dropdowns to
# whichever module is active.
modules:
  NM-8X:
    description: "8x 10G SFP+ uplinks (C9300-NM-8X)"
    ports:
      - {range: "TenGigabitEthernet1/1/1-8", kind: uplink, speed: 10gig, sfp: true, notes: "NM-8X SFP+ cage"}
  NM-2Q:
    description: "2x 40G QSFP+ uplinks (C9300-NM-2Q)"
    ports:
      - {range: "FortyGigabitEthernet1/1/1-2", kind: uplink, speed: 40gig, sfp: true, notes: "NM-2Q QSFP+ cage"}
lags: {max: 128, prefix: Port-channel}

# Datasheet capacity limits (IOS-XE 17.x C9300 family).
# max_local_users left unset — IOS-XE's effective limit is
# in the tens of thousands; fit-check banner stays hidden.
max_vlans: 4094
