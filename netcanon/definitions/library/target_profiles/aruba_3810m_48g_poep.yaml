# Aruba 3810M-48G-PoE+ 1-slot (JL074A)
# 48 × 10/100/1000 BASE-T RJ45 + PoE+
# 1 × flexible-module (uplink) slot and 1 × stacking-module slot.
# BOTH SHIP EMPTY.  Flexible modules modelled below:
#   JL083A  — 4-port 1G/10G SFP+   (preselected; the one HPE bundles)
#   JL078A  — 1-port 40GbE QSFP+
# Not yet modelled: JL079A (2-port 40GbE QSFP+) and JL081A (4-port
# HPE Smart Rate PoE+ module).
#
# NOT uplink modules, though they sit in the same J-number run:
# JL084A is the 3810M 4-port STACKING module and JL085A is the X371
# 250 W power supply.  Neither contributes a data port.
# (JL076A is a different chassis: the 3810M 40G 8 Smart Rate PoE+.)
#
# Port naming.  With stacking enabled every port carries its member
# number (`1/1`, `1/A1`); a 3810M that first booted WITHOUT a stacking
# module has stacking disabled, saved that way, and names the same
# ports `1`..`48` and `A1`..`A4`.  This profile describes stack
# member 1, which needs the JL084A fitted.  Up to 10 members.
#
# Validation: vendor documentation -- no 3810M capture is committed.
# HPE's 3810 / 5400R Advanced Traffic Management Guide states both
# naming rules and prints 3810M configurations in each state.
vendor: aruba_aoss
model: 3810M-48G-PoEP
display_name: "Aruba 3810M-48G-PoE+ 1-slot (JL074A)"
device_class: switch
stacking: backplane-stacking
deployment_state: "stack member 1 (stacking enabled; needs the JL084A stacking module)"
evidence: vendor-doc
evidence_ref: "Aruba 3810 / 5400R Advanced Traffic Management Guide for AOS-S 16.11, stack management chapter (port naming, stacked and standalone 3810M examples); QuickSpecs DA-15438 v28; 3810M Installation and Getting Started Guide 5998-8461b"
caveat: "A 3810M first powered on without a stacking module has stacking disabled and names the same ports 1-48 and A1-A4. The A ports exist only if the selected module is fitted; the slot ships empty."
# Chassis-fixed ports — always present regardless of the module fitted.
ports:
  - {range: "1/1-1/48", kind: physical, speed: gig, poe: true}
# Flexible (uplink) modules.  Selecting one adds its ports to the
# chassis set; the rename-modal UI filters target-name dropdowns to
# whichever module is active.  Only modules that contribute DATA
# ports belong here.
modules:
  JL083A:
    description: "4x 1G/10G SFP+ uplinks (JL083A)"
    ports:
      - {range: "1/A1-1/A4", kind: uplink, speed: 10gig, sfp: true, notes: "SFP+ cage"}
  JL078A:
    description: "1x 40GbE QSFP+ uplink (JL078A)"
    ports:
      - {id: "1/A1", kind: uplink, speed: 40gig, sfp: true, notes: "QSFP+ cage"}
lags: {max: 144, prefix: Trk}

# Capacity (AOS-S 16.11, 3810M).  144 trunk groups is confirmed
# against HPE's guides.  max_vlans 4094 is the VLAN-id range; it was
# not checked against a 3810M `max-vlans` statement.
#
# max_local_users is deliberately unset.  HPE's 3810M / 5400R Access
# Security Guide says "up to 100 local user accounts" (16 is a
# per-group cap) alongside one manager and one operator credential;
# which of those the local-users fit-check should count for an AOS-S
# target is undecided, and an unsourced cap is worse than none.
max_vlans: 4094
